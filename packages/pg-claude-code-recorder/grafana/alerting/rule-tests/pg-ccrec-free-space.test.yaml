# promtool unit tests for the pg-ccrec-free-space alert. Run by the flake check
# test-pg-claude-code-recorder-alert-rules through packages/pg-connector/grafana/check-alert-rules.sh,
# which generates rules.yml next to this file: the Grafana rule's refId A wrapped as `alert: <uid>`
# with `expr: (<A>) <op> <threshold>` (op and threshold from the refId C evaluator), the rule's `for`
# and labels, plus a recording rule `wrapped:<uid with _>` over the same expression.
#
# Time model: one sample per 1m scrape, series names carry the pg_claude_code_recorder_ prefix.
rule_files:
  - rules.yml

evaluation_interval: 1m

# The rule is deliberately UNGUARDED (design: Signals added by the second review): no up guard and no
# SYSTEM_PAUSE guard. The value is 1 per breached clause (the 20 GiB floor, 21474836480 bytes; the
# 6-hour slope predicting negative free space within 24 hours), so any value above 0 fires.
# noDataState Alerting is a Grafana field promtool cannot run; check-alert-structure.sh pins it.
tests:
  - name: free space under the floor fires critical with severity only (no guard involved)
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_state_free_bytes{job="pg-claude-code-recorder"}
        values: "10000000000x120"
    promql_expr_test:
      - expr: wrapped:pg_ccrec_free_space
        eval_time: 60m
        exp_samples:
          - labels: '{__name__="wrapped:pg_ccrec_free_space"}'
            value: 1
    alert_rule_test:
      - eval_time: 3m
        alertname: pg-ccrec-free-space
        exp_alerts: []
      - eval_time: 60m
        alertname: pg-ccrec-free-space
        exp_alerts:
          - exp_labels:
              severity: critical

  - name: unguarded - the daemon is not scraped (up 0) and a SYSTEM_PAUSE gate is active, free space is still reported low and fires
    interval: 1m
    input_series:
      - series: up{job="pg-claude-code-recorder"}
        values: "0x120"
      - series: pg_router_gates_active{type="SYSTEM_PAUSE"}
        values: "1x120"
      - series: pg_claude_code_recorder_state_free_bytes{job="pg-claude-code-recorder"}
        values: "10000000000x120"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-ccrec-free-space
        exp_alerts:
          - exp_labels:
              severity: critical

  - name: plenty of space and a flat slope never fires
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_state_free_bytes{job="pg-claude-code-recorder"}
        values: "100000000000x120"
    promql_expr_test:
      - expr: count(wrapped:pg_ccrec_free_space)
        eval_time: 60m
        exp_samples: []
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-ccrec-free-space
        exp_alerts: []

  - name: space above the floor but falling fast enough to be full within 24 hours fires on the slope
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_state_free_bytes{job="pg-claude-code-recorder"}
        values: "100000000000-1000000000x90"
    promql_expr_test:
      - expr: wrapped:pg_ccrec_free_space
        eval_time: 60m
        exp_samples:
          - labels: '{__name__="wrapped:pg_ccrec_free_space"}'
            value: 1
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-ccrec-free-space
        exp_alerts:
          - exp_labels:
              severity: critical

  - name: space above the floor falling slowly (not full within 24 hours) does not fire
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_state_free_bytes{job="pg-claude-code-recorder"}
        values: "100000000000-1000000x120"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-ccrec-free-space
        exp_alerts: []

  - name: an absent free-space series gives no sample and no Prometheus alert (Grafana pages via noDataState Alerting)
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_caught_up{job="pg-claude-code-recorder"}
        values: "1x120"
    promql_expr_test:
      - expr: count(wrapped:pg_ccrec_free_space)
        eval_time: 60m
        exp_samples: []
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-ccrec-free-space
        exp_alerts: []
