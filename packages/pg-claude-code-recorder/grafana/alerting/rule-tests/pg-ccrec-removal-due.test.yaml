# promtool unit tests for the pg-ccrec-removal-due alert. Run by the flake check
# test-pg-claude-code-recorder-alert-rules through packages/pg-connector/grafana/check-alert-rules.sh,
# which generates rules.yml next to this file: the Grafana rule's refId A wrapped as `alert: <uid>`
# with `expr: (<A>) <op> <threshold>` (op and threshold from the refId C evaluator), the rule's `for`
# and labels, plus a recording rule `wrapped:<uid with _>` over the same expression.
#
# removal_due is computed by the daemon from remove.after, remove.dueShare (0.10) and
# remove.dueEvery (30 days); the rule only reads it (> 0); for: 30m.
# Time model: one sample per 1m scrape, series names carry the pg_claude_code_recorder_ prefix.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: removal_due of 1 held past the for fires with severity warning only
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_removal_due{job="pg-claude-code-recorder"}
        values: "1x80"
    alert_rule_test:
      - eval_time: 3m
        alertname: pg-ccrec-removal-due
        exp_alerts: []
      - eval_time: 60m
        alertname: pg-ccrec-removal-due
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: removal_due of 0 never fires
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_removal_due{job="pg-claude-code-recorder"}
        values: "0x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-ccrec-removal-due
        exp_alerts: []

  - name: a due shorter than the for resolves without firing
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_removal_due{job="pg-claude-code-recorder"}
        values: "0x10 1x3 0x80"
    alert_rule_test:
      - eval_time: 12m
        alertname: pg-ccrec-removal-due
        exp_alerts: []
      - eval_time: 40m
        alertname: pg-ccrec-removal-due
        exp_alerts: []

  - name: a firing alert resolves once the operator ran removal (removal_due back to 0)
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_removal_due{job="pg-claude-code-recorder"}
        values: "1x45 0x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: pg-ccrec-removal-due
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 60m
        alertname: pg-ccrec-removal-due
        exp_alerts: []

  - name: an absent series gives no sample and no alert (noDataState OK in Grafana)
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_caught_up{job="pg-claude-code-recorder"}
        values: "1x80"
    promql_expr_test:
      - expr: count(wrapped:pg_ccrec_removal_due)
        eval_time: 30m
        exp_samples: []
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-ccrec-removal-due
        exp_alerts: []
