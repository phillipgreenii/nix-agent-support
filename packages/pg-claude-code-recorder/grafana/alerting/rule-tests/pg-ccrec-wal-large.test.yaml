# promtool unit tests for the pg-ccrec-wal-large alert. Run by the flake check
# test-pg-claude-code-recorder-alert-rules through packages/pg-connector/grafana/check-alert-rules.sh,
# which generates rules.yml next to this file: the Grafana rule's refId A wrapped as `alert: <uid>`
# with `expr: (<A>) <op> <threshold>` (op and threshold from the refId C evaluator), the rule's `for`
# and labels, plus a recording rule `wrapped:<uid with _>` over the same expression.
#
# The write-ahead log above 1 GiB (1073741824 bytes, twice the default wal.truncate_above of 512 MiB)
# for 15 minutes. 1610612736 is 1.5 GiB, 314572800 is 300 MiB (above the old 256 MiB threshold, now
# silent because the periodic TRUNCATE handles it), 25480000 is the baseline of about 24.3 MiB.
# Time model: one sample per 1m scrape, series names carry the pg_claude_code_recorder_ prefix.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a 1.5 GiB WAL held past the for fires with severity warning only
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_wal_bytes{job="pg-claude-code-recorder"}
        values: "1610612736x80"
    alert_rule_test:
      - eval_time: 10m
        alertname: pg-ccrec-wal-large
        exp_alerts: []
      - eval_time: 60m
        alertname: pg-ccrec-wal-large
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: a 300 MiB WAL (over the old 256 MiB threshold) no longer fires
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_wal_bytes{job="pg-claude-code-recorder"}
        values: "314572800x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-ccrec-wal-large
        exp_alerts: []

  - name: the baseline 24.3 MiB WAL never fires
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_wal_bytes{job="pg-claude-code-recorder"}
        values: "25480000x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-ccrec-wal-large
        exp_alerts: []

  - name: exactly 1 GiB is not above the threshold
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_wal_bytes{job="pg-claude-code-recorder"}
        values: "1073741824x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-ccrec-wal-large
        exp_alerts: []

  - name: a 10 minute breach resolves without firing (shorter than the for)
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_wal_bytes{job="pg-claude-code-recorder"}
        values: "25480000x10 1610612736x9 25480000x60"
    alert_rule_test:
      - eval_time: 25m
        alertname: pg-ccrec-wal-large
        exp_alerts: []
      - eval_time: 60m
        alertname: pg-ccrec-wal-large
        exp_alerts: []

  - name: stale data - the series stops while above the threshold and the alert resolves
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_wal_bytes{job="pg-claude-code-recorder"}
        values: "1610612736x30 stale"
    alert_rule_test:
      - eval_time: 25m
        alertname: pg-ccrec-wal-large
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 45m
        alertname: pg-ccrec-wal-large
        exp_alerts: []

  - name: an absent series gives no sample and no alert (noDataState OK in Grafana)
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_caught_up{job="pg-claude-code-recorder"}
        values: "1x80"
    promql_expr_test:
      - expr: count(wrapped:pg_ccrec_wal_large)
        eval_time: 30m
        exp_samples: []
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-ccrec-wal-large
        exp_alerts: []
