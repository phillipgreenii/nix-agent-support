# promtool unit tests for the pg-ccrec-heartbeat-stale alert. Run by the flake check
# test-pg-claude-code-recorder-alert-rules through ../../../../pg-connector/grafana/check-alert-rules.sh,
# which generates rules.yml next to this file: the Grafana rule's refId A wrapped as `alert: <uid>`
# with `expr: (<A>) <op> <threshold>` (op and threshold from the refId C evaluator), the rule's `for`
# and labels, plus a recording rule `wrapped:<uid with _>` over the same expression.
#
# Time model: one sample per 1m scrape, series names carry the pg_claude_code_recorder_ prefix.
rule_files:
  - rules.yml

evaluation_interval: 1m

# The value is the heartbeat age in seconds while the daemon is scraped (and on() up == 1), 0 otherwise.
tests:
  - name: scraped (up 1) with a heartbeat 2h old fires after the 5m for (age 7200 above 2700)
    interval: 1m
    input_series:
      - series: up{job="pg-claude-code-recorder"}
        values: "1x200"
      - series: pg_claude_code_recorder_last_sweep_timestamp_seconds{job="pg-claude-code-recorder"}
        values: "0x200"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-ccrec-heartbeat-stale
        exp_alerts: []
      - eval_time: 120m
        alertname: pg-ccrec-heartbeat-stale
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: guarded - up of 0 with the same stale heartbeat does not fire (the value is 0, so daemon-down alone pages)
    interval: 1m
    input_series:
      - series: up{job="pg-claude-code-recorder"}
        values: "0x200"
      - series: pg_claude_code_recorder_last_sweep_timestamp_seconds{job="pg-claude-code-recorder"}
        values: "0x200"
    promql_expr_test:
      - expr: count(wrapped:pg_ccrec_heartbeat_stale)
        eval_time: 120m
        exp_samples: []
      # The rule expression itself (refId A) reads 0, not absent, while the daemon is not scraped.
      - expr: (((time() - max(pg_claude_code_recorder_last_sweep_timestamp_seconds)) and on() (max(up{job="pg-claude-code-recorder"}) == 1)) or vector(0))
        eval_time: 120m
        exp_samples:
          - labels: "{}"
            value: 0
    alert_rule_test:
      - eval_time: 120m
        alertname: pg-ccrec-heartbeat-stale
        exp_alerts: []

  - name: a heartbeat that advances with the clock never fires
    interval: 1m
    input_series:
      - series: up{job="pg-claude-code-recorder"}
        values: "1x200"
      - series: pg_claude_code_recorder_last_sweep_timestamp_seconds{job="pg-claude-code-recorder"}
        values: "0+60x200"
    alert_rule_test:
      - eval_time: 120m
        alertname: pg-ccrec-heartbeat-stale
        exp_alerts: []

  - name: a heartbeat 30 minutes old (under 3 sweep intervals of 15m) does not fire
    interval: 1m
    input_series:
      - series: up{job="pg-claude-code-recorder"}
        values: "1x200"
      - series: pg_claude_code_recorder_last_sweep_timestamp_seconds{job="pg-claude-code-recorder"}
        values: "0+60x30 1800x200"
    alert_rule_test:
      - eval_time: 55m
        alertname: pg-ccrec-heartbeat-stale
        exp_alerts: []

  - name: both absent (no scrape at all) gives 0, not an alert (noDataState does not apply)
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_caught_up{job="x"}
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-ccrec-heartbeat-stale
        exp_alerts: []
