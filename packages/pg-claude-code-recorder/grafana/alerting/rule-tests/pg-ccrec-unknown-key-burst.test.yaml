# promtool unit tests for the pg-ccrec-unknown-key-burst alert. Run by the flake check
# test-pg-claude-code-recorder-alert-rules through packages/pg-connector/grafana/check-alert-rules.sh,
# which generates rules.yml next to this file: the Grafana rule's refId A wrapped as `alert: <uid>`
# with `expr: (<A>) <op> <threshold>` (op and threshold from the refId C evaluator), the rule's `for`
# and labels, plus a recording rule `wrapped:<uid with _>` over the same expression.
#
# Time model: one sample per 1m scrape, series names carry the pg_claude_code_recorder_ prefix.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: 10 new unknown keys a minute (600 an hour) fires after the 5m for
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_unknown_keys_total{job="pg-claude-code-recorder"}
        values: "0+10x200"
    alert_rule_test:
      - eval_time: 2m
        alertname: pg-ccrec-unknown-key-burst
        exp_alerts: []
      - eval_time: 120m
        alertname: pg-ccrec-unknown-key-burst
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: 1 new unknown key a minute (60 an hour) does not fire
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_unknown_keys_total{job="pg-claude-code-recorder"}
        values: "0+1x200"
    alert_rule_test:
      - eval_time: 120m
        alertname: pg-ccrec-unknown-key-burst
        exp_alerts: []

  - name: a flat counter (no new keys) does not fire
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_unknown_keys_total{job="pg-claude-code-recorder"}
        values: "5000x200"
    alert_rule_test:
      - eval_time: 120m
        alertname: pg-ccrec-unknown-key-burst
        exp_alerts: []

  - name: a series registered at zero that first jumps above 100 fires (first-appears-above-100)
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_unknown_keys_total{job="pg-claude-code-recorder",source="claude-transcript",type="other"}
        values: "0x10 150x200"
    alert_rule_test:
      - eval_time: 2m
        alertname: pg-ccrec-unknown-key-burst
        exp_alerts: []
      - eval_time: 30m
        alertname: pg-ccrec-unknown-key-burst
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: a backfill that adds no new distinct keys (counter stays at its few distinct tuples) does not fire
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_unknown_keys_total{job="pg-claude-code-recorder",source="claude-transcript",type="user"}
        values: "0 3x200"
    alert_rule_test:
      - eval_time: 120m
        alertname: pg-ccrec-unknown-key-burst
        exp_alerts: []

  - name: an absent counter gives no alert
    interval: 1m
    input_series:
      - series: pg_claude_code_recorder_caught_up{job="pg-claude-code-recorder"}
        values: "1x200"
    alert_rule_test:
      - eval_time: 120m
        alertname: pg-ccrec-unknown-key-burst
        exp_alerts: []
