# pg-claude-code-recorder unified-alerting rules (docket pg2-v77tsx, phase 7c): the service levels
# of the recorder's design ("Signals > Signal details"), as Prometheus rules over the daemon's own
# metrics (every series prefixed pg_claude_code_recorder_, catalogued in
# packages/pg-claude-code-recorder/grafana/pg_claude_code_recorder_metrics.txt) plus the Prometheus
# `up` series of the scrape target for the daemon-down and heartbeat guards.
#
# Twenty-one rules: the ten of the design's alerts table (daemon-down, heartbeat-stale, copy-lag,
# parse-stuck, held-old, format-drift (bad lines and unknown keys over lines parsed; it replaces unknown-key-burst), data-loss, removal-due, doctor-mismatch,
# control-inbox-gone; its free-space rule was removed, see alerts-delete.yaml) plus crash-share and removal-stuck of the second review, plus settle-tick-slow and field-type-mismatch, plus blocked-no-space (the recorder could not do an operation for lack of space), plus the four of the phase 1 observability work (cpu-high, wal-large, loop-stalled, request-slow), plus schema-rebuild-required and shutdown-overrun (the two Loki rules: log events, not metrics). Each uid is
# pg-ccrec-<name> (the structure check caps a uid at 40 characters), each annotation names the first
# command to run, and each uid is registered in registeredRuleUIDs of
# packages/pg-router-probe/cmd/pg-router-probe/run.go. The thresholds are the builder's calls and
# are recorded in the comment above each rule.
#
# This file is registered by darwin/modules/pg-claude-code-recorder while a daemon is deployed;
# otherwise the module registers alerts-delete.yaml, its deleteRules-only twin, in its place. The two
# files are never loaded together. check-alert-structure.sh (flake check
# test-pg-claude-code-recorder-alert-structure) pins the uid set, the uid length cap, noDataState,
# catalogued metric names and the twin; the promtool cases under rule-tests/ (flake check
# test-pg-claude-code-recorder-alert-rules) pin the PromQL behaviour.
#
# Grafana has no inhibition, so each guard is in the expression: daemon-down ends with the
# router pause guard of the pg-connector rules; heartbeat-stale and doctor-mismatch carry
# `and on() (max(up) == 1)` and read 0 while the daemon is not scraped, so they never page with
# daemon-down.
#
# Shape notes (copied from packages/pg-connector/grafana/alerting/pg-connector-github-alerts.yaml):
# condition C over refIds A (the query), B (reduce, last), C (threshold); a Prometheus rule is
# `datasourceUid: prometheus` with the boolean `instant: true`. Folder "Claude Agents"
# converges by title, so no folderUid is ever written. Annotations are static text.
apiVersion: 1
groups:
  - orgId: 1
    name: pg-claude-code-recorder
    folder: Claude Agents
    interval: 1m
    rules:
      # Daemon scraped. noDataState is Alerting (the pg-conn-github-daemon-down polarity): once the
      # daemon is deployed an absent up series means the scrape target is gone. The scrape interval is
      # 30s (darwin/modules/pg-claude-code-recorder metricsTargets), so for: 2m is four missed scrapes.
      # router pause guard: the expression is never empty. A missing up series reads 0 (`or vector(0)`),
      # and an active router pause adds 1 (`+ on() (max(level == 1) or vector(0))`), lifting the
      # value to 1 or more so the threshold (below 1) does not fire. The earlier `unless on()` form
      # returned an EMPTY result under a pause, which Grafana mapped to Alerting through
      # noDataState, paging a live daemon. Cases: rule-tests/pg-ccrec-daemon-down.test.yaml.
      - uid: pg-ccrec-daemon-down
        title: pg-claude-code-recorder daemon is down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pg-claude-code-recorder has not been scraped for over 2 minutes"
          description: "Prometheus has had no successful scrape of the recorder (up of job pg-claude-code-recorder is 0, or the series is gone) for over 2 minutes; the scrape interval is 30s, so about 4 scrapes in a row have failed. The recorder is not copying, so Claude Code files changed meanwhile are caught up on restart (no loss while remove.enable is false). Run pg-claude-code-recorder status, then read the launch agent log (launchd-stderr.log in the agent log directory). Suppressed while a pg-router router pause is active."
          logql: '{service_name="pg-claude-code-recorder"}'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '(min(up{job="pg-claude-code-recorder"}) or vector(0)) + on() (max(pg_router_resource_level{resource="router"} == 1) or vector(0))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # Heartbeat. Grafana has no inhibition, so the guard is in the expression: the value exists
      # only while the daemon is scraped (and on() up == 1), and is 0 otherwise, so a down daemon pages
      # through pg-ccrec-daemon-down alone. The gauge is registered at zero at start, so a daemon that
      # never completes a sweep reads as an enormous age. noDataState Alerting still catches Prometheus
      # itself returning nothing.
      - uid: pg-ccrec-heartbeat-stale
        title: pg-claude-code-recorder heartbeat is stale
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder last successful sweep is over 45 minutes old"
          description: "The recorder is scraped (up is 1) but last_sweep_timestamp_seconds is older than 2700 seconds (3 times the default sweep.interval of 15m): the watcher's safety-net sweep is not completing, so a missed FSEvents batch would not be caught. A literal 2700 stands for 3 x the sweep.interval default; raise it with sweep.interval. Run pg-claude-code-recorder status, then take a pprof goroutine dump (pprof.sock in the state directory)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '(((time() - max(pg_claude_code_recorder_last_sweep_timestamp_seconds)) and on() (max(up{job="pg-claude-code-recorder"}) == 1)) or vector(0))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2700]

      # Copy lag, design threshold: over 120 s for 10 minutes.
      - uid: pg-ccrec-copy-lag
        title: pg-claude-code-recorder copy lag is high
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder copy lag has been over 120 seconds for 10 minutes"
          description: "copy_lag_seconds (the age of the oldest byte the recorder has seen but not yet copied) has been above 120 seconds for over 10 minutes: copying is behind. Run pg-claude-code-recorder coverage to see which files lag, then read the recorder log for copy errors or a state directory low on space."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "max(pg_claude_code_recorder_copy_lag_seconds)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [120]

      # Parse stuck: parse lag bytes did not reach 0 at any point in 15 minutes (a healthy parser
      # catches up many times in that window); for: 10m on top of the window. The progress ratio is
      # not used: it moves whenever the copier advances, so it never stays still while a session writes.
      - uid: pg-ccrec-parse-stuck
        title: pg-claude-code-recorder parsing is stuck
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder parse lag has not reached zero for 15 minutes"
          description: "parse_lag_bytes (copied bytes not yet parsed) did not reach 0 at any point in the last 15 minutes, for 10 minutes: the parser is not catching up. A Conversation with an unparsed file is held and never removed. Run pg-claude-code-recorder coverage, then read the recorder log for parse_failed."
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "min_over_time(max(pg_claude_code_recorder_parse_lag_bytes)[15m:1m]) > 0"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Held too long. 259200 STANDS FOR the held.alertAfter default (3d).
      - uid: pg-ccrec-held-old
        title: pg-claude-code-recorder a Conversation is held too long
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder has a Conversation held for over 3 days"
          description: "oldest_held_age_seconds is above 259200 (3 days, the default held.alertAfter): a Conversation has been held, so it is never settled or removed. The literal 259200 stands for the held.alertAfter default; change it with that option. Run pg-claude-code-recorder held for the reason code and its remedy line."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "max(pg_claude_code_recorder_oldest_held_age_seconds)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [259200]

      # Format drift rate: bad lines plus new unknown keys, over the lines parsed, over a day. Removal no
      # longer judges the parse (a matching archive hash is enough), so a wrong parse is caught here instead.
      # One rule covers both signals (operator ruling, Phillip, 2026-11-05: one rate rule for bad lines and
      # unknown keys, each over lines parsed; the absolute-count unknown-key-burst rule is retired). The 1
      # percent threshold is the default of the removed format.holdRate (0.01), which this rule replaces. The
      # 15m for rides out a single evaluation spike. The 100-line floor keeps a near-idle day from alerting
      # on one bad line. unknown_keys_total counts first-seen (source, type, key) tuples, not occurrences.
      # Each signal falls back to 0 so a missing series cannot blank the sum and hide the other one.
      - uid: pg-ccrec-format-drift
        title: pg-claude-code-recorder high bad-line and unknown-key rate
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder: bad lines plus new unknown keys were over 1 percent of the lines parsed in the last day"
          description: "(bad_lines_total plus unknown_keys_total) over lines_parsed_total for the last day is above 1 percent: Claude Code probably changed its line format or added fields, or the parser regressed. Originals are still removed once their archive matches by hash, and the archive keeps every byte, so nothing is lost: run pg-claude-code-recorder coverage to see the bad lines, fix the parser, then re-parse."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "((sum(increase(pg_claude_code_recorder_bad_lines_total[1d])) or vector(0)) + (sum(increase(pg_claude_code_recorder_unknown_keys_total[1d])) or vector(0))) / (sum(increase(pg_claude_code_recorder_lines_parsed_total[1d])) > 100)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.01]

      # Data loss: any increase of any reason in an hour. Every reason series is registered at zero at
      # start, so the first increase is visible.
      - uid: pg-ccrec-data-loss
        title: pg-claude-code-recorder dropped bytes
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder dropped bytes in the last hour"
          description: "dropped_bytes_total increased in the last hour for the reason label shown: a file vanished before it was copied, a generation restarted, a snapshot version was missed, a copy was trimmed on start, or a removal raced a writer. Bytes the recorder saw but could not keep are lost. Run pg-claude-code-recorder coverage, then read the recorder log for the matching event."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "sum by (reason) (increase(pg_claude_code_recorder_dropped_bytes_total[1h]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Removal due. Removal is an operator-run command, so the recorder says when to run it:
      # removal_due is 1 when the share of settled Conversations quiet longer than remove.after is
      # over remove.dueShare (default 0.10), or quiet Conversations exist and no removal run has
      # completed within remove.dueEvery (default 30 days). The thresholds live in the daemon config,
      # not in this rule. It replaces the removal-backlog rule (a queue over 24 hours of
      # remove.maxPerHour), whose premise was automatic removal.
      - uid: pg-ccrec-removal-due
        title: pg-claude-code-recorder removal is due
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder removal is due: run remove --dry-run, then remove --all-eligible --yes"
          description: "removal_due is 1: over remove.dueShare (default 10 percent) of the settled Conversations have been quiet longer than remove.after (default 30 days), or quiet Conversations exist and no removal run completed within remove.dueEvery (default 30 days). Run pg-claude-code-recorder remove --dry-run to see what would go, then pg-claude-code-recorder remove --all-eligible --yes."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "max(pg_claude_code_recorder_removal_due)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Doctor. Alerts on a non-zero mismatch gauge or a stale last run, never on a log line. Both
      # series are registered at zero at start; a last run of 0 (never ran, first run is one
      # doctor.interval after start) is not stale, so a fresh deploy does not page, and the removal
      # readiness checklist covers it. noDataState
      # Alerting (the second-review finding) so a broken export is visible; the value is 0 while the
      # daemon is not scraped (the and on() up guard plus vector(0)), so it never pages with daemon-down.
      - uid: pg-ccrec-doctor-mismatch
        title: pg-claude-code-recorder doctor found a mismatch or is stale
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pg-claude-code-recorder doctor reports a mismatch, or its last run is over 2 days old"
          description: "doctor_mismatch_files is above 0 (a copy differs from its Claude file), or doctor_last_run_timestamp (the end of the last COMPLETED rolling cycle, not of a slice) is non-zero and older than 172800 seconds (2 days: doctor.interval plus one cycle with the default 24h interval, so the rolling doctor is not finishing cycles). A cycle that is mid-way never moves the timestamp, but doctor_mismatch_files is updated after every slice, so a find still pages within minutes. A last run of 0 means doctor has not completed a cycle yet since the state directory was created (the daemon first runs one doctor.interval after start), which the removal readiness checklist treats as not ready. Both are visible as gauges, never as a log line. A stale doctor also blocks the removal readiness checklist. Run pg-claude-code-recorder doctor (exit 11 on a mismatch; it writes doctor.json)."
          logql: '{service_name="pg-claude-code-recorder"}'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '(((max(pg_claude_code_recorder_doctor_mismatch_files) > bool 0) + ((time() - max(pg_claude_code_recorder_doctor_last_run_timestamp) > bool 172800) * (max(pg_claude_code_recorder_doctor_last_run_timestamp) > bool 0))) and on() (max(up{job="pg-claude-code-recorder"}) == 1)) or vector(0)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Control inbox gone: only state=gone (a Process that had an inbox), never never_loaded.
      - uid: pg-ccrec-control-inbox-gone
        title: pg-claude-code-recorder a Process lost its control inbox
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder has a live Process whose control inbox is gone"
          description: "control_inbox_state has at least one Process in state gone for over 10 minutes: a Claude the recorder expected to have a control inbox (the mod had loaded) no longer has one, so control through the mod is lost for it. A Claude started without the mod is never_loaded and does not page. Run pg-claude-control list."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(pg_claude_code_recorder_control_inbox_state{state="gone"})'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Crash share (second review). Numerator: crashed (the evidence classes of the crashed label:
      # exit observed, registry present, no clear or exit entry) plus the stale-at-discovery count
      # (the suspected unknowns). Denominator: all ends plus the stale discoveries (those never reach
      # conversation_end_total), under a volume floor of 20 so a quiet day cannot page. Tested against
      # the label table by check-crash-share-label-table.sh.
      - uid: pg-ccrec-crash-share
        title: pg-claude-code-recorder crashed share of Conversation ends is high
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder crashed or suspected-crashed Conversations are over 20 percent of ends in a day"
          description: "Over the last day, Conversations that ended crashed (registry file present at the exit, no /exit or /clear entry) plus those suspected after a stale registry at discovery are above 20 percent of all ends, with at least 20 ends in the day (the volume floor). A power loss or a Claude Code regression shows here. Run pg-claude-code-recorder conversations --crashed --since 1d."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '(((sum(increase(pg_claude_code_recorder_conversation_end_total{registry_present="true",exit_observed="true",clear_entry="false",exit_entry="false"}[1d])) or vector(0)) + (sum(increase(pg_claude_code_recorder_registry_stale_at_discovery_total[1d])) or vector(0))) / (((sum(increase(pg_claude_code_recorder_conversation_end_total[1d])) or vector(0)) + (sum(increase(pg_claude_code_recorder_registry_stale_at_discovery_total[1d])) or vector(0))) > 20))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.2]

      # Removal stuck: the quarantine is a seconds-long step, so an hour is stuck.
      - uid: pg-ccrec-removal-stuck
        title: pg-claude-code-recorder a file is stuck in quarantine
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder has a quarantined file older than an hour"
          description: "quarantine_oldest_age_seconds is above 3600: a file moved into the removal quarantine has not been unlinked or restored, though the quarantine step takes seconds. Nothing is lost (the file is in .pg-recorder-quarantine beside its original path). Run pg-claude-code-recorder remove --dry-run, then read the recorder log for quarantined and quarantine_orphan_found_on_start."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "max(pg_claude_code_recorder_quarantine_oldest_age_seconds)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3600]

      # Settle tick slow: the settle tick runs every 60 s, so a last tick over 60 s means ticks
      # overrun (a structural threshold, no baseline needed); for: 15m.
      - uid: pg-ccrec-settle-tick-slow
        title: pg-claude-code-recorder settle tick is slow
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder settle tick has taken over 60 seconds for 15 minutes"
          description: "settle_tick_last_duration_seconds is above 60 s, the tick interval, for 15 minutes: the settle pass is overrunning and burning CPU. Run pg-claude-code-recorder status, then read the recorder log for the settle_tick line, and take a 30 s CPU profile from the pprof socket."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "max(pg_claude_code_recorder_settle_tick_last_duration_seconds)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [60]

      # Field-type mismatch, schema v3 design: any increase in an hour. A catalogued field carried a
      # value that did not convert losslessly to its declared storage type; the typed column stays
      # NULL and only the generic fields row holds the value. The series appears when first
      # incremented (not at zero), so a first mismatch reads as no increase until the second scrape.
      - uid: pg-ccrec-field-type-mismatch
        title: pg-claude-code-recorder field value of the wrong type
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder saw a catalogued field with a value of the wrong type"
          description: "field_type_mismatch_total increased in the last hour for the source, type and field labels shown: Claude Code probably changed the type of a field the catalogue declares, so its typed column is left NULL. Run pg-claude-code-recorder coverage to see the field, then update the catalogue and re-parse."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "sum by (source, type, field) (increase(pg_claude_code_recorder_field_type_mismatch_total[1h]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Blocked for lack of space. The recorder could not do one of its own operations because the
      # volume had no room for it (operator ruling, Phillip, 2026-11-05: "it can alert me that it
      # can't do its own job because insufficient space"). It keys on the recorder's own refusal or
      # failure (blocked_no_space_total, by op), never on a host free-space level.
      - uid: pg-ccrec-blocked-no-space
        title: pg-claude-code-recorder could not do its job for lack of space
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder could not do an operation because there was no room for it"
          description: 'blocked_no_space_total increased in the last 30 minutes for the op shown (copy, parse_index, archive, removal_barrier, index_checkpoint or rebuild): the recorder tried that operation and the volume was full. Read the blocked_no_space events in the recorder log ({service_name="pg-claude-code-recorder"} | json | event="blocked_no_space") for the needed and had bytes, run pg-claude-code-recorder status, then free space in the state directory.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "sum by (op) (increase(pg_claude_code_recorder_blocked_no_space_total[30m]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # CPU high. The process CPU rate over 10 minutes above 1.0 core for 30 minutes. Value: the
      # baseline captured after the phase 1 apply was 0.405 cores averaged over the hour (highest
      # 5-minute slice 0.48); the planned rule (baseline times 2, rounded up to a whole core) gives 1.0.
      # Operator ruling (Phillip, 2026-11-04): keep 1.0 and revisit after a day of data. noDataState OK:
      # a daemon that is not scraped is covered by pg-ccrec-daemon-down.
      - uid: pg-ccrec-cpu-high
        title: pg-claude-code-recorder CPU use is high
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder has used over 1 CPU core for 30 minutes"
          description: "The rate of process_cpu_seconds_total over 10 minutes has been above 1.0 core for 30 minutes. The baseline after the phase 1 apply was 0.405 cores averaged over an hour (highest 5-minute slice 0.48), so 1.0 is the baseline times 2 rounded up to a whole core (operator ruling, Phillip, 2026-11-04: keep 1.0 and revisit after a day of data). Run pg-claude-code-recorder status to see which loop is busy, then take a 30 s CPU profile from the pprof socket (pprof.sock in the state directory)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "max(rate(pg_claude_code_recorder_process_cpu_seconds_total[10m]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1]

      # WAL large. The write-ahead log above 1 GiB (1073741824 bytes) for 15 minutes. Value: twice the
      # default wal.truncate_above (512 MiB), so the rule fires only when the periodic TRUNCATE
      # checkpoint is not working (it is attempted above 512 MiB, at most once an hour). The baseline
      # after the phase 1 apply was flat at 24.3 MiB (before the checkpoint loop the WAL reached
      # 13.9 GB), so this is a ceiling for runaway growth, not a typical value. It was 256 MiB (operator
      # ruling, Phillip, 2026-11-04) until the TRUNCATE policy landed: with a 512 MiB truncate threshold
      # a 256 MiB alert would fire before any truncation. Raise it with wal.truncate_above (twice it);
      # the literal assumes the default.
      - uid: pg-ccrec-wal-large
        title: pg-claude-code-recorder write-ahead log is large
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder write-ahead log is over 1 GiB"
          description: "wal_bytes has been above 1 GiB (1073741824 bytes, twice the default wal.truncate_above) for 15 minutes: the periodic TRUNCATE checkpoint is not shrinking the log. The baseline after the phase 1 apply was flat at 24.3 MiB. Check wal_truncate_total{outcome} (busy means a long reader blocks it). Run pg-claude-code-recorder status, then read the recorder log for wal_checkpoint_failed lines (a long reader holds the checkpoint back)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "max(pg_claude_code_recorder_wal_bytes)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1073741824]

      # Loop stalled, per loop (the loop label stays on the result, so the alert names the loop). A loop
      # is stalled when a pass has run over 600 s (loop_in_flight_seconds, every loop) or, for the loops
      # with a bound, the time since its last pass ended is over that loop's literal bound, for 10m. The
      # literals equal the bounds defined once in code (internal/obs/stall.go), which a Go test
      # compares with this expression:
      #   watcher_sweep   2700 s: 3 x the default sweep.interval of 15m; a literal that ASSUMES the
      #                   default (raise it with sweep.interval). Operator ruling (Phillip, 2026-11-04).
      #   tracker_tick, tracker_poll   120 s: a literal, many times the process.livenessInterval default of 5 s the tracker loops tick at.
      #   status_refresh  60 s: a literal, over the status_refresh pause (statusRefreshEvery in internal/serve) plus a pass.
      # parser_drain has no age bound (it is event-driven and may idle indefinitely); settle_tick,
      # refresh_gauges, wal_checkpoint, copier_ingest, doctor and removal_pass have none either and are
      # judged by the in-flight clause alone (settle-tick-slow stays the settle-specific rule). A loop
      # that has not completed a pass yet reads 0 and is skipped (the `> 0` filter). The `up` guard
      # keeps the rule from paging beside daemon-down while the lookback still serves old samples.
      # Each clause is a filter, so a result is the age or in-flight seconds of a stalled loop only.
      - uid: pg-ccrec-loop-stalled
        title: pg-claude-code-recorder a loop is stalled
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder loop {{ $labels.loop }} is stalled"
          description: "The {{ $labels.loop }} loop has a pass running over 600 s, or its last pass ended longer ago than its bound (watcher_sweep 2700 s, which assumes the default sweep.interval of 15m times 3; tracker_tick and tracker_poll 120 s; status_refresh 60 s), for 10 minutes. Run pg-claude-code-recorder status to see the loop table, then take a pprof goroutine dump (pprof.sock in the state directory) to see where {{ $labels.loop }} is blocked."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '((time() - (pg_claude_code_recorder_loop_last_timestamp_seconds{loop="watcher_sweep"} > 0)) > 2700 or (time() - (pg_claude_code_recorder_loop_last_timestamp_seconds{loop=~"tracker_tick|tracker_poll"} > 0)) > 120 or (time() - (pg_claude_code_recorder_loop_last_timestamp_seconds{loop="status_refresh"} > 0)) > 60 or pg_claude_code_recorder_loop_in_flight_seconds > 600) and on() (max(up{job="pg-claude-code-recorder"}) == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Request slow, a ratio: requests over 10 s divided by all requests over 1 h, summed over every
      # op, above 2 percent, with a floor of 50 requests in the hour (the divisor is filtered, so a quiet
      # hour is empty, never a division of small numbers). Value: the baseline after the phase 1 apply
      # was 5 of 417 requests (1.2 percent) over 10 s, so 2 percent is within a factor of 2 of it.
      - uid: pg-ccrec-request-slow
        title: pg-claude-code-recorder requests are slow
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder over 2 percent of requests took over 10 seconds in the last hour"
          description: "Requests that took over 10 s are above 2 percent of all requests in the last hour (at least 50 requests, summed over every op). The baseline after the phase 1 apply was 1.2 percent (5 of 417), so this can fire now; it is meant to stop firing after phases 2, 3 and 5 of the recorder's design. Run pg-claude-code-recorder status, then read the recorder log for slow_request lines, which name the op."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '((sum(increase(pg_claude_code_recorder_query_duration_seconds_count[1h])) - sum(increase(pg_claude_code_recorder_query_duration_seconds_bucket{le="10"}[1h]))) / (sum(increase(pg_claude_code_recorder_query_duration_seconds_count[1h])) > 50))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.02]

      # Schema rebuild required. serve refuses to start (exit 20) when index.db carries an older
      # schema_version than the binary needs and logs one schema_rebuild_required error event; the
      # launch agent does not restart it after that refusal, so there is no metric (the process is
      # gone) and the only signal besides daemon-down is that log line, shipped to Loki by the
      # pg-claude-code-recorder logSource. Any one event in the last hour fires; it clears an hour
      # after the last refusal, so the daemon-down rule is what stays up until the operator acts.
      # Tested by logcli over rule-tests/loki/pg-ccrec-schema-rebuild-required.{positive,negative}.jsonl
      # (check-loki-rules.sh, flake check test-pg-claude-code-recorder-alert-loki-rules).
      - uid: pg-ccrec-schema-rebuild-required
        title: pg-claude-code-recorder needs a schema rebuild
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder refused to start: index.db has an older schema than the binary needs"
          description: 'serve logged schema_rebuild_required in the last hour and exited 8; the launch agent does not restart it, so the recorder is not running and nothing is being recorded. Run pg-claude-code-recorder rebuild (it takes hours and sets the old index.db aside as index.db.pre-rebuild), then start the launch agent again. The event fields found and known name the two schema versions; read them with {service_name="pg-claude-code-recorder"} | json | event="schema_rebuild_required".'
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({service_name="pg-claude-code-recorder"} | json | event="schema_rebuild_required" [1h]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Shutdown overrun. The daemon bounds its shutdown with a deadline; when a stop does not finish
      # in time it logs one shutdown_overrun error event (fields phase, phase_elapsed_ms, in_flight and
      # the sweep counters) and exits non-zero, and the launch agent restarts it. The restart recovers
      # by itself, so this is a warning: it says a stop was slow enough to be cut short, not that
      # data is lost. Any one event in the last 24 hours fires it. The event is written by a
      # separate change, so noDataState is OK and the rule stays quiet until the first such line.
      # Tested by logcli over rule-tests/loki/pg-ccrec-shutdown-overrun.{positive,negative}.jsonl
      # (check-loki-rules.sh, flake check test-pg-claude-code-recorder-alert-loki-rules).
      - uid: pg-ccrec-shutdown-overrun
        title: pg-claude-code-recorder shutdown overran its deadline
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-claude-code-recorder was cut short: a shutdown overran its deadline in the last 24 hours"
          description: 'serve logged shutdown_overrun in the last 24 hours: a stop did not finish before the deadline, so the daemon exited non-zero and the launch agent restarted it. Nothing needs doing for one event; repeated events mean a step of the shutdown is stuck. Read the fields phase, phase_elapsed_ms and in_flight with {service_name="pg-claude-code-recorder"} | json | event="shutdown_overrun" to see where it was, and the shutdown_phase events before it for the slow steps (see pg-claude-code-recorder status).'
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({service_name="pg-claude-code-recorder"} | json | event="shutdown_overrun" [24h]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
