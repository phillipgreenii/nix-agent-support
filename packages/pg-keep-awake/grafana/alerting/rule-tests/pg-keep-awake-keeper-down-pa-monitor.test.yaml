# promtool unit tests for the pg-keep-awake-keeper-down-pa-monitor alert (packet pg2-8bgxg.2.19).
# Run by the flake check test-pg-keep-awake-alert-rules (see the other test file for the
# wrapping). The gauge is pa-monitor's pa_monitor_keep_awake_keeper_up, pushed once per tick: 1
# while `pg-keep-awake status --check` says the keeper runs, 0 when it is down or cannot be asked.
# The rule is `min(...) < 1` with `for: 5m`, so it never reads a keeper series.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a keeper reported down for 10m fires after 5m, not before
    interval: 1m
    input_series:
      - series: pa_monitor_keep_awake_keeper_up
        values: "1x30 0x10 1x100"
    alert_rule_test:
      - eval_time: 33m
        alertname: pg-keep-awake-keeper-down-pa-monitor
        exp_alerts: []
      - eval_time: 37m
        alertname: pg-keep-awake-keeper-down-pa-monitor
        exp_alerts:
          - exp_labels:
              severity: critical
      - eval_time: 45m
        alertname: pg-keep-awake-keeper-down-pa-monitor
        exp_alerts: []

  - name: a keeper reported up never fires
    interval: 1m
    input_series:
      - series: pa_monitor_keep_awake_keeper_up
        values: "1x240"
    alert_rule_test:
      - eval_time: 120m
        alertname: pg-keep-awake-keeper-down-pa-monitor
        exp_alerts: []

  - name: a 3m blip down does not fire
    interval: 1m
    input_series:
      - series: pa_monitor_keep_awake_keeper_up
        values: "1x30 0x3 1x100"
    alert_rule_test:
      - eval_time: 36m
        alertname: pg-keep-awake-keeper-down-pa-monitor
        exp_alerts: []

  - name: no series at all (pa-monitor not running) does not fire
    interval: 1m
    input_series:
      - series: pa_monitor_keep_awake_keeper_up
        values: "1x30 _x210"
    alert_rule_test:
      - eval_time: 90m
        alertname: pg-keep-awake-keeper-down-pa-monitor
        exp_alerts: []

  - name: the signal fires while the keeper's own series are gone
    interval: 1m
    input_series:
      - series: pg_keep_awake_keeper_up
        values: "1x30 _x210"
      - series: pa_monitor_keep_awake_keeper_up
        values: "1x30 0x210"
    alert_rule_test:
      - eval_time: 45m
        alertname: pg-keep-awake-keeper-down-pa-monitor
        exp_alerts:
          - exp_labels:
              severity: critical
