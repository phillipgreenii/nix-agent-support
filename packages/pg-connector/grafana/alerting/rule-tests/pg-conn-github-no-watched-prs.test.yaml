# promtool unit tests for the pg-conn-github-no-watched-prs alert (PR lane refactor, P8b-1). Run by the
# flake check test-pg-connector-github-alert-rules, which generates rules.yml next to this file: the
# Grafana rule's refId A wrapped as `alert: <uid>` with
# `expr: (max(pg_desk_pr_open_anchors) > 0 and on() (max(pg_connector_github_watched_entities) == 0) unless on() (SYSTEM_PAUSE guard)) > 0`,
# the rule's `for: 30m` and labels, plus a recording rule `wrapped:<uid with _>`.
#
# Time model: one gauge sample per 1m scrape. pg_connector_github_watched_entities is the daemon's
# unlabelled watched gauge; pg_desk_pr_open_anchors is pg-desk's unlabelled open-anchor gauge (PRs with
# an open anchor, hidden ones excluded). The rule's value is the open-anchor count while nothing is
# watched. A firing alert carries severity only (both sides are unlabelled).
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: nothing watched while 3 PRs have open anchors fires after the 30m for, with the anchor count
    interval: 1m
    input_series:
      - series: pg_connector_github_watched_entities{service_name="pg-connector-github",job="pg-connector-github"}
        values: "0x80"
      - series: pg_desk_pr_open_anchors{job="pg-desk"}
        values: "3x80"
    promql_expr_test:
      - expr: max(wrapped:pg_conn_github_no_watched_prs)
        eval_time: 40m
        exp_samples:
          - labels: "{}"
            value: 3
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-conn-github-no-watched-prs
        exp_alerts: []
      - eval_time: 40m
        alertname: pg-conn-github-no-watched-prs
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: a watched set below the open-anchor count is not this rule's business (the lower bound is only 0)
    interval: 1m
    input_series:
      - series: pg_connector_github_watched_entities{service_name="pg-connector-github",job="pg-connector-github"}
        values: "1x80"
      - series: pg_desk_pr_open_anchors{job="pg-desk"}
        values: "40x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-conn-github-no-watched-prs
        exp_alerts: []

  - name: healthy, PRs watched and anchors open, is quiet
    interval: 1m
    input_series:
      - series: pg_connector_github_watched_entities{service_name="pg-connector-github",job="pg-connector-github"}
        values: "25x80"
      - series: pg_desk_pr_open_anchors{job="pg-desk"}
        values: "3x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-conn-github-no-watched-prs
        exp_alerts: []

  - name: nothing watched and no open anchors is quiet
    interval: 1m
    input_series:
      - series: pg_connector_github_watched_entities{service_name="pg-connector-github",job="pg-connector-github"}
        values: "0x80"
      - series: pg_desk_pr_open_anchors{job="pg-desk"}
        values: "0x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-conn-github-no-watched-prs
        exp_alerts: []

  - name: a missing watched gauge (no daemon series) is quiet, the daemon-down rule speaks for it
    interval: 1m
    input_series:
      - series: pg_desk_pr_open_anchors{job="pg-desk"}
        values: "3x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-conn-github-no-watched-prs
        exp_alerts: []

  - name: a missing open-anchor gauge (pg-desk cannot answer) is quiet
    interval: 1m
    input_series:
      - series: pg_connector_github_watched_entities{service_name="pg-connector-github",job="pg-connector-github"}
        values: "0x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-conn-github-no-watched-prs
        exp_alerts: []

  - name: empty input is quiet
    interval: 1m
    input_series:
      - series: unrelated_metric{job="other"}
        values: "1x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-conn-github-no-watched-prs
        exp_alerts: []

  - name: a gap shorter than the 30m for never fires
    interval: 1m
    input_series:
      - series: pg_connector_github_watched_entities{service_name="pg-connector-github",job="pg-connector-github"}
        values: "0x10 25x70"
      - series: pg_desk_pr_open_anchors{job="pg-desk"}
        values: "3x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-conn-github-no-watched-prs
        exp_alerts: []

  - name: SYSTEM_PAUSE suppresses it
    interval: 1m
    input_series:
      - series: pg_connector_github_watched_entities{service_name="pg-connector-github",job="pg-connector-github"}
        values: "0x80"
      - series: pg_desk_pr_open_anchors{job="pg-desk"}
        values: "3x80"
      - series: pg_router_gates_active{type="SYSTEM_PAUSE",job="pg-router"}
        values: "1x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-conn-github-no-watched-prs
        exp_alerts: []
