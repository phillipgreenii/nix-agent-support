# promtool unit tests for the pg-conn-github-spend-over-cap alert. Run by the flake check
# test-pg-connector-github-alert-rules, which generates rules.yml next to this file: the Grafana
# rule's refId A wrapped as `alert: <uid>` with
# `expr: (sum(increase(pg_connector_github_budget_spent{bucket="graphql"}[1h]))) > 4000`, the
# rule's `for: 5m` and labels, plus a recording rule `wrapped:<uid with _>`.
#
# Time model: counters are written the way the collector delivers them, one sample per 1m scrape,
# no _total suffix, with the labels bucket, purpose and group (group may be `none`) plus
# service_name and job. `0+64x120` is 64 points a minute, so 3840 an hour; the 1h increase is
# read at 90m, when the window holds only steady-state history. `sum()` has no `by`, so a firing
# alert carries severity only. The literal 4000 stands for the cutover graphql_points_per_hour (the shadow run used 1500).
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: 4200 points an hour on the graphql bucket fires after the for, with severity only
    interval: 1m
    input_series:
      - series: pg_connector_github_budget_spent{bucket="graphql",purpose="refresh",group="none",service_name="pg-connector-github",job="pg-connector-github"}
        values: "0+70x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: pg-conn-github-spend-over-cap
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: 3840 points an hour, just under the 4000 cap, does not fire
    interval: 1m
    input_series:
      - series: pg_connector_github_budget_spent{bucket="graphql",purpose="refresh",group="none",service_name="pg-connector-github",job="pg-connector-github"}
        values: "0+64x120"
    promql_expr_test:
      - expr: count(wrapped:pg_conn_github_spend_over_cap)
        eval_time: 90m
        exp_samples: []
    alert_rule_test:
      - eval_time: 90m
        alertname: pg-conn-github-spend-over-cap
        exp_alerts: []

  - name: a REST bucket series alone, however large, does not fire (graphql bucket only)
    interval: 1m
    input_series:
      - series: pg_connector_github_budget_spent{bucket="rest_core",purpose="refresh",group="none",service_name="pg-connector-github",job="pg-connector-github"}
        values: "0+500x120"
      - series: pg_connector_github_budget_spent{bucket="rest_search",purpose="query",group="none",service_name="pg-connector-github",job="pg-connector-github"}
        values: "0+500x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: pg-conn-github-spend-over-cap
        exp_alerts: []

  - name: REST spend does not push a graphql spend under the cap over it
    interval: 1m
    input_series:
      - series: pg_connector_github_budget_spent{bucket="graphql",purpose="refresh",group="none",service_name="pg-connector-github",job="pg-connector-github"}
        values: "0+64x120"
      - series: pg_connector_github_budget_spent{bucket="rest_core",purpose="refresh",group="none",service_name="pg-connector-github",job="pg-connector-github"}
        values: "0+500x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: pg-conn-github-spend-over-cap
        exp_alerts: []

  - name: graphql series of different purposes and groups are summed (each alone is under the cap, together over it)
    interval: 1m
    input_series:
      # 36 a minute each is 2160 an hour, 4320 together.
      - series: pg_connector_github_budget_spent{bucket="graphql",purpose="refresh",group="mine",service_name="pg-connector-github",job="pg-connector-github"}
        values: "0+36x120"
      - series: pg_connector_github_budget_spent{bucket="graphql",purpose="fill",group="none",service_name="pg-connector-github",job="pg-connector-github"}
        values: "0+36x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: pg-conn-github-spend-over-cap
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: an idle counter (no increase) does not fire
    interval: 1m
    input_series:
      - series: pg_connector_github_budget_spent{bucket="graphql",purpose="refresh",group="none",service_name="pg-connector-github",job="pg-connector-github"}
        values: "5000x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: pg-conn-github-spend-over-cap
        exp_alerts: []

  - name: a one-scrape spike shorter than the 5m for never fires
    interval: 1m
    input_series:
      # 64 a minute (3840 an hour) to 60m, a 240 point spike at 61m, then flat: the 1h increase is
      # over 4000 only while the spike sits in the window together with the not yet expired steady
      # increments, which the flat tail drains within a few scrapes, well inside the 5m for.
      - series: pg_connector_github_budget_spent{bucket="graphql",purpose="refresh",group="none",service_name="pg-connector-github",job="pg-connector-github"}
        values: "0+64x60 4080x60"
    promql_expr_test:
      # The breach is real but one eval long: about 4016 at 61m, back under the bar (about 3952) at 62m.
      - expr: count(wrapped:pg_conn_github_spend_over_cap)
        eval_time: 61m
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: count(wrapped:pg_conn_github_spend_over_cap)
        eval_time: 62m
        exp_samples: []
    alert_rule_test:
      - eval_time: 61m
        alertname: pg-conn-github-spend-over-cap
        exp_alerts: []
      - eval_time: 70m
        alertname: pg-conn-github-spend-over-cap
        exp_alerts: []
      - eval_time: 90m
        alertname: pg-conn-github-spend-over-cap
        exp_alerts: []

  - name: no graphql series at all gives no alert (noDataState is OK for this rule)
    interval: 1m
    input_series:
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="pg-connector-github"}
        values: "1x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: pg-conn-github-spend-over-cap
        exp_alerts: []
