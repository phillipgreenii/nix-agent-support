# promtool unit tests for the pg-conn-github-daemon-down alert (pg2-nxukx8). Run by the flake check
# test-pg-connector-github-alert-rules, which generates rules.yml next to this file from
# packages/pg-connector/grafana/check-alert-rules.sh: the Grafana rule's refId A wrapped as
# `alert: <uid>` with `expr: (<A>) < 1`, the rule's `for: 2m` and labels, plus a recording rule
# `wrapped:<uid with _>` over the same expression.
#
# Ruling (Phillip, 2026-10-29): a sleeping host MUST NOT read as the service being down. The
# expression is `(min(daemon_up) < 1 or absent(daemon_up) - 1) and on() <awake>`, where <awake> is
# the three-branch gate of pg-router-liveness-down (full wake newer than last sleep; no sleep
# recorded; both gauges absent while host_power_transitions_total is present). The daemon PUSHES its
# gauge (no `up` series), so a crashed daemon is an ABSENT gauge and absent() - 1 turns it into a 0.
# host-activity's series age out while the host sleeps, so the whole expression is empty then
# (Grafana NoData, mapped to OK by noDataState: OK).
#
# Time model: 1m series steps, promtool clock from 0. Timestamps are plain constants (only their
# order matters). `_` models an absent series. `min()` and `absent()` carry no labels, so a firing
# alert carries severity only.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: awake host, daemon_up of 0 fires once held for the 2m for, with severity critical only
    interval: 1m
    input_series:
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="pg-connector-github"}
        values: "0x30"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x30"
      - series: host_power_last_sleep_timestamp_seconds
        values: "100x30"
    alert_rule_test:
      - eval_time: 1m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []
      - eval_time: 5m
        alertname: pg-conn-github-daemon-down
        exp_alerts:
          - exp_labels:
              severity: critical

  - name: awake host, the lowest of several daemon_up series decides, one 0 fires
    interval: 1m
    input_series:
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="a"}
        values: "1x30"
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="b"}
        values: "0x30"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x30"
      - series: host_power_last_sleep_timestamp_seconds
        values: "100x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: pg-conn-github-daemon-down
        exp_alerts:
          - exp_labels:
              severity: critical

  - name: awake host, daemon_up absent (crashed daemon, another series present) fires
    interval: 1m
    input_series:
      - series: pg_connector_github_store_bytes{service_name="pg-connector-github",job="pg-connector-github"}
        values: "1000x30"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x30"
      - series: host_power_last_sleep_timestamp_seconds
        values: "100x30"
    promql_expr_test:
      - expr: count(wrapped:pg_conn_github_daemon_down)
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 1
    alert_rule_test:
      - eval_time: 1m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []
      - eval_time: 10m
        alertname: pg-conn-github-daemon-down
        exp_alerts:
          - exp_labels:
              severity: critical

  - name: awake host, daemon_up goes stale mid-run (daemon killed) fires after the staleness window plus the for
    interval: 1m
    input_series:
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="pg-connector-github"}
        values: "1x5"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x40"
      - series: host_power_last_sleep_timestamp_seconds
        values: "100x40"
    alert_rule_test:
      - eval_time: 9m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []
      # Gone from 11m (5m lookback after the last sample at 5m), held 2m.
      - eval_time: 15m
        alertname: pg-conn-github-daemon-down
        exp_alerts:
          - exp_labels:
              severity: critical

  - name: awake host, daemon_up of 1 stays quiet
    interval: 1m
    input_series:
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="pg-connector-github"}
        values: "1x30"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x30"
      - series: host_power_last_sleep_timestamp_seconds
        values: "100x30"
    promql_expr_test:
      - expr: count(wrapped:pg_conn_github_daemon_down)
        eval_time: 20m
        exp_samples: []
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []

  - name: a single scrape of 0 (shorter than the 2m for) never fires
    interval: 1m
    input_series:
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="pg-connector-github"}
        values: "1x3 0 1x30"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x40"
      - series: host_power_last_sleep_timestamp_seconds
        values: "100x40"
    alert_rule_test:
      - eval_time: 4m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []
      - eval_time: 6m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []
      - eval_time: 20m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []

  # The case this bead fixes: the host sleeps, daemon_up goes stale and host-activity's gauges
  # age out with it. Nothing may fire, however long it lasts.
  - name: sleeping host (daemon_up and host-activity gauges all stale) does not fire
    interval: 1m
    input_series:
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="pg-connector-github"}
        values: "1x10 _x50"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x10 _x50"
      - series: host_power_last_sleep_timestamp_seconds
        values: "100x10 _x50"
      - series: host_power_transitions_total{kind="full"}
        values: "1x10 _x50"
    promql_expr_test:
      - expr: count(wrapped:pg_conn_github_daemon_down)
        eval_time: 40m
        exp_samples: []
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []
      - eval_time: 40m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []

  # Dark wake: last-sleep (300) is newer than the last full wake (200), so the host is not awake,
  # whether daemon_up reads 0 or is absent.
  - name: dark wake (last sleep newer than last full wake), daemon_up of 0, does not fire
    interval: 1m
    input_series:
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="pg-connector-github"}
        values: "0x40"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x40"
      - series: host_power_last_sleep_timestamp_seconds
        values: "300x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []

  - name: dark wake, daemon_up absent, does not fire
    interval: 1m
    input_series:
      - series: pg_connector_github_store_bytes{service_name="pg-connector-github",job="pg-connector-github"}
        values: "1000x40"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x40"
      - series: host_power_last_sleep_timestamp_seconds
        values: "300x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []

  # No sleep ever recorded: awake by the `unless` branch.
  - name: host with no recorded sleep, daemon_up of 0 fires
    interval: 1m
    input_series:
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="pg-connector-github"}
        values: "0x30"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: pg-conn-github-daemon-down
        exp_alerts:
          - exp_labels:
              severity: critical

  # pg2-onqsvn shape: host-activity pushes host_power_transitions_total but has recorded no
  # transition, so neither timestamp gauge exists. The gate MUST degrade open (awake).
  - name: host-activity with no transition history counts as awake, daemon_up of 0 fires
    interval: 1m
    input_series:
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="pg-connector-github"}
        values: "0x30"
      - series: host_power_transitions_total{kind="full"}
        values: "0x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: pg-conn-github-daemon-down
        exp_alerts:
          - exp_labels:
              severity: critical

  - name: host-activity with no transition history, daemon_up absent, fires
    interval: 1m
    input_series:
      - series: pg_connector_github_store_bytes{service_name="pg-connector-github",job="pg-connector-github"}
        values: "1000x30"
      - series: host_power_transitions_total{kind="full"}
        values: "0x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: pg-conn-github-daemon-down
        exp_alerts:
          - exp_labels:
              severity: critical

  - name: host-activity with no transition history, healthy daemon, stays quiet
    interval: 1m
    input_series:
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="pg-connector-github"}
        values: "1x30"
      - series: host_power_transitions_total{kind="full"}
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []

  # Asleep with zero recorded transitions: every host-activity series, the counter included, ages
  # out, so the degrade-open branch stays empty and nothing fires.
  - name: asleep with gauges never exported (counter aged out too), daemon_up absent, does not fire
    interval: 1m
    input_series:
      - series: pg_connector_github_daemon_up{service_name="pg-connector-github",job="pg-connector-github"}
        values: "1x10 _x50"
      - series: host_power_transitions_total{kind="full"}
        values: "0x10 _x50"
    alert_rule_test:
      - eval_time: 40m
        alertname: pg-conn-github-daemon-down
        exp_alerts: []
