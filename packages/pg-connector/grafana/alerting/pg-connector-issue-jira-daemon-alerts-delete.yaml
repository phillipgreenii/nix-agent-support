# Explicit deletion of the pg-connector-issue-jira daemon alert rules (docket pg2-2qyyh.2), the twin
# of pg-connector-issue-jira-daemon-alerts.yaml, built on the lesson of pg2-susum.
#
# Grafana's file provisioner only adds/updates rules present in the provisioned YAML: dropping a
# rules file from alertRuleFiles leaves its already-provisioned rules live (provenance=file), and the
# daemon-down rule, whose noDataState is Alerting, keeps firing for a daemon that is not deployed
# (pg2-bry0w, pg2-susum). A rule is removed only by a `deleteRules:` entry for its uid, applied on a
# provisioning reload/restart (same mechanism as pg-connector-github-alerts-delete.yaml and
# packages/pg-router/grafana/alerting/alerts.yaml).
#
# A machine where the Jira daemon is not deployed registers THIS file in place of
# pg-connector-issue-jira-daemon-alerts.yaml; once the daemon is deployed it registers the rules
# file instead, and the rules are provisioned again (a deleteRules entry for a uid alongside the
# rule that defines it is never emitted). The two files are therefore never loaded together. Which
# of them a machine registers is the darwin module's business, not this file's.
#
# The uids MUST equal the rule uids of pg-connector-issue-jira-daemon-alerts.yaml: rule S8 of
# packages/pg-connector/grafana/check-jira-alert-structure.sh (flake check
# test-pg-connector-issue-jira-alert-structure) pins that. Keep the entries for as long as any
# Grafana database may still hold the rules; they are harmless once the rules are gone.
apiVersion: 1
deleteRules:
  - orgId: 1
    uid: pg-conn-jira-auth-failing
  - orgId: 1
    uid: pg-conn-jira-below-floor
  - orgId: 1
    uid: pg-conn-jira-consumer-stuck
  - orgId: 1
    uid: pg-conn-jira-daemon-down
  - orgId: 1
    uid: pg-conn-jira-query-stale
  - orgId: 1
    uid: pg-conn-jira-rate-limited
  - orgId: 1
    uid: pg-conn-jira-rows-no-kind
  - orgId: 1
    uid: pg-conn-jira-settle-holding
  - orgId: 1
    uid: pg-conn-jira-store-aside
  - orgId: 1
    uid: pg-conn-jira-tracked-over
  - orgId: 1
    uid: pg-conn-jira-unavailable
