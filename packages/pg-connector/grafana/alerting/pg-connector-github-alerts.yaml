# pg-connector-github unified-alerting rules (docket pg2-z5fax.6, Phase 4a): the
# service levels of the daemon's design spec ("Observability > Service levels
# and alerts"), as Prometheus rules over the daemon's own metrics and Loki rules (the
# unavailable-ratio rule of pg2-4pfrkm among them) over its structured logs, in the first
# design as six Prometheus rules over the daemon's own metrics and one
# Loki rule over its structured log (daemon.log.jsonl), plus two Prometheus rules
# added by the PR lane refactor (P8b-1): tracked-set size and governor backlog,
# and no watched PRs while anchors are open (the latter also reads the pg-desk
# open-anchor gauge, pg_desk_pr_open_anchors, so it is exempt from rule S6's
# catalogue check, which covers pg_connector_github_* names only).
#
# This file is registered by the darwin module darwin/modules/pg-connector-github, not by
# this file. The old backend's rules (pr-github-alerts.yaml) are retired (pg2-4pfrkm); the deleteRules
# file that removed them was itself removed in Phase 6b.
#
# Metric names are the Prometheus names the OpenTelemetry collector produces
# (dots to underscores, no _total, no unit suffix) and every one of them is
# catalogued in packages/pg-connector/grafana/pg-connector-github-metrics.txt;
# check-alert-structure.sh (flake check test-pg-connector-github-alert-structure)
# enforces that. The expression of every Prometheus rule has a fixed shape (no
# service_name filter, the names are already specific) because the promtool
# tests of the next packet are written against it; a firing alert's labels are
# the `by` labels of its expression plus severity.
#
# No rule exists for the spec table's last row, "Detection delay (shadow
# criterion)": its threshold is relative to the LIVE flow's p90, which neither
# this daemon nor Prometheus holds. The histogram is on the dashboard and the
# shadow report states the criterion.
#
# Shape notes (copied from the model files issue-jira-alerts.yaml and
# packages/pg-router/grafana/alerting/alerts.yaml): condition C over refIds
# A (the query), B (reduce, last), C (threshold); a Prometheus rule is
# `datasourceUid: prometheus` with the boolean `instant: true`; a Loki rule is
# `datasourceUid: loki` with the string `queryType: instant`. Folder
# "Work" converges by title (ADR 0039 in phillipgreenii-nix-support-apps),
# so no folderUid is ever written. Rule uids stay under Grafana's 40-char cap.
# Annotations are static text.
apiVersion: 1
groups:
  - orgId: 1
    name: pg-connector-github
    folder: Work
    interval: 1m
    rules:
      # Daemon up. daemon_up is the daemon's OWN single liveness gauge. pg2-nxukx8
      # (operator ruling, Phillip, 2026-10-29, on pg2-qhmtvg: "a sleeping host MUST
      # NOT read as the service being down"; same shape as pg-router-liveness-down,
      # pg2-787q92 and pg2-onqsvn): noDataState is OK and the query is VALUE-BASED,
      # gated on the host being awake. The daemon PUSHES its gauge through the OTel
      # collector (no scrape target, so no `up` series to fall back on): while the Mac
      # sleeps the daemon is suspended, the series goes stale and the old
      # noDataState: Alerting rule paged across every sleep. A crashed daemon shows up
      # only as an ABSENT gauge, so the expression turns "absent" into a sample of 0:
      #   (min(daemon_up) < 1 or absent(daemon_up) - 1) and on() <awake>
      # <awake> is the three-branch gate of pg-router-liveness-down (see its comment
      # in packages/pg-router/grafana/alerting/alerts.yaml): host-activity's full-wake
      # timestamp is newer than its last-sleep timestamp, or no sleep was ever
      # recorded, or both gauges are absent while host_power_transitions_total is
      # present (host-activity alive with no transition history). host-activity's
      # series age out while the host sleeps, so the whole expression is empty
      # (NoData -> OK, Pending resets) asleep, and a dark wake leaves last-sleep
      # newer than the last full wake. A real 0 or an absent gauge with the host
      # awake still yields a sample below 1 for the whole `for`, so it pages.
      # `for: 2m` stays: the daemon exports every 30 s (telemetry DefaultInterval), so
      # four pushes fit between the wake that opens the gate and the end of the window.
      # Backup for a host with no host-activity: launchd-health's "daemon not running"
      # rule for com.phillipg.pg-connector-github-daemon. Cases:
      # rule-tests/pg-conn-github-daemon-down.test.yaml.
      - uid: pg-conn-github-daemon-down
        title: pg-connector-github daemon is down
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pg-connector-github daemon has been down for over 2 minutes"
          description: "pg_connector_github_daemon_up has reported 0, or gone missing from Prometheus entirely, for over 2 minutes while the host was awake: the daemon is not running or is not exporting. A sleeping host is deliberately not counted (pg2-nxukx8). Every pg-connector pr/ci call is answered unavailable meanwhile. Check the launchd entry for pg-connector-github and read daemon.log.jsonl in its state directory."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '(min(pg_connector_github_daemon_up) < 1 or absent(pg_connector_github_daemon_up) - 1) and on() ((host_power_last_wake_timestamp_seconds{kind="full"} > on() host_power_last_sleep_timestamp_seconds) or (host_power_last_wake_timestamp_seconds{kind="full"} unless on() host_power_last_sleep_timestamp_seconds) or (absent(host_power_last_wake_timestamp_seconds{kind="full"}) and on() absent(host_power_last_sleep_timestamp_seconds) and on() count(host_power_transitions_total)))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # Configured queries fresh. The spec's threshold is 2 x the query's own
      # query_ttl, which this static file cannot read. The literal 240 seconds
      # STANDS FOR 2 x 120 s, twice the LARGER query_ttl default (the `team`
      # queries; `mine` defaults to 60 s). It therefore does NOT cover a
      # tighter ttl: a `mine` query is only flagged after 4 ttls, not 2, and a
      # query whose query_ttl the operator raised above 120 s needs a larger
      # literal here, or this rule fires for a healthy query. Anything below
      # 240 would fire for a healthy team query.
      - uid: pg-conn-github-query-stale
        title: pg-connector-github configured query is stale
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-connector-github: a configured query has not refreshed successfully for over 10 minutes"
          description: "query_last_success_age_seconds for at least one configured query has been above 240 seconds (2 x the largest default query_ttl, 120 s) for over 10 minutes: its refreshes keep failing or are starved, so callers read stale rows. The query label names it. Check budget pauses (pg_connector_github_governor_paused), auth, and daemon.log.jsonl."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max by (query) (pg_connector_github_query_last_success_age_seconds)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [240]

      # Spend within budget. The spec's threshold is graphql_points_per_hour,
      # which this static file cannot read. The literal 4000 STANDS FOR the
      # cutover value of graphql_points_per_hour (the module default after
      # cutover; the shadow run used 1500, and the shadow report recommended
      # keeping the cap, so the budget is 4000). A deployment that sets a
      # different cap needs its own literal here and in the dashboard's cap
      # line. The rule reads the GraphQL bucket only.
      - uid: pg-conn-github-spend-over-cap
        title: pg-connector-github GraphQL spend above the hourly cap
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-connector-github spent more than 4000 GraphQL points in the last hour"
          description: "The daemon's GraphQL spend over the trailing hour is above 4000 points, the cutover value of graphql_points_per_hour. See pg_connector_github_budget_spent by purpose and group for what is spending it; the governor should be pausing refreshes at the cap, so a sustained breach means the cap is not holding or the configured cap is lower than this rule's literal."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum(increase(pg_connector_github_budget_spent{bucket="graphql"}[1h]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [4000]

      # Interactive work keeping up: the oldest overdue interactive request has
      # waited more than 30 seconds for 5 minutes, so a caller is being made to
      # wait on the daemon.
      - uid: pg-conn-github-interactive-slow
        title: pg-connector-github interactive work is falling behind
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-connector-github interactive queue has been overdue by more than 30 seconds for over 5 minutes"
          description: "The oldest overdue interactive request has been waiting more than 30 seconds for over 5 minutes, so interactive pg-connector calls are slow. Check pg_connector_github_governor_paused (a budget pause starves the queue), pg_connector_github_queue_depth and request duration, and daemon.log.jsonl."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max(pg_connector_github_queue_oldest_overdue_seconds{class="interactive"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [30]

      # Consumer stuck: a consumer's oldest unacknowledged change row is older
      # than 15 minutes (900 seconds).
      - uid: pg-conn-github-consumer-stuck
        title: pg-connector-github consumer is stuck
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-connector-github: a change consumer has had an unacknowledged row for over 15 minutes"
          description: "The oldest unacknowledged change row of a consumer (labels consumer and query; an unscoped consumer, one that names no query, carries query=other) is older than 15 minutes, so that consumer is not reading or acknowledging. Check the consumer process, pg_connector_github_consumer_redeliveries for a poison row, and cursor_expired lines in daemon.log.jsonl."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              # The pg-desk freshness probe consumers (pg-desk-freshness-<query>) are
              # read-only: they poll with --no-ack and never acknowledge (see
              # docs/behavior/pg-desk/freshness.md), so their unacknowledged age grows
              # without bound by design and is not a stuck consumer.
              expr: max by (consumer, query) (pg_connector_github_consumer_oldest_unacked_age_seconds{consumer!~"pg-desk-freshness-.+"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [900]

      # Settle holding: more than 20 percent of the settle attempts of the last
      # 30 minutes ended failed or timeout rather than settled, so consumers'
      # reads are going back to origin. NaN (no settle at all in the window)
      # never exceeds the threshold, which is the healthy quiet case.
      - uid: pg-conn-github-settle-failing
        title: pg-connector-github change settle is failing
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-connector-github: over 20 percent of change settles failed or timed out in the last 30 minutes"
          description: "More than 20 percent of pg_connector_github_change_settle increases over 30 minutes had a result other than settled (failed or timeout), so consumers' reads are going back to origin instead of being served from the store. Check GitHub reachability, the budget pause state and daemon.log.jsonl."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum(increase(pg_connector_github_change_settle{result!="settled"}[30m])) / sum(increase(pg_connector_github_change_settle[30m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.2]

      # Store moved aside or refused to start: any daemon.log.jsonl line whose
      # `change` field is store_moved_aside or store_refused in the trailing 10
      # minutes. There is no metric for it (the store did not open), hence a
      # Loki rule. noDataState is OK: a quiet log is the healthy case.
      #
      # Overlap: this rule selects the same service_name as the generic
      # "Daemon Health" error-rate alert the observability module generates for
      # a logSources entry of that name, and a store_refused line is written at
      # error level, so one incident could page twice. The darwin module packet
      # decides whether that generic alert is switched off for this entry. The
      # window is kept to 10 minutes so the two do not disagree for long on
      # whether the incident is over.
      - uid: pg-conn-github-store-aside
        title: pg-connector-github store moved aside or refused
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: error
        annotations:
          summary: "pg-connector-github moved its store aside or refused to start in the last 10 minutes"
          description: 'The daemon logged store_moved_aside or store_refused in the last 10 minutes: its store was corrupt or unmigratable and was moved aside and recreated (the cache is rebuilt from scratch), or the store schema is newer than this binary (a downgrade) and the daemon refused to start. Inspect the lines with {service_name="pg-connector-github"} | json | change=~"store_moved_aside|store_refused" and read the cause, found_version and supported_version fields.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({service_name="pg-connector-github"} | json | change=~"store_moved_aside|store_refused" [10m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Tracked-set size and governor backlog (PR lane refactor, P8b-1; the design's
      # section 9.2 row "Tracked-set size and governor backlog"). One rule, three
      # branches, any one of which fires it (every branch is unlabelled, so the `or`
      # joins them on the empty label set and the value is whichever branch is true):
      #   1. size: the tracked set (members + other_open; closed_grace is held until
      #      its ttl and is NOT tracked) is above 0.8 of the CONFIGURED limit;
      #   2. growth: the set grew by more than 0.1 of the limit over the last day
      #      while it already stands above 0.5 of the limit (a runaway keep-alive set;
      #      the backfill happens below that mark);
      #   3. backlog: the governor holds more than 500 queued tasks that are due now
      #      and have not gone out, summed over the five scheduler classes.
      # The limit is the daemon's own gauge pg_connector_github_tracked_limit (the
      # daemon setting tracked_set_limit; the deployment sets it from the live count
      # after the cutover, ruling 15), never a number copied into this file. The
      # daemon reports no limit gauge while none is configured, and `max(limit) > 0`
      # drops the denominator then, so branches 1 and 2 are quiet instead of dividing
      # by zero; branch 3 needs no limit. The 0.8, 0.1, 0.5 and 500 are PROVISIONAL
      # and revisited with data. Ends with the SYSTEM_PAUSE guard of the pg-desk
      # rules (a pause starves the queue on purpose). noDataState is OK: a missing
      # daemon is the daemon-down rule's to report.
      - uid: pg-conn-github-tracked-set
        title: pg-connector-github tracked set or governor backlog is growing
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-connector-github: the tracked set is near its configured limit or growing fast, or the governor backlog is high"
          description: "For over 30 minutes at least one of: the tracked set (pg_connector_github_tracked_entities, classes members and other_open) is above 0.8 of pg_connector_github_tracked_limit; it grew by more than 0.1 of the limit in a day while above 0.5 of it; or pg_connector_github_governor_backlog (queued tasks due now that have not gone out) summed over the classes is above 500. The limit caps and evicts nothing, so a breach means keep-alive refreshes will outgrow the budget. Compare the members and other_open series (`pg-connector pr inspect <id>...` answers tracked and watched for one PR), raise tracked_set_limit only after checking why the set grew, and read pg_connector_github_governor_paused for a budget pause. Suppressed while a pg-router SYSTEM_PAUSE gate is active."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '((sum(pg_connector_github_tracked_entities{class=~"members|other_open"}) / (max(pg_connector_github_tracked_limit) > 0) > 0.8) or (((sum(pg_connector_github_tracked_entities{class=~"members|other_open"}) - sum(pg_connector_github_tracked_entities{class=~"members|other_open"} offset 1d)) / (max(pg_connector_github_tracked_limit) > 0) > 0.1) and on() (sum(pg_connector_github_tracked_entities{class=~"members|other_open"}) / (max(pg_connector_github_tracked_limit) > 0) > 0.5)) or (sum(pg_connector_github_governor_backlog) > 500)) unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # No watched PRs while anchors are open (PR lane refactor, P8b-1): the daemon's
      # watched gauge reads 0 while pg-desk's open-anchor gauge (pg_desk_pr_open_anchors,
      # PRs with an open anchor, hidden ones excluded) is above 0. This is a LOWER bound,
      # two metrics in one rule: every PR with an open anchor should be watched by the
      # marking step, so none watched at all means the marking never ran or the daemon
      # lost its watches. The exact per-PR check is the marking step's own count
      # (`pg-connector pr inspect`), not a standing alert. The value is the open-anchor
      # count, so the rule's threshold is gt 0. A missing watched gauge (no daemon) or
      # a missing anchor gauge (pg-desk cannot answer) leaves the result empty: the
      # daemon-down rule and the pg-desk rules speak for those, hence noDataState OK.
      # Ends with the SYSTEM_PAUSE guard.
      - uid: pg-conn-github-no-watched-prs
        title: pg-connector-github watches no PR while anchors are open
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-connector-github watches no pull request although open anchors exist"
          description: "pg_connector_github_watched_entities has been 0 for over 30 minutes while pg_desk_pr_open_anchors (PRs that have an open anchor) is above 0: the marking step has not watched any of them, so their changes are not tracked. Run `pg-connector pr inspect <id>...` over the open-anchor PRs (its counts line reports how many are watched), then rerun the marking step. Suppressed while a pg-router SYSTEM_PAUSE gate is active."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(pg_desk_pr_open_anchors) > 0 and on() (max(pg_connector_github_watched_entities) == 0) unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Unavailable ratio (pg2-4pfrkm): the share of the daemon's answered requests
      # that failed as `unavailable` over a rolling hour. A call-budget kill (the
      # per-op time limit hit while the host is starved), GitHub down, or `gh`
      # failing all answer `unavailable`, and until this rule the daemon path had no
      # alert for it: the retired pr-github rule pg-conn-pr-github-unavailable read a
      # log stream that ended at the daemon cutover. Only the event log carries the
      # per-op outcome (no metric has an error label), hence a Loki rule.
      #
      # Threshold, 5 percent (0.05), and why. Measured on the daemon after the
      # cutover: 35 unavailable of 10742 ops (0.33 percent) over 6 days, and the
      # pr-changes source 13.0 of 1865.5 (0.70 percent) over 5 days, the failures
      # clustering in host-load spikes (load 50 to 387). 5 percent is about 15x the
      # daemon's own baseline and 7x the worst observed source rate, so a load spike
      # alone does not reach it, while a real regression (a per-op budget that no
      # longer fits, GitHub or the network down) takes the ratio to tens of percent.
      # The bar is a starting point and is revisited with data.
      #
      # Quiet-hour guard: the ratio is only reported while the denominator holds at
      # least 50 requests in the hour (`and on() (... >= 50)`). Without it one failure
      # among a handful of calls overnight would read as a huge ratio. Below 50 an
      # hour the daemon is nearly idle, and daemon-down and the staleness rules speak
      # for a daemon that is broken rather than quiet. `for: 15m` keeps one bad
      # quarter hour of a spike from paging. Zero unavailable ops give an empty
      # numerator, so the whole expression is empty: noDataState OK.
      #
      # Counted: kind=request rows of service_name pg-connector-github (the event
      # log), error_code unavailable. Origin rows and the client log (its own
      # service_name) never match. Behaviour (fires above the bar, quiet below it,
      # quiet at low volume) is checked by check-loki-ratio-rule.sh over the fixtures
      # in rule-tests/loki; it is exempt from probe escalation in nix-ziprecruiter
      # like the other warning-level rules of this file.
      - uid: pg-conn-github-unavailable-ratio
        title: pg-connector-github unavailable ratio high
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-connector-github: over 5 percent of requests in the last hour failed as unavailable"
          description: 'More than 5 percent of the requests the pg-connector-github daemon answered in the last hour (with at least 50 answered) failed with error_code unavailable: a per-op call budget is being exceeded (a killed gh or origin call, often under host load), or GitHub or the network is failing. The daemon baseline is about 0.3 percent. Inspect the failures with {service_name="pg-connector-github"} | json | kind="request" | error_code="unavailable" and read the op and error fields; check host load before raising a budget.'
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: '(sum(count_over_time({service_name="pg-connector-github"} | json | kind="request" | error_code="unavailable" [1h])) / sum(count_over_time({service_name="pg-connector-github"} | json | kind="request" [1h]))) and on() (sum(count_over_time({service_name="pg-connector-github"} | json | kind="request" [1h])) >= 50)'
          - refId: B
            datasourceUid: __expr__
            model:
