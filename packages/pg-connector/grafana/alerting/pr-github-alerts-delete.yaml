# Explicit deletion of the retired pg-connector-pr-github alert rules (pg2-4pfrkm).
#
# The legacy pr-github backend stopped logging at the pg-connector-github daemon cutover (the Loki
# stream {service_name="pg-connector-pr-github"} ended 2026-10-23T16:19:08Z), so its three LogQL rules
# (authentication failing, unavailable, GraphQL quota below reserve) were permanently NoData and could
# never fire. The rules file pr-github-alerts.yaml is removed; the daemon path is covered by the rules
# of pg-connector-github-alerts.yaml (pg-conn-github-unavailable-ratio for per-op unavailable).
#
# Grafana's file provisioner only adds/updates rules present in the provisioned YAML, so rules that were
# provisioned earlier stay live (provenance=file) after their file is dropped; one is removed only by a
# `deleteRules:` entry for its uid (same mechanism as pg-connector-github-alerts-delete.yaml, pg2-susum).
# darwin/modules/pg-connector-pr-github registers THIS file in place of the rules file. The uids below are
# the only place the dead uids are still named; keep them for as long as any Grafana database may hold
# the rules, they are harmless once the rules are gone.
apiVersion: 1
deleteRules:
  - orgId: 1
    uid: pg-conn-pr-github-quota-low
  - orgId: 1
    uid: pg-conn-pr-github-unauthenticated
  - orgId: 1
    uid: pg-conn-pr-github-unavailable
