scope = "city"
nudge = "Process open feedback on your PRs and apply fixes via pg-pr."
idle_timeout = "30m"
min_active_sessions = 0
max_active_sessions = 1
# Open process-feedback cycles whose parent PR has role=mine.
# Resolves parent metadata via a follow-up bd show. We accept a small extra
# bd call per cycle to avoid baking the role into the cycle bead itself
# (sync engine writes role on the merge-request bead, not on every cycle).
work_query = """
bd list --json --limit 0 --type=task \
  | jq -r 'if type == "array" then \
      .[] | select(.status == "open" and (.title | startswith("process-feedback:"))) | .id \
    else empty end' \
  | while read cid; do \
      pid=$(bd show "$cid" --json | jq -r '.parent // empty'); \
      [ -z "$pid" ] && continue; \
      role=$(bd show "$pid" --json | jq -r '.metadata.role // ""'); \
      [ "$role" = "mine" ] && echo "$cid"; \
    done
"""
