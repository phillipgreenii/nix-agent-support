syntax = "proto3";

package pa_monitor.v1;

option go_package = "github.com/phillipgreenii/pa-monitor/internal/proto;proto";

import "google/protobuf/timestamp.proto";

// PaMonitor is the daemon's gRPC surface. Clients (TUI, CLI, cmux-bridge)
// use it to observe state and to drive daemon-owned operations
// (caffeinate, nudge, etc.).
service PaMonitor {
  // GetState returns a snapshot of the daemon's current state.
  rpc GetState(GetStateRequest) returns (DaemonState);

  // WatchState streams DaemonState updates. The daemon pushes a fresh
  // state on every tick (interval requested via push_interval_ms, with
  // a 250ms server floor and a 2s default). Each push is a full DB
  // materialization, so the floor bounds the worst-case snapshot rate a
  // single client can force. Subscribers detect a hung daemon by missing
  // pushes within their own watchdog budget.
  rpc WatchState(WatchStateRequest) returns (stream DaemonState);

  // Ping is a cheap liveness check used by clients to confirm the daemon
  // is responsive before issuing a heavier RPC.
  rpc Ping(PingRequest) returns (PingResponse);

  // Caffeinate toggles the caffeinate manager. Result reflects the new
  // state. Persisted to runtime.json.
  rpc Caffeinate(CaffeinateRequest) returns (CaffeinateResponse);

  // IsAnyBusy returns whether any agent is currently in the working
  // state. Powers the `agents-busy-check` CLI subcommand.
  rpc IsAnyBusy(IsAnyBusyRequest) returns (IsAnyBusyResponse);

  // GetSessionInfo returns detailed state about one session.
  rpc GetSessionInfo(GetSessionInfoRequest) returns (SessionDetail);

  // GetPathInfo returns the directory rollup for a workspace path.
  rpc GetPathInfo(GetPathInfoRequest) returns (PathRollup);

  // NudgeQueue enqueues a nudge to be sent when a session next becomes idle.
  rpc NudgeQueue(NudgeQueueRequest) returns (NudgeQueueResponse);

  // NudgeCancel cancels a previously queued nudge.
  rpc NudgeCancel(NudgeCancelRequest) returns (NudgeCancelResponse);

  // SetAutoResume toggles the auto-resume feature daemon-wide.
  rpc SetAutoResume(SetAutoResumeRequest) returns (SetAutoResumeResponse);

  // RegisterBridge announces a cmux-bridge to the daemon. Called by
  // cmux-bridge on startup and as a periodic heartbeat. The daemon uses
  // bridge_pid to derive the bridge's cmux server (parent ancestor named
  // "cmux") and tracks last-seen so it can surface session terminal status
  // (cmux vs. cmux-no-bridge vs. cmux-bridge-disconnected) for sessions in
  // the same cmux workspace.
  rpc RegisterBridge(RegisterBridgeRequest) returns (RegisterBridgeResponse);

  // BridgeChannel is a bidirectional stream between a cmux-bridge and the
  // daemon: the bridge sends Register/Heartbeat/DeliverResult messages, and
  // the daemon pushes DaemonState snapshots and Deliver (nudge delivery)
  // requests.
  rpc BridgeChannel(stream BridgeMsg) returns (stream DaemonMsg);
}

message GetStateRequest {}

message WatchStateRequest {
  // Push interval requested by the client, in milliseconds. 0 means
  // "use server default" (2s). Positive values below the server floor
  // (250ms) are clamped to the floor.
  uint32 push_interval_ms = 1;
}

message PingRequest {}

message PingResponse {
  google.protobuf.Timestamp ts = 1;
}

// CaffeinateProcess is the caffeination PROCESS state — what the subprocess
// holding the wake assertion is actually doing. Orthogonal to the
// auto-caffeinate MODE (the user toggle). The incident state was mode:on +
// process:off (armed, not holding); separating the two makes that visible.
enum CaffeinateProcess {
  CAFFEINATE_PROCESS_OFF = 0;   // not holding any assertion
  CAFFEINATE_PROCESS_ON = 1;    // holding the wake assertion
  CAFFEINATE_PROCESS_GRACE = 2; // armed countdown; release pending (see grace_remaining_s)
  CAFFEINATE_PROCESS_ERROR = 3; // spawn failed; wanted to hold but could not
}

// DaemonState is the full server-rendered view of agent activity that
// clients consume via GetState or WatchState. The shape mirrors
// aggregate.Tree but is stable across daemon versions (the daemon
// translates internal types into this proto).
message DaemonState {
  google.protobuf.Timestamp now = 1;
  uint64 daemon_uptime_seconds = 2;
  string daemon_version = 3;

  repeated Directory dirs = 4;
  Block active_block = 5;
  Week active_week = 6;
  // caffeinate_active is the legacy collapsed flag, retained for clients that
  // only need a single bit. New clients should read caffeinate_mode (the user
  // toggle) and caffeinate_process (what the subprocess is doing).
  bool caffeinate_active = 7;
  google.protobuf.Timestamp window_resets_at = 8; // earliest pause-reset across sessions
  string plan_tier = 9;
  double plan_cap_usd = 10;
  double week_cap_usd = 11;
  bool cost_probed = 12;
  string cost_probe_error = 13;
  bool auto_resume_enabled = 14;
  uint32 auto_resume_delay_s = 15;

  // Two unambiguous caffeinate indicators (see CaffeinateProcess).
  bool caffeinate_mode = 16;                 // auto-caffeinate MODE: the user toggle (on/off)
  CaffeinateProcess caffeinate_process = 17; // caffeination PROCESS state
  uint32 caffeinate_grace_remaining_s = 18;  // seconds left in grace; 0 unless process == GRACE
  string caffeinate_cause = 19;              // "manual", "agents_active", or ""

  // Authoritative status-line rate_limits windows (ADR 0021 §6). These are
  // account-global (NO session_id) and carry Claude Code's server-side 5h/7d
  // used_percentage. They are DISTINCT from window_resets_at (field 8) /
  // SessionView.rate_limit_resets_at (the daemon's pause / limit-hit concept):
  // these are the status-line windows.
  //
  // proto3 `optional` gives explicit field presence so an unset percentage is
  // distinguishable from a real 0% reading (unknown/stale != 0). The reset /
  // captured timestamps are google.protobuf.Timestamp messages, which are nil
  // when unset and MUST NOT decode as 1970 (see timeFromTS). Phase 0 observed
  // seven_day absent on this account, so these are commonly unset. No consumer
  // reads them yet — this is persistence + wire plumbing only.
  optional double five_hour_pct = 20;                    // 5h used_percentage [0,100]; unset = unknown
  optional double seven_day_pct = 21;                    // 7d used_percentage [0,100]; unset = unknown
  google.protobuf.Timestamp seven_day_resets_at = 22;    // 7d window reset; unset = unknown (never 1970)
  google.protobuf.Timestamp limits_captured_at = 23;     // capture ts of the limits reading; unset = unknown
  google.protobuf.Timestamp five_hour_resets_at = 24;    // 5h window reset; unset = unknown (never 1970)
}

message Directory {
  string path = 1;
  string branch = 2;
  PRInfo pr_info = 3;
  repeated SessionView sessions = 4;
  uint32 working_n = 5;
  uint32 idle_n = 6;
  // dormant_n (field 7) is retired by ADR 0024 — Dormant is no longer a status
  // (a long-idle session counts as idle). The field number is NOT reused; it
  // stays reserved for version-skew with older clients (R8).
  uint32 dormant_n = 7;
  uint64 total_tokens = 8;
  double total_cost_usd = 9;
  double burn_rate_sum = 10;
  // blocked_n counts sessions with status == "blocked" (ADR 0024). New field
  // number 11 (verified free); does NOT repurpose dormant_n (R8).
  uint32 blocked_n = 11;
}

message PRInfo {
  uint32 number = 1;
  string title = 2;
  string state = 3; // OPEN, CLOSED, MERGED
  string url = 4;
}

message SessionView {
  // identity
  string session_id = 1;
  uint32 pid = 2;
  string cwd = 3;
  string name = 4;
  string kind = 5;
  string entrypoint = 6;
  google.protobuf.Timestamp started_at = 7;

  // status
  string status = 8;            // ADR 0024: "working", "blocked", "idle" (older daemons may still send "dormant"/"waiting")
  string branch = 9;
  string terminal_host = 10;
  google.protobuf.Timestamp transcript_mtime = 11;
  google.protobuf.Timestamp rate_limit_resets_at = 12; // zero = not paused

  // enrichment
  uint64 context_tokens = 13;
  string model = 14;
  string first_prompt = 15;
  uint32 subagent_count = 16;
  uint32 subshell_count = 17;
  uint64 session_tokens = 18;
  double burn_rate_short = 19;
  double burn_rate_long = 20;
  double cost_usd = 21;
  bool awaiting_input = 22;

  // Workspace tags pulled from the session's process env. Daemon-side
  // privacy guard: only specific known keys are forwarded; arbitrary
  // env is never wire-exposed. Empty when not present in the env.
  string cmux_workspace_id = 23;
  string tmux_session = 24;
  reserved 25, 26;
  reserved "gc_rig", "gc_agent"; // decommissioned (ADR 0030); never reuse
  string workspace_env = 27; // value of $WORKSPACE

  // nudge history (watermarks)
  // Set when the daemon has fired at least one nudge for this session.
  // Both fields are zero/empty when no nudge has ever been delivered.
  google.protobuf.Timestamp last_nudged_at = 28;     // wall clock of most recent successful fire
  repeated string last_nudge_sources = 29;           // sources that fired together at last_nudged_at

  // blocker names WHY a blocked session cannot proceed (ADR 0024): one of
  // "human_input" | "human_authn" | "usage_limit" | "error". Empty when
  // status != "blocked". New field number 30 (verified free; R8).
  string blocker = 30;

  // labels is the session's computed label set (workspace.scope, agent.*,
  // repo.*, …) as produced by the daemon's label pipeline and persisted to
  // the DB. Forwarded so status/tui can display e.g. workspace.scope. Unlike
  // the raw env fields above, these are derived (detectors + decorators).
  // Field number 31 (verified free). (pg2-4xbrm)
  map<string, string> labels = 31;
}

message Block {
  string id = 1;                            // YYYY-MM-DDTHHZ
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  bool is_active = 4;
  double cost_usd = 5;
  double tokens_per_minute = 6;
  double cost_per_hour = 7;
  double projection_total_cost = 8;
  uint32 projection_remaining_minutes = 9;
  double window_pct = 10; // cost_usd / plan_cap_usd
  google.protobuf.Timestamp cap_hit_at = 11; // when plan cap was first hit; unset if not hit
}

message Week {
  string id = 1;                            // YYYY-Www
  string period = 2;                        // YYYY-MM-DD (Monday)
  double cost_usd = 3;
  double window_pct = 4; // cost_usd / week_cap_usd
  google.protobuf.Timestamp cap_hit_at = 5; // when week cap was first hit; unset if not hit
}

// --- Caffeinate --- //

message CaffeinateRequest {
  // action: "on", "off", "toggle". Unknown values return INVALID_ARGUMENT.
  string action = 1;
}

message CaffeinateResponse {
  bool active = 1;            // legacy collapsed flag (mode || process != off)
  string cause = 2;           // "manual", "agents_active", or ""
  google.protobuf.Timestamp until = 3; // grace-period expiry (set only while process == GRACE)
  bool mode = 4;                      // auto-caffeinate MODE: the user toggle after the action
  CaffeinateProcess process = 5;      // caffeination PROCESS state after the action
  uint32 grace_remaining_s = 6;       // seconds left in grace; 0 unless process == GRACE
}

// --- Nudge --- //

message Selector {
  oneof target {
    string session_id = 1;
    string path = 2;
    string cmux_workspace_id = 3;
  }
}

message NudgeQueueRequest {
  string selector = 1;
  string text = 2;
}

message NudgeQueueResponse {
  repeated string queued_session_ids = 1;
  repeated string already_queued_session_ids = 2;
}

message NudgeCancelRequest {
  string selector = 1;
}

message NudgeCancelResponse {
  repeated string cancelled_session_ids = 1;
}

message SetAutoResumeRequest {
  bool enabled = 1;
}

message SetAutoResumeResponse {
  bool enabled = 1;
}

// RegisterBridgeRequest carries the bridge's process identity so the
// daemon can walk its ancestry to find the cmux server (parent process
// named "cmux") it belongs to.
message RegisterBridgeRequest {
  // CMUX_WORKSPACE_ID the bridge belongs to. Carried for display / logging;
  // the daemon does not key registry state on this (it keys on cmux server
  // PID derived from bridge_pid).
  string workspace_id = 1;
  // PID of the bridge process making the call.
  int32 bridge_pid = 2;
}

message RegisterBridgeResponse {}

// --- BridgeChannel --- //

// BridgeMsg is sent from cmux-bridge to the daemon over BridgeChannel.
message BridgeMsg {
  oneof kind {
    Register register = 1;
    Heartbeat heartbeat = 2;
    DeliverResult result = 3;
  }
}

// DaemonMsg is sent from the daemon to cmux-bridge over BridgeChannel.
message DaemonMsg {
  oneof kind {
    DaemonState snapshot = 1;
    Deliver deliver = 2;
  }
}

// Register is the first message a bridge sends on BridgeChannel,
// announcing its identity.
message Register {
  int32 bridge_pid = 1;
  int32 server_pid = 2;
  string workspace_id = 3;
}

// Heartbeat is sent periodically by the bridge to indicate liveness.
message Heartbeat {
  int32 bridge_pid = 1;
}

// Deliver instructs the bridge to deliver a nudge's text to the given
// target process.
message Deliver {
  string id = 1;
  int32 target_pid = 2;
  string text = 3;
}

// DeliverResult reports back the outcome of a Deliver request.
message DeliverResult {
  string id = 1;
  bool ok = 2;
  string error = 3;
  // reason/timed_out carry the cmux-bridge's TYPED failure classification across
  // the gRPC boundary (pg2-p1q00): the bridge holds the *CmuxError, so it can
  // classify via the type switch rather than the daemon re-parsing `error` text.
  // Additive + backward-compatible: an empty reason means "not classified"
  // (old bridge), and the daemon falls back to substring matching on `error`.
  string reason = 4;
  bool timed_out = 5;
}

// --- ApiError / PendingNudge --- //

message ApiError {
  string kind = 1;
  string text = 2;
  google.protobuf.Timestamp at = 3;
  bool is_terminal = 4;
  bool is_retryable = 5;
  bool from_subagent = 6;
}

message PendingNudge {
  repeated string sources = 1;
}

// --- IsAnyBusy --- //

message IsAnyBusyRequest {}

message IsAnyBusyResponse {
  bool any_busy = 1;
  uint32 busy_count = 2;
}

// --- Session and Path queries --- //

message GetSessionInfoRequest {
  Selector selector = 1;
}

message SessionDetail {
  SessionView view = 1;
  repeated string label_pairs = 2; // "key=value" entries from labels
  ApiError last_error = 3;         // most recent API error, if any
  PendingNudge pending_nudge = 4;  // queued nudge waiting for idle, if any
}

message GetPathInfoRequest {
  string path = 1;
}

message PathRollup {
  Directory directory = 1;
}
