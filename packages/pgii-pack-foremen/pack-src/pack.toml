# pgii-foremen — explicit category-triage pack.
#
# Five agents:
#   agents/triager/         — classifies type=triage beads in hq into
#                             city/zr/personal; emits work bead in
#                             destination rig's db via gc --rig=X.
#   agents/city-foreman/    — enhances newly-arrived hq work beads,
#                             handles HQ-worker escalations, fills
#                             missing AC. Absorbs pgii-gastown.foreman's
#                             responsibilities, scoped to hq only.
#   agents/zr-foreman/      — same shape, zr scope.
#   agents/personal-foreman/ — same shape + multi-rig rig-picking +
#                              tracking-bead creation. Per the spec's
#                              verified-outcomes section, the topology
#                              is per-rig dbs (six dbs, one per nix_*
#                              rig). The work_query iterates them.
#   orders/mol-triage-poll/   — cron-scheduled exec order; polls for
#                              open type=triage beads and dispatches
#                              the triager via mail when any exist.
#   agents/city-worker/     — HQ-scope worker; mirrors pgii-workers/worker
#                             but city-scoped, since HQ is not a rig and
#                             [defaults.rig.imports.pgii-workers] doesn't
#                             reach it.
#
# All five are mode=on_demand, scope=city. They run in HQ alongside
# mayor/operator. Per-instance concurrency is governed by max_active_sessions
# in each agent.toml (default 0/1), overridable via [[rigs.patches]] in
# city.toml (none currently overridden).
#
# Reference design:
#   docs/superpowers/specs/2026-05-28-triage-extension-design.md
# Plan:
#   docs/superpowers/plans/2026-05-28-triage-extension.md
# Hand-built source; future nix-migration is a separate follow-up.

[pack]
name = "pgii-foremen"
schema = 2

[[named_session]]
template = "triager"
scope = "city"
mode = "on_demand"

[[named_session]]
template = "city-foreman"
scope = "city"
mode = "on_demand"

[[named_session]]
template = "zr-foreman"
scope = "city"
mode = "on_demand"

[[named_session]]
template = "personal-foreman"
scope = "city"
mode = "on_demand"

[[named_session]]
template = "city-worker"
scope = "city"
mode = "on_demand"
