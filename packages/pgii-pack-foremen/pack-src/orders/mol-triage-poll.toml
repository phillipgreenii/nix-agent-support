# mol-triage-poll — cron-scheduled order that polls for open
# type=triage beads in hq and dispatches the triager via mail when
# any exist.
#
# This is the triager's primary wake source. Direct bead-wake is not
# a primitive in gc 1.1.0; orders are how gc dispatches polled work
# (operator clarification 2026-05-29 — see spec's verified outcomes).
#
# The exec script is cheap: a single bd list call + a conditional
# gc mail send. The mail subject and body are static; the triager's
# work_query is what actually selects which bead it processes.

[order]
description = "Poll for open type=triage beads; mail triager to wake it"
trigger = "cooldown"
interval = "30s"
timeout = "30s"
exec = "$PACK_DIR/scripts/mol-triage-poll.sh"
