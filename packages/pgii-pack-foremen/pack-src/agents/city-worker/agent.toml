# city-worker — HQ-scope worker pool.
#
# HQ is the city, not a rig, so pgii-workers' [defaults.rig.imports]
# doesn't reach HQ. city-worker mirrors pgii-workers/worker behaviorally
# but is explicitly scope=city.
#
# Reference: docs/superpowers/specs/2026-05-28-triage-extension-design.md

scope = "city"
wake_mode = "fresh"
idle_timeout = "1h"
min_active_sessions = 0
max_active_sessions = 1
nudge = "Run gc hook for routed work, then bd ready to find a ready bead with acceptance_criteria."

work_dir = ".gc/worktrees/city/worker/{{.AgentBase}}"

# Skip pre_start (the pgii-workers worktree-setup + zm post-checkout
# are zr-rig-specific). HQ work happens in the city tree directly;
# any worktree management is handled by the worker itself if needed.

# Pick up open beads in hq that have AC populated and aren't flagged
# for foreman attention or escalation. Same filter as pgii-workers/
# worker; differs only in being city-scoped (no --rig flag).
work_query = "bd list --status=open --json --limit 0 | jq -r 'if type == \"array\" then .[] | select(.status == \"open\" and (.acceptance_criteria != null and .acceptance_criteria != \"\") and ((.labels // []) | any(. == \"needs-foreman\") | not) and ((.labels // []) | any(. == \"gc:escalation\") | not)) | .id else empty end'"
