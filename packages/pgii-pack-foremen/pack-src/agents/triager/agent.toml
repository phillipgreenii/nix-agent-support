# triager — wakes on type=triage beads in hq OR on mail;
# classifies into city/zr/personal; emits work bead in the
# destination rig's db; closes triage bead with a structured reason.
#
# Reference: docs/superpowers/specs/2026-05-28-triage-extension-design.md

scope = "city"
wake_mode = "fresh"
idle_timeout = "30m"
min_active_sessions = 0
max_active_sessions = 1
model = "claude-opus-4-7"
nudge = "Wake check: open type=triage bead exists. Read description, classify city/zr/personal, route."

# Triager wake is driven by the mol-triage-poll order (see
# pgii-foremen/orders/mol-triage-poll.toml), which polls every 30s
# and mails the triager when open type=triage beads exist. Direct
# bead-wake is NOT a primitive in gc 1.1.0; orders are the wake
# source (operator clarification 2026-05-29; see spec).
#
# The work_query below is still useful: when the triager wakes (via
# the order's mail), it uses this query to find the next bead ID to
# process.
# Excludes:
#   - beads tagged needs-clarification (those need human input first)
#   - beads tagged category:* (already-classified handoffs, e.g.
#     category:personal — that's personal-foreman's work, not ours)
work_query = "gc bd list --status=open --type=triage --json --limit 0 | jq -r 'if type == \"array\" then .[] | select(((.labels // []) | any(. == \"needs-clarification\")) | not) | select(((.labels // []) | any(startswith(\"category:\"))) | not) | .id else empty end'"
