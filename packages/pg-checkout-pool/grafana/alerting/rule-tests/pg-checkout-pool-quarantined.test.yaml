# promtool unit tests for the pg-checkout-pool-quarantined alert. Run by the flake check
# test-pg-checkout-pool-alert-rules through check-alert-rules.sh, which generates rules.yml next to
# this file: the Grafana rule's refId A wrapped as `alert: <uid>` with `expr: (<A>) <op> <threshold>`,
# the rule's `for` and labels, plus a recording rule `wrapped:<uid with _>` over the same expression.
# promtool's clock starts at 0 and every series has a 1m interval.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a quarantined slot fires after 1h and not before
    interval: 1m
    input_series:
      - series: pg_checkout_pool_quarantined_slots{job="textfile"}
        values: "0x5 1x200"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-checkout-pool-quarantined
        exp_alerts: []
      - eval_time: 68m
        alertname: pg-checkout-pool-quarantined
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: a slot the operator clears inside the hour never fires
    interval: 1m
    input_series:
      - series: pg_checkout_pool_quarantined_slots{job="textfile"}
        values: "0x5 1x40 0x200"
    alert_rule_test:
      - eval_time: 120m
        alertname: pg-checkout-pool-quarantined
        exp_alerts: []

  - name: two pools report and only the max counts, once
    interval: 1m
    input_series:
      - series: pg_checkout_pool_quarantined_slots{instance="a"}
        values: "2x200"
      - series: pg_checkout_pool_quarantined_slots{instance="b"}
        values: "1x200"
    promql_expr_test:
      - expr: count(wrapped:pg_checkout_pool_quarantined)
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 1
