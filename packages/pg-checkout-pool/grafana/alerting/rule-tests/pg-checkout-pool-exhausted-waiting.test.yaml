# promtool unit tests for the pg-checkout-pool-exhausted-waiting alert. Run by the flake check
# test-pg-checkout-pool-alert-rules through check-alert-rules.sh, which generates rules.yml next to
# this file: the Grafana rule's refId A wrapped as `alert: <uid>` with `expr: (<A>) <op> <threshold>`,
# the rule's `for` and labels, plus a recording rule `wrapped:<uid with _>` over the same expression.
# promtool's clock starts at 0 and every series has a 1m interval.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: waiters with no warm-free slot fire after 15m
    interval: 1m
    input_series:
      - series: pg_checkout_pool_waiters{job="textfile"}
        values: "0x2 2x60"
      - series: pg_checkout_pool_slots{state="warm-free"}
        values: "0x62"
      - series: pg_checkout_pool_slots{state="leased"}
        values: "6x62"
    alert_rule_test:
      - eval_time: 15m
        alertname: pg-checkout-pool-exhausted-waiting
        exp_alerts: []
      - eval_time: 20m
        alertname: pg-checkout-pool-exhausted-waiting
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: a warm-free slot means the waiter is about to get it, so no alert
    interval: 1m
    input_series:
      - series: pg_checkout_pool_waiters{job="textfile"}
        values: "2x62"
      - series: pg_checkout_pool_slots{state="warm-free"}
        values: "1x62"
      - series: pg_checkout_pool_slots{state="leased"}
        values: "5x62"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-checkout-pool-exhausted-waiting
        exp_alerts: []

  - name: a full pool with nobody waiting does not fire
    interval: 1m
    input_series:
      - series: pg_checkout_pool_waiters{job="textfile"}
        values: "0x62"
      - series: pg_checkout_pool_slots{state="warm-free"}
        values: "0x62"
      - series: pg_checkout_pool_slots{state="leased"}
        values: "6x62"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-checkout-pool-exhausted-waiting
        exp_alerts: []

  - name: waiters that clear inside 15m never fire
    interval: 1m
    input_series:
      - series: pg_checkout_pool_waiters{job="textfile"}
        values: "2x10 0x60"
      - series: pg_checkout_pool_slots{state="warm-free"}
        values: "0x70"
    alert_rule_test:
      - eval_time: 40m
        alertname: pg-checkout-pool-exhausted-waiting
        exp_alerts: []
