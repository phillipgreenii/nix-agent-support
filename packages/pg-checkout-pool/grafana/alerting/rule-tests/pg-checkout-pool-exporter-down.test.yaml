# promtool unit tests for the pg-checkout-pool-exporter-down alert. Run by the flake check
# test-pg-checkout-pool-alert-rules through check-alert-rules.sh, which generates rules.yml next to
# this file: the Grafana rule's refId A wrapped as `alert: <uid>` with `expr: (<A>) <op> <threshold>`,
# the rule's `for` and labels, plus a recording rule `wrapped:<uid with _>` over the same expression.
# promtool's clock starts at 0 and every series has a 1m interval.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a failing scrape fires after 5m and not before
    interval: 1m
    input_series:
      - series: up{job="pg-checkout-pool"}
        values: "1x5 0x200"
    alert_rule_test:
      - eval_time: 9m
        alertname: pg-checkout-pool-exporter-down
        exp_alerts: []
      - eval_time: 12m
        alertname: pg-checkout-pool-exporter-down
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: a healthy exporter never fires
    interval: 1m
    input_series:
      - series: up{job="pg-checkout-pool"}
        values: "1x200"
    alert_rule_test:
      - eval_time: 120m
        alertname: pg-checkout-pool-exporter-down
        exp_alerts: []

  - name: a blip shorter than 5m never fires
    interval: 1m
    input_series:
      - series: up{job="pg-checkout-pool"}
        values: "1x5 0x3 1x200"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-checkout-pool-exporter-down
        exp_alerts: []

  - name: another job's failing scrape does not count
    interval: 1m
    input_series:
      - series: up{job="pg-checkout-pool"}
        values: "1x200"
      - series: up{job="beads-exporter"}
        values: "0x200"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-checkout-pool-exporter-down
        exp_alerts: []
