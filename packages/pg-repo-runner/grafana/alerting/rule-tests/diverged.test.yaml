# promtool unit tests for the pg-repo-runner-diverged alert. Run by the flake check
# test-pg-repo-runner-alert-rules (check-alert-rules.sh wraps refId A as a Prometheus alert
# with the rule's for and labels).
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: bad value held past the wait fires, for that repo only
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_sync_diverged{repo="alpha"}'
        values: "1x200"
      - series: 'pg_repo_runner_sync_diverged{repo="beta"}'
        values: "0x200"
    alert_rule_test:
      - eval_time: 50m
        alertname: pg-repo-runner-diverged
        exp_alerts: []
      - eval_time: 70m
        alertname: pg-repo-runner-diverged
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: alpha

  - name: the good value never fires
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_sync_diverged{repo="alpha"}'
        values: "0x200"
    alert_rule_test:
      - eval_time: 70m
        alertname: pg-repo-runner-diverged
        exp_alerts: []

  - name: recovery inside the wait never fires
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_sync_diverged{repo="alpha"}'
        values: "1x3 0x200"
    alert_rule_test:
      - eval_time: 70m
        alertname: pg-repo-runner-diverged
        exp_alerts: []
