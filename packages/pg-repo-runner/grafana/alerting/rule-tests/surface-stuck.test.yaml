# promtool unit tests for the pg-repo-runner-surface-stuck alert. Run by the flake check
# test-pg-repo-runner-alert-rules (check-alert-rules.sh wraps refId A as a Prometheus alert
# with the rule's for and labels).
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: bad value held past the wait fires, for that repo only
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_surface_open{repo="alpha",kind="red"}'
        values: "1x10300"
      - series: 'pg_repo_runner_surface_open{repo="beta",kind="red"}'
        values: "0x10300"
    alert_rule_test:
      - eval_time: 10000m
        alertname: pg-repo-runner-surface-stuck
        exp_alerts: []
      - eval_time: 10100m
        alertname: pg-repo-runner-surface-stuck
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: alpha
              kind: red

  - name: the good value never fires
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_surface_open{repo="alpha",kind="red"}'
        values: "0x10300"
    alert_rule_test:
      - eval_time: 10100m
        alertname: pg-repo-runner-surface-stuck
        exp_alerts: []

  - name: recovery inside the wait never fires
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_surface_open{repo="alpha",kind="red"}'
        values: "1x3 0x10300"
    alert_rule_test:
      - eval_time: 10100m
        alertname: pg-repo-runner-surface-stuck
        exp_alerts: []
