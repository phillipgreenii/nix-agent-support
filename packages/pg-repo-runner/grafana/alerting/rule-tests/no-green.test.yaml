# promtool unit tests for the pg-repo-runner-no-green alert. The gauge value is the epoch second
# of the latest locked green verdict (or of the oldest verdict when there never was a green); the
# series value at minute m is 60*m while "fresh", so time() minus the value is the age. The rule
# fires when the age exceeds 2 days (172800 s = 2880 min) and holds for 1h.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a series older than 2 days fires after the wait, for that repo only
    interval: 10m
    input_series:
      - series: 'pg_repo_runner_check_last_green_or_epoch_seconds{repo="alpha"}'
        values: "0x600"
      - series: 'pg_repo_runner_check_last_green_or_epoch_seconds{repo="beta"}'
        values: "0+600x600"
    alert_rule_test:
      - eval_time: 2800m
        alertname: pg-repo-runner-no-green
        exp_alerts: []
      - eval_time: 3000m
        alertname: pg-repo-runner-no-green
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: alpha

  - name: a fresh green never fires
    interval: 10m
    input_series:
      - series: 'pg_repo_runner_check_last_green_or_epoch_seconds{repo="alpha"}'
        values: "0+600x600"
    alert_rule_test:
      - eval_time: 3600m
        alertname: pg-repo-runner-no-green
        exp_alerts: []

  - name: a green 1 day old never fires
    interval: 10m
    input_series:
      - series: 'pg_repo_runner_check_last_green_or_epoch_seconds{repo="alpha"}'
        values: "86400x600"
    alert_rule_test:
      - eval_time: 3000m
        alertname: pg-repo-runner-no-green
        exp_alerts: []
