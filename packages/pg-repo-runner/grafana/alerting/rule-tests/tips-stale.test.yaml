# promtool unit tests for the pg-repo-runner-tips-stale alert. The runner stamps the run time
# every 5 minutes; the rule reads the last stamp, so a runner that stops at minute 10 leaves
# the gap growing past 1800s (30 minutes) at minute 40, and the alert fires after its 5m wait.
# Stamps are epoch seconds: the series value at minute m is 60*m, so time() equals the stamp
# while the runner is running (zero gap).
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a repo whose runs stopped fires once the gap passes 30 minutes plus the wait
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_tips_last_run_timestamp_seconds{repo="alpha"}'
        values: "0+60x10"
      - series: 'pg_repo_runner_tips_last_run_timestamp_seconds{repo="beta"}'
        values: "0+60x100"
    alert_rule_test:
      - eval_time: 40m
        alertname: pg-repo-runner-tips-stale
        exp_alerts: []
      - eval_time: 50m
        alertname: pg-repo-runner-tips-stale
        exp_alerts:
          - exp_labels:
              severity: error
              repo: alpha

  - name: a runner that keeps running never fires
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_tips_last_run_timestamp_seconds{repo="alpha"}'
        values: "0+60x100"
    alert_rule_test:
      - eval_time: 90m
        alertname: pg-repo-runner-tips-stale
        exp_alerts: []

  - name: a gap under 30 minutes never fires
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_tips_last_run_timestamp_seconds{repo="alpha"}'
        values: "0+60x10"
    alert_rule_test:
      - eval_time: 35m
        alertname: pg-repo-runner-tips-stale
        exp_alerts: []

  # Suppression while pg-router holds the repo-tip-source-<repo> registration behind a
  # resource level. The router accrues pg_router_requirement_blocked_seconds_total{role}
  # (role is the registration name, emitters included) every tick while the poll is blocked.
  - name: a repo held by a level stays quiet while its runs are stale
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_tips_last_run_timestamp_seconds{repo="alpha"}'
        values: "0+60x10"
      - series: 'pg_router_requirement_blocked_seconds_total{role="repo-tip-source-alpha",resource="disk_usage",sole="true",steps_below="1"}'
        values: "0+60x100"
    alert_rule_test:
      - eval_time: 50m
        alertname: pg-repo-runner-tips-stale
        exp_alerts: []
      - eval_time: 90m
        alertname: pg-repo-runner-tips-stale
        exp_alerts: []

  - name: a repo admitted by pg-router but not running fires while another repo is held
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_tips_last_run_timestamp_seconds{repo="alpha"}'
        values: "0+60x10"
      - series: 'pg_repo_runner_tips_last_run_timestamp_seconds{repo="beta"}'
        values: "0+60x10"
      - series: 'pg_router_requirement_blocked_seconds_total{role="repo-tip-source-alpha",resource="disk_usage",sole="true",steps_below="1"}'
        values: "0+60x100"
      - series: 'pg_router_requirement_blocked_seconds_total{role="repo-tip-source-beta",resource="disk_usage",sole="true",steps_below="1"}'
        values: "0+60x10 600x90"
    alert_rule_test:
      - eval_time: 50m
        alertname: pg-repo-runner-tips-stale
        exp_alerts:
          - exp_labels:
              severity: error
              repo: beta

  - name: a hold that ended resumes alerting once the 30 minute window drains
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_tips_last_run_timestamp_seconds{repo="alpha"}'
        values: "0+60x10"
      - series: 'pg_router_requirement_blocked_seconds_total{role="repo-tip-source-alpha",resource="disk_usage",sole="true",steps_below="1"}'
        values: "0+60x20 1200x80"
    alert_rule_test:
      - eval_time: 40m
        alertname: pg-repo-runner-tips-stale
        exp_alerts: []
      - eval_time: 60m
        alertname: pg-repo-runner-tips-stale
        exp_alerts:
          - exp_labels:
              severity: error
              repo: alpha

  # A host-wide scrape gap leaves the counter with no samples for a stretch of an active hold.
  # increase() over a short window then returns no series and the suppression would drop out;
  # the 30 minute hold window still reaches the samples taken before the gap. The counter has
  # samples for minutes 0 to 20, none for minutes 21 to 50, then resumes. At minute 46 the
  # stale gap has run past the 30 minutes plus the 5 minute wait, and a 10 minute hold
  # window would hold no sample.
  - name: a scrape gap during a hold keeps the repo quiet
    interval: 1m
    input_series:
      - series: 'pg_repo_runner_tips_last_run_timestamp_seconds{repo="alpha"}'
        values: "0+60x10"
      - series: 'pg_router_requirement_blocked_seconds_total{role="repo-tip-source-alpha",resource="disk_usage",sole="true",steps_below="1"}'
        values: "0+60x20 _x30 3000+60x49"
    alert_rule_test:
      - eval_time: 42m
        alertname: pg-repo-runner-tips-stale
        exp_alerts: []
      - eval_time: 46m
        alertname: pg-repo-runner-tips-stale
        exp_alerts: []
