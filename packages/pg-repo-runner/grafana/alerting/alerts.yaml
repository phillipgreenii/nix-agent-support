# pg-repo-runner unified-alerting rules. The series are the runner's OTLP gauges
# (packages/pg-repo-runner/README.md, section "Metrics"), emitted by `ccpool emit-gauge`
# at the end of each `tips` run (every 5 minutes), so each series is labelled by `repo`
# (the allow-list key) and the rules alert per repo.
#
# Rule "tip-unverified" fires on an unverified tip only when the repo has also gone without a green
# or red verdict for longer than 2 hours plus twice its own latest check duration: a repo whose
# check outlasts the time between its commits always has an unverified current tip, so the tip
# alone cannot clear. A repo with no green or red verdict on record keeps the plain tip signal.
#
# Rules "red-no-newer-tip" and "tip-unverified" read the last known value across gaps with
# last_over_time over 1d, so a runner hold longer than the 5 minute lookback does not drop the
# series and restart their 24h and 2h timers.
#
# Pushed gauges go stale a few minutes after the runner stops, so a dead runner leaves
# no series at all. Rule "tips-stale" therefore reads the LAST KNOWN run time with
# max_over_time over 1d; after a day without any run the series is gone and the rule
# resolves (the launchd-health rules own a runner that is not running at all). The
# other rules have noDataState OK: no series means the runner is not reporting, which
# tips-stale covers.
#
# Rule "no-green" reads the always-present gauge pg_repo_runner_check_last_green_or_epoch_seconds
# (latest locked green, else the oldest locked verdict), so a repo whose tips are always red or
# superseded still alerts after 2 days (operator ruling, Phillip, 2026-11-11: "2 is fine to start
# with"). Severity warning: pg-router-probe files an escalated bead for any firing
# registered rule uid and a bead is a ticket, not a page (docs/superpowers/specs/
# 2026-11-07-probe-grace-period-and-remediation-design.md), so warning does not page.
#
# refId A is plain PromQL and refId C a single `gt 0` threshold stage, so every rule can
# be wrapped and run under `promtool test rules`: packages/pg-repo-runner/check-alert-rules.sh
# does that for the cases under rule-tests/. The `for:` of each rule is the duration the
# operator asked for. The folder "Host" is created by title; never pin a folderUid
# (grafana/grafana#125079). Registered by darwin/modules/pg-repo-runner behind the
# pg-repo-runner enable flag. Every uid below MUST also be registered with pg-router-probe
# in the deployment repo.
apiVersion: 1
groups:
  - orgId: 1
    name: pg-repo-runner-alerts
    folder: Host
    interval: 1m
    rules:
      - uid: pg-repo-runner-tips-failing
        title: pg-repo-runner tips run failing for a repo
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: error
        annotations:
          summary: "pg-repo-runner could not read a repo's tips for over 15 minutes"
          description: "pg_repo_runner_tips_ok has been 0 for over 15 minutes for this repo: the tips run exits 1 for it. Run `pg-repo-runner tips --repo <repo>` by hand and read the run log under the runner's state directory; check that the clone exists and the repo key is still in the workspace."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "1 - pg_repo_runner_tips_ok"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: pg-repo-runner-tips-stale
        title: pg-repo-runner has not run for a repo
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: error
        annotations:
          summary: "pg-repo-runner has not run for a repo for over 30 minutes"
          description: "More than 30 minutes have passed since pg_repo_runner_tips_last_run_timestamp_seconds for this repo (the runner runs every 5 minutes; this reads the last known run, so it resolves after a day without any run). It stays quiet for a repo while pg-router holds that repo's repo-tip-source-<repo> registration behind a resource level (pg_router_requirement_blocked_seconds_total accrued in the last 30 minutes; the window is long enough that a scrape gap of several minutes still leaves two samples): a hold is the cause, not a runner defect, so read pg-router-gate-held (and pg-router-resource-held-nonbest) instead, and `pg-router level list` / `pg-router explain` for the resource. Firing here means pg-router admits the poll but the runner has not run: check the pg-router daemon (`pg-router status --json`) and the runner's run log."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'time() - max by (repo) (max_over_time(pg_repo_runner_tips_last_run_timestamp_seconds[1d])) unless on(repo) label_replace(sum by (role) (increase(pg_router_requirement_blocked_seconds_total{role=~"repo-tip-source-.+"}[30m])) > 0, "repo", "$1", "role", "repo-tip-source-(.+)")'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1800]
      - uid: pg-repo-runner-tip-unverified
        title: pg-repo-runner tip unverified
        condition: C
        for: 2h
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A repo's primary tip is unverified and verify has recorded no green or red verdict for over its own check duration plus 2 hours"
          description: "pg_repo_runner_unverified_tip has been 1 and, for over 2 hours, the newest green or red verdict (pg_repo_runner_check_last_timestamp_seconds, max over result) has been older than 2 hours plus twice the latest check duration (pg_repo_runner_check_last_duration_seconds); both read as the last known value over 1d, so a runner hold does not reset the timer. A repo whose check outlasts the gap between its commits keeps an unverified current tip, so the tip alone is not the signal: verify is not keeping up with the repo (no verdicts recorded). Check that verify is enabled for the repo in the runner allow-list, that pg-router is running, whether every item is load-declined, and the verify role's run log."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "last_over_time(pg_repo_runner_unverified_tip[1d]) == 1 unless on(repo) (time() - max by (repo) (last_over_time(pg_repo_runner_check_last_timestamp_seconds[1d])) <= 7200 + 2 * last_over_time(pg_repo_runner_check_last_duration_seconds[1d]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: pg-repo-runner-red-no-newer-tip
        title: pg-repo-runner repo red with no newer tip
        condition: C
        for: 24h
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A repo has been red for over 24 hours with no newer tip"
          description: "pg_repo_runner_check_latest_red has been 1 for over 24 hours (read as the last known value over 1d, so a runner hold does not reset the timer): the latest non-superseded check verdict of the primary tip is red and no newer tip has replaced it. Read the verdict's log, fix the failure and push a new tip."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "last_over_time(pg_repo_runner_check_latest_red[1d]) == 1"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: pg-repo-runner-diverged
        title: pg-repo-runner clone diverged
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A repo's clone has been diverged from its remote for over 1 hour"
          description: "pg_repo_runner_sync_diverged has been 1 for over 1 hour: the clone has commits the remote lacks and the remote has commits the clone lacks. Use the reconcile-repo skill to rebase and resolve it."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "pg_repo_runner_sync_diverged == 1"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: pg-repo-runner-surface-stuck
        title: pg-repo-runner failure surfacing stuck
        condition: C
        for: 168h
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A runner failure transition has stayed open for over 7 days"
          description: "pg_repo_runner_surface_open (labels repo and kind: red, diverged, needs-relock, build-red) has been 1 for over 7 days: the surfaced item for this repo has not been resolved. Find the open item for the kind, fix the cause or close it if it is stale."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "pg_repo_runner_surface_open == 1"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: pg-repo-runner-no-green
        title: pg-repo-runner no locked green check for a repo
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A repo has had no locked green check for over 2 days"
          description: "pg_repo_runner_check_last_green_or_epoch_seconds is older than 2 days for this repo: no locked green verdict has been stored since then (or ever, in which case the value is the oldest verdict on record). Read the latest verdicts under the runner's state directory; every tip is red, superseded or declined by the verify load ceiling. The verify role is a signal, never a gate."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "time() - max by (repo) (max_over_time(pg_repo_runner_check_last_green_or_epoch_seconds[7d]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [172800]
      - uid: pg-repo-runner-check-timeouts
        title: pg-repo-runner checks keep hitting the wall-clock cap
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Two or more nix flake checks of a repo hit the pg-repo-runner wall-clock cap within a day"
          description: "pg_repo_runner_check_timeouts rose by 2 or more in the last day for this repo: its verify checks were killed at thresholds.check_timeout (default 3600 s) and stored as red verdicts marked timedOut. That is a hung or slow check, not a failing one: read the check log under the runner's state directory for the last output, look for a stuck builder or a wedged nix daemon, and raise thresholds.check_timeout only if the check is legitimately slower."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: "max by (repo) (max_over_time(pg_repo_runner_check_timeouts[1d])) - max by (repo) (min_over_time(pg_repo_runner_check_timeouts[1d]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
