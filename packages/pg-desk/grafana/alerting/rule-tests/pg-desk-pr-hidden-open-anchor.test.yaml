# promtool unit tests for the pg-desk-pr-hidden-open-anchor alert (PR lane refactor, P8b-1). Run by the
# flake check test-pg-desk-alert-rules through grafana/check-alert-rules.sh, which generates rules.yml
# next to this file: the Grafana rule's refId A wrapped as `alert: <uid>` with `expr: (<A>) > 0`, the
# rule's `for: 30m` and labels (severity: info), plus a recording rule `wrapped:<uid with _>`.
#
# Time model: the gauge pg_desk_pr_open_anchors_hidden is unlabelled, emitted with a value (0) when
# healthy, one sample per 1m scrape. A count above 0 that holds for 30m fires: not at 20m, firing at 40m.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a hidden PR with an open anchor fires after 30m, not before, at info severity
    interval: 1m
    input_series:
      - series: pg_desk_pr_open_anchors_hidden{job="pg-desk"}
        values: "2x80"
    promql_expr_test:
      - expr: count(wrapped:pg_desk_pr_hidden_open_anchor)
        eval_time: 40m
        exp_samples:
          - labels: "{}"
            value: 1
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-desk-pr-hidden-open-anchor
        exp_alerts: []
      - eval_time: 40m
        alertname: pg-desk-pr-hidden-open-anchor
        exp_alerts:
          - exp_labels:
              severity: info

  - name: a healthy gauge at 0 is quiet
    interval: 1m
    input_series:
      - series: pg_desk_pr_open_anchors_hidden{job="pg-desk"}
        values: "0x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-desk-pr-hidden-open-anchor
        exp_alerts: []

  - name: empty input is quiet
    interval: 1m
    input_series:
      - series: unrelated_metric{job="other"}
        values: "1x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-desk-pr-hidden-open-anchor
        exp_alerts: []

  - name: a hidden PR that is un-hidden before 30m never fires
    interval: 1m
    input_series:
      - series: pg_desk_pr_open_anchors_hidden{job="pg-desk"}
        values: "1x10 0x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-desk-pr-hidden-open-anchor
        exp_alerts: []

  - name: SYSTEM_PAUSE suppresses it
    interval: 1m
    input_series:
      - series: pg_desk_pr_open_anchors_hidden{job="pg-desk"}
        values: "2x80"
      - series: pg_router_gates_active{type="SYSTEM_PAUSE",job="pg-router"}
        values: "1x80"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-desk-pr-hidden-open-anchor
        exp_alerts: []
