# promtool unit tests for the pg-desk-issue-unflagged-members alert. Run by the flake check
# test-pg-desk-alert-rules through grafana/check-alert-rules.sh, which generates rules.yml next to
# this file: the Grafana rule's refId A wrapped as `alert: <uid>` with `expr: (<A>) > 0` (the
# refId C evaluator), the rule's `for: 10m` and labels, plus a recording rule `wrapped:<uid with _>`.
#
# Time model: 1m series, one poll every 5 minutes. The rule reads the count the last poll stored of
# watched-query members whose pg-desk entity is not flagged watched. Any non-zero value held for 10m
# (two consecutive polls) fires; a count that is non-zero for one poll only does not. promtool cannot
# run Grafana's noDataState, so the absence semantics of the expression are pinned with
# promql_expr_test: with pg-desk up and the series absent the expression is EMPTY (NoData, which
# noDataState: Alerting turns into an alert), and with pg-desk down it answers 0.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a non-zero count held for two polls fires per backend, a zero count does not
    interval: 1m
    input_series:
      - series: pg_desk_issue_unflagged_members{backend="jira-a",job="pg-desk"}
        values: "3x60"
      - series: pg_desk_issue_unflagged_members{backend="jira-b",job="pg-desk"}
        values: "0x60"
      - series: pg_desk_liveness{job="pg-desk"}
        values: "1x60"
    alert_rule_test:
      - eval_time: 5m
        alertname: pg-desk-issue-unflagged-members
        exp_alerts: []
      - eval_time: 20m
        alertname: pg-desk-issue-unflagged-members
        exp_alerts:
          - exp_labels:
              backend: jira-a
              severity: warning

  - name: a count that is non-zero for one poll only does not fire
    interval: 1m
    input_series:
      - series: pg_desk_issue_unflagged_members{backend="jira-a",job="pg-desk"}
        values: "0x10 2x4 0x45"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-desk-issue-unflagged-members
        exp_alerts: []

  - name: the duplicate job series of one backend is one alert instance
    interval: 1m
    input_series:
      - series: pg_desk_issue_unflagged_members{backend="jira-a",job="pg-desk"}
        values: "1x60"
      - series: pg_desk_issue_unflagged_members{backend="jira-a",job="pg-desk-legacy"}
        values: "1x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-desk-issue-unflagged-members
        exp_alerts:
          - exp_labels:
              backend: jira-a
              severity: warning

  - name: the alert clears when the members are flagged
    interval: 1m
    input_series:
      - series: pg_desk_issue_unflagged_members{backend="jira-a",job="pg-desk"}
        values: "3x20 0x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: pg-desk-issue-unflagged-members
        exp_alerts:
          - exp_labels:
              backend: jira-a
              severity: warning
      - eval_time: 40m
        alertname: pg-desk-issue-unflagged-members
        exp_alerts: []

  - name: pg-desk down (no series at all) is quiet, the liveness rule speaks
    interval: 1m
    input_series:
      - series: unrelated_metric{job="other"}
        values: "1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-desk-issue-unflagged-members
        exp_alerts: []

  - name: the expression is empty (NoData) with pg-desk up and the series absent, and 0 with pg-desk down
    interval: 1m
    input_series:
      - series: pg_desk_liveness{job="pg-desk"}
        values: "1x30 _x30"
    promql_expr_test:
      - expr: max by (backend) (pg_desk_issue_unflagged_members) or (vector(0) and on() absent(pg_desk_liveness == 1))
        eval_time: 10m
        exp_samples: []
      - expr: max by (backend) (pg_desk_issue_unflagged_members) or (vector(0) and on() absent(pg_desk_liveness == 1))
        eval_time: 50m
        exp_samples:
          - labels: "{}"
            value: 0
