# promtool unit tests for the pg-desk-ingest-failed-old alert. Run by the flake check
# test-pg-desk-alert-rules through grafana/check-alert-rules.sh, which generates rules.yml next to
# this file: the Grafana rule's refId A wrapped as `alert: <uid>` with `expr: (<A>) > 1800` (the
# refId C evaluator), the rule's `for: 10m` and labels, plus a recording rule `wrapped:<uid with _>`.
#
# Time model: 1m series. The rule reads the oldest failed-ingest age per backend instance, FIXED
# threshold 1800 seconds (the config key hydration.ingest_failed_max_age governs doctor only), held
# for 10m: the age must be STRICTLY above 1800 (1800 itself is quiet). promtool cannot run Grafana's
# noDataState, so the absence semantics of the expression are pinned with promql_expr_test: with
# pg-desk up and the series absent the expression is EMPTY (NoData, which noDataState: Alerting
# turns into an alert), and with pg-desk down it answers 0 so pg-desk-liveness-down speaks alone.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: an old entry fires per backend after the hold, a younger one does not
    interval: 1m
    input_series:
      - series: pg_desk_ingest_failed_oldest_age_seconds{backend="jira-a",job="pg-desk"}
        values: "2400x60"
      - series: pg_desk_ingest_failed_oldest_age_seconds{backend="jira-b",job="pg-desk"}
        values: "600x60"
      - series: pg_desk_liveness{job="pg-desk"}
        values: "1x60"
    alert_rule_test:
      - eval_time: 5m
        alertname: pg-desk-ingest-failed-old
        exp_alerts: []
      - eval_time: 20m
        alertname: pg-desk-ingest-failed-old
        exp_alerts:
          - exp_labels:
              backend: jira-a
              severity: warning

  - name: the duplicate job series of one backend is one alert instance
    interval: 1m
    input_series:
      - series: pg_desk_ingest_failed_oldest_age_seconds{backend="jira-a",job="pg-desk"}
        values: "2400x60"
      - series: pg_desk_ingest_failed_oldest_age_seconds{backend="jira-a",job="pg-desk-legacy"}
        values: "2400x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-desk-ingest-failed-old
        exp_alerts:
          - exp_labels:
              backend: jira-a
              severity: warning

  - name: an age growing past the bound fires, exactly the bound does not
    interval: 1m
    input_series:
      - series: pg_desk_ingest_failed_oldest_age_seconds{backend="jira-a",job="pg-desk"}
        values: "0x10 1801x50"
      - series: pg_desk_ingest_failed_oldest_age_seconds{backend="jira-b",job="pg-desk"}
        values: "1800x60"
    alert_rule_test:
      - eval_time: 15m
        alertname: pg-desk-ingest-failed-old
        exp_alerts: []
      - eval_time: 30m
        alertname: pg-desk-ingest-failed-old
        exp_alerts:
          - exp_labels:
              backend: jira-a
              severity: warning

  - name: the alert clears when the table empties
    interval: 1m
    input_series:
      - series: pg_desk_ingest_failed_oldest_age_seconds{backend="jira-a",job="pg-desk"}
        values: "2400x20 0x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: pg-desk-ingest-failed-old
        exp_alerts:
          - exp_labels:
              backend: jira-a
              severity: warning
      - eval_time: 40m
        alertname: pg-desk-ingest-failed-old
        exp_alerts: []

  - name: an empty table (age 0) is quiet
    interval: 1m
    input_series:
      - series: pg_desk_ingest_failed_oldest_age_seconds{backend="jira-a",job="pg-desk"}
        values: "0x60"
      - series: pg_desk_liveness{job="pg-desk"}
        values: "1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-desk-ingest-failed-old
        exp_alerts: []

  - name: pg-desk down (no series at all) is quiet, the liveness rule speaks
    interval: 1m
    input_series:
      - series: unrelated_metric{job="other"}
        values: "1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-desk-ingest-failed-old
        exp_alerts: []

  - name: the expression is empty (NoData) with pg-desk up and the series absent, and 0 with pg-desk down
    interval: 1m
    input_series:
      - series: pg_desk_liveness{job="pg-desk"}
        values: "1x30 _x30"
    promql_expr_test:
      - expr: (max by (backend) (pg_desk_ingest_failed_oldest_age_seconds) unless on() (max_over_time(pg_router_producer_load_backoff[10m]) > 0)) or (vector(0) and on() (max_over_time(pg_router_producer_load_backoff[10m]) > 0)) or (vector(0) and on() absent(pg_desk_liveness == 1))
        eval_time: 10m
        exp_samples: []
      - expr: (max by (backend) (pg_desk_ingest_failed_oldest_age_seconds) unless on() (max_over_time(pg_router_producer_load_backoff[10m]) > 0)) or (vector(0) and on() (max_over_time(pg_router_producer_load_backoff[10m]) > 0)) or (vector(0) and on() absent(pg_desk_liveness == 1))
        eval_time: 50m
        exp_samples:
          - labels: "{}"
            value: 0

  # The age grows 1 s per second while pg-router skips every producer tick (host-load
  # backoff, gauge 1 from minute 4 to 39), so no retry ran and nothing failed. Without the
  # exemption the age passes 1800 at minute 30 and the alert fires at minute 41; with it the
  # rule stays quiet through minute 49 and the exemption is a label-less 0, never NoData.
  - name: an age grown only under a router backoff does not fire
    interval: 1m
    input_series:
      - series: pg_desk_ingest_failed_oldest_age_seconds{backend="jira-a",job="pg-desk"}
        values: "0+60x60"
      - series: pg_desk_liveness{job="pg-desk"}
        values: "1x60"
      - series: pg_router_producer_load_backoff{job="pg-router"}
        values: "0x4 1x36 0x20"
    alert_rule_test:
      - eval_time: 35m
        alertname: pg-desk-ingest-failed-old
        exp_alerts: []
      - eval_time: 45m
        alertname: pg-desk-ingest-failed-old
        exp_alerts: []
    promql_expr_test:
      - expr: (max by (backend) (pg_desk_ingest_failed_oldest_age_seconds) unless on() (max_over_time(pg_router_producer_load_backoff[10m]) > 0)) or (vector(0) and on() (max_over_time(pg_router_producer_load_backoff[10m]) > 0)) or (vector(0) and on() absent(pg_desk_liveness == 1))
        eval_time: 45m
        exp_samples:
          - labels: "{}"
            value: 0

  # The backoff ended long ago and the entry is still failing: a genuinely stuck entry fires.
  - name: a stuck entry fires once the backoff window has passed
    interval: 1m
    input_series:
      - series: pg_desk_ingest_failed_oldest_age_seconds{backend="jira-a",job="pg-desk"}
        values: "2400x60"
      - series: pg_router_producer_load_backoff{job="pg-router"}
        values: "1x5 0x55"
    alert_rule_test:
      - eval_time: 10m
        alertname: pg-desk-ingest-failed-old
        exp_alerts: []
      - eval_time: 40m
        alertname: pg-desk-ingest-failed-old
        exp_alerts:
          - exp_labels:
              backend: jira-a
              severity: warning
