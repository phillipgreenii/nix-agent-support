# promtool unit tests for the pg-desk-watch-listing-degraded alert (PR lane refactor, P8a-1). Run by the flake check
# test-pg-desk-alert-rules through grafana/check-alert-rules.sh, which generates rules.yml next to
# this file: the Grafana rule's refId A wrapped as `alert: <uid>` with `expr: (<A>) > 0`, the
# rule's `for: 30m` and labels, plus a recording rule `wrapped:<uid with _>`.
#
# Time model: 1m series. The rule is `sum` over the issue and thread series of
# pg_desk_watch_listing_status whose status is not ok (scoped in P8a: the PR inputs vanish after P3b2)
# and fires above 0 held for 30m: not at 25m, firing at 35m. A pr series is not selected at all.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a degraded issue listing fires after 30m
    interval: 1m
    input_series:
      - series: pg_desk_watch_listing_status{type="issue",status="degraded",job="pg-desk"}
        values: "1x90"
      - series: pg_desk_watch_listing_status{type="issue",status="ok",job="pg-desk"}
        values: "2x90"
    alert_rule_test:
      - eval_time: 25m
        alertname: pg-desk-watch-listing-degraded
        exp_alerts: []
      - eval_time: 35m
        alertname: pg-desk-watch-listing-degraded
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: a failed thread listing fires
    interval: 1m
    input_series:
      - series: pg_desk_watch_listing_status{type="thread",status="failed",job="pg-desk"}
        values: "1x90"
    alert_rule_test:
      - eval_time: 35m
        alertname: pg-desk-watch-listing-degraded
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: a degraded pr listing is scoped out
    interval: 1m
    input_series:
      - series: pg_desk_watch_listing_status{type="pr",status="degraded",job="pg-desk"}
        values: "3x90"
      - series: pg_desk_watch_listing_status{type="pr",status="failed",job="pg-desk"}
        values: "2x90"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-desk-watch-listing-degraded
        exp_alerts: []

  - name: healthy listings and an empty input are quiet
    interval: 1m
    input_series:
      - series: pg_desk_watch_listing_status{type="issue",status="ok",job="pg-desk"}
        values: "2x90"
      - series: pg_desk_watch_listing_status{type="issue",status="degraded",job="pg-desk"}
        values: "0x90"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-desk-watch-listing-degraded
        exp_alerts: []

  - name: no series at all is quiet
    interval: 1m
    input_series:
      - series: unrelated_metric{job="other"}
        values: "1x90"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-desk-watch-listing-degraded
        exp_alerts: []
