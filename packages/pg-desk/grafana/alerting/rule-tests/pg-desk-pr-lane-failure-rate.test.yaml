# promtool unit tests for the pg-desk-pr-lane-failure-rate alert (PR lane refactor, P8a-1). Run by the flake check
# test-pg-desk-alert-rules through grafana/check-alert-rules.sh, which generates rules.yml next to
# this file: the Grafana rule's refId A wrapped as `alert: <uid>` with `expr: (<A>) > 5`, the
# rule's `for: 15m` and labels, plus a recording rule `wrapped:<uid with _>`.
#
# Time model: 1m series. The rule sums increase(pg_desk_pr_lane_runs_total[1h]) over the classes other
# than unauthenticated and decide_failed, by stage and class, and fires above 5 held for 15m. A
# counter rising by 1 a minute crosses 5 at about 6m and fires after the 15m hold: not at 15m,
# firing at 30m.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: transient failures at one a minute fire, labelled by stage and class
    interval: 1m
    input_series:
      - series: pg_desk_pr_lane_runs_total{stage="hydrate",class="transient",job="pg-desk"}
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 15m
        alertname: pg-desk-pr-lane-failure-rate
        exp_alerts: []
      - eval_time: 30m
        alertname: pg-desk-pr-lane-failure-rate
        exp_alerts:
          - exp_labels:
              stage: hydrate
              class: transient
              severity: warning

  - name: each class is its own alert instance
    interval: 1m
    input_series:
      - series: pg_desk_pr_lane_runs_total{stage="hydrate",class="transient",job="pg-desk"}
        values: "0+1x120"
      - series: pg_desk_pr_lane_runs_total{stage="hydrate",class="hydrate_error",job="pg-desk"}
        values: "0+1x120"
      - series: pg_desk_pr_lane_runs_total{stage="decide",class="decide_partial",job="pg-desk"}
        values: "0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-desk-pr-lane-failure-rate
        exp_alerts:
          - exp_labels:
              stage: hydrate
              class: hydrate_error
              severity: warning
          - exp_labels:
              stage: hydrate
              class: transient
              severity: warning

  - name: the hard classes are not this rule's
    interval: 1m
    input_series:
      - series: pg_desk_pr_lane_runs_total{stage="hydrate",class="unauthenticated",job="pg-desk"}
        values: "0+1x120"
      - series: pg_desk_pr_lane_runs_total{stage="decide",class="decide_failed",job="pg-desk"}
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-desk-pr-lane-failure-rate
        exp_alerts: []

  - name: a few failures an hour (below the rate) are quiet
    interval: 1m
    input_series:
      - series: pg_desk_pr_lane_runs_total{stage="hydrate",class="transient",job="pg-desk"}
        values: "0x20 2x20 4x80"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-desk-pr-lane-failure-rate
        exp_alerts: []
      - eval_time: 100m
        alertname: pg-desk-pr-lane-failure-rate
        exp_alerts: []

  - name: healthy zero-filled series are quiet
    interval: 1m
    input_series:
      - series: pg_desk_pr_lane_runs_total{stage="hydrate",class="transient",job="pg-desk"}
        values: "0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-desk-pr-lane-failure-rate
        exp_alerts: []

  - name: empty input is quiet
    interval: 1m
    input_series:
      - series: unrelated_metric{job="other"}
        values: "1x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-desk-pr-lane-failure-rate
        exp_alerts: []

  - name: SYSTEM_PAUSE suppresses it
    interval: 1m
    input_series:
      - series: pg_desk_pr_lane_runs_total{stage="hydrate",class="transient",job="pg-desk"}
        values: "0+1x120"
      - series: pg_router_gates_active{type="SYSTEM_PAUSE",job="pg-router"}
        values: "1x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-desk-pr-lane-failure-rate
        exp_alerts: []
