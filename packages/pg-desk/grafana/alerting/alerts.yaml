# pg-desk unified-alerting rules (pg2-02n5o): counterpart to
# packages/pg-router/grafana/alerting/alerts.yaml -- see that file's header
# for the shared incident context (pg2-5sirm) and the folder-convergence
# mechanism (ADR 0039, phillipgreenii-nix-support-apps).
#
# Metric names and semantics verified against (not guessed):
#   - phillipgreenii-nix-support-apps/darwin/modules/observability/
#     dashboards/pg-desk-metrics.json (the existing dashboard panels)
#   - packages/pg-desk/internal/metrics/metrics.go (this repo)
#
# pg-desk has no queue/backlog metric of its own -- it serves a synced
# snapshot rather than processing a queue like pg-router does.
# pg_desk_dashboard_stale / pg_desk_dashboard_age_seconds are the closest
# analog: a persistently stale snapshot IS pg-desk's version of an
# unprocessed backlog that never drains. They are PIPELINE LIVENESS (the age
# of meta.last_heartbeat, i.e. whether the desk-heartbeat role is still
# running), NOT data age; the age of each source's last successful origin
# fetch is pg_desk_source_age_seconds{source}, on which no rule is shipped.
#
# Folder "pg-desk" converges by TITLE with the existing pg-desk dashboards'
# own dashboardProviders folder (phillipgreenii-nix-support-apps
# darwin/modules/observability/ui.nix's `pg-desk = { folder = "pg-desk"; ... }`).
#
# Registered via phillipgreenii.observability.alertRuleFiles from
# darwin/modules/pg-desk-serve/default.nix, gated on this module's own
# `cfg.enable` -- registering the file is harmless even before the service
# starts being scraped.
apiVersion: 1
groups:
  - orgId: 1
    name: pg-desk-alerts
    folder: pg-desk
    interval: 1m
    rules:
      # Liveness: pg_desk_liveness reports 1 whenever pg-desk serve answers
      # a scrape (internal/metrics/metrics.go's MetricLiveness -- the
      # OTel-native successor to the old hand-written `pg_desk_up 1`).
      # noDataState: Alerting for the same reason as pg-router's own
      # liveness rule -- once pg-desk-serve is enabled, an absent series
      # means the process itself is down or unreachable, which is the
      # failure this rule exists to catch, not a benign "nobody's watching"
      # absence.
      - uid: pg-desk-liveness-down
        title: pg-desk-serve liveness is down
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pg-desk-serve liveness has been down for over 5 minutes"
          description: "pg_desk_liveness has reported 0, or gone missing from Prometheus entirely, for over 5 minutes -- pg-desk-serve's /metrics endpoint is unreachable. Check the com.phillipg.pg-desk-serve LaunchAgent."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: pg_desk_liveness
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # Pipeline-liveness backlog-equivalent: pg_desk_dashboard_stale is
      # pg-desk's own explicit 0=fresh/1=stale flag over meta.last_heartbeat (it
      # is NOT data age, see pg_desk_source_age_seconds) (design doc section 8;
      # staleAfterSeconds = syncIntervalSeconds * boundIntervals -- see
      # pg-desk-metrics.json's "Stale" panel description for the exact
      # polarity, which is pinned and deliberately the OPPOSITE of a
      # presence-style panel). A sustained stale reading means the synced
      # snapshot has stopped being refreshed -- the pg-desk analog of a
      # growing, undrained backlog. noDataState: OK -- total absence of the
      # metric (the process itself being down) is already covered by the
      # dedicated liveness rule above.
      #
      # pg2-9awkw: SUPPRESSED while a pg-router SYSTEM_PAUSE gate is in force.
      # A pause blocks the producer from dispatching the desk-heartbeat role,
      # so meta.last_heartbeat stops advancing and the snapshot goes stale BY
      # DESIGN (2026-10-02: a deliberate ~2h38m pause fired this rule as a
      # false positive). The expression is
      #   pg_desk_dashboard_stale unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)
      # i.e. drop the stale series whenever ANY SYSTEM_PAUSE series reads 1.
      #   - `on()` matches on no labels, so the differing label sets (job=
      #     pg-desk/pg-pr vs job=pg-router, instance, ...) cannot make the
      #     match silently fail and disable the alert; both the job=pg-desk
      #     and the job=pg-pr duplicate series are suppressed together.
      #   - pg-router exports pg_router_gates_active ONLY for gate types
      #     currently in force (an ObservableGauge with one point per active
      #     gate), so the series is normally ABSENT. An absent or 0 gate
      #     series leaves the left side untouched: the rule behaves exactly as
      #     before (fail-open toward alerting). This includes pg-router being
      #     down/unscraped.
      #   - While suppressed the query returns no data; noDataState: OK turns
      #     that into Normal, so an Alerting/Pending instance resolves when the
      #     pause begins. After the pause clears, the `for: 10m` window
      #     restarts, giving the heartbeat time to resume before it can fire.
      - uid: pg-desk-sync-stale
        title: pg-desk-serve dashboard snapshot is stale
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-desk-serve's dashboard snapshot has been stale for over 10 minutes"
          description: 'pg_desk_dashboard_stale has reported 1 for over 10 minutes -- the served snapshot has not been refreshed within its configured staleAfterSeconds bound. See pg_desk_dashboard_age_seconds for the actual age in seconds. This rule is suppressed while a pg-router SYSTEM_PAUSE gate is active (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1), because a pause deliberately stops the desk-heartbeat dispatch; if it fires, no SYSTEM_PAUSE gate was in force.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: pg_desk_dashboard_stale unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gte
                    params: [1]

      # Failure rate: pg_desk_sync_errors_total, by repo. NOTE (as of this
      # writing, per pg-desk-metrics.json's own panel description): this
      # counter is registered and exposed, but serve has no live call site
      # wired for it yet -- serve never itself runs sync, so there is
      # nowhere in its own request path to observe a sync failure the
      # moment it happens (see packages/pg-desk/internal/metrics's
      # MetricSyncErrors doc comment). This rule is therefore
      # forward-looking/best-effort: it cannot fire today (the series stays
      # permanently absent, which noDataState: OK correctly treats as
      # healthy, not broken) until a future task wires the cross-process
      # call site. Included now so the alert exists the moment that call
      # site lands, rather than being a second, separately-remembered
      # follow-up.
      - uid: pg-desk-sync-errors
        title: pg-desk sync failure rate is non-zero (by repo)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-desk sync error rate for repo {{ $labels.repo }} has been non-zero"
          description: "sum by (repo) (rate(pg_desk_sync_errors_total[10m])) has stayed above 0 for over 10 minutes for repo {{ $labels.repo }}. NOTE: pg_desk_sync_errors_total has no live call site wired as of pg2-02n5o -- this rule cannot fire until a future task wires it (see pg-desk-metrics.json's 'Sync errors / sec' panel description)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum by (repo) (rate(pg_desk_sync_errors_total[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # pg2-kftf9.5: leaked-anchor signals. pg_desk_sync_error_rows and
      # pg_desk_oldest_sync_error_age_seconds are derived from the shared
      # store at scrape time (internal/httpapi/metrics_handler.go), so they
      # DO see failures recorded by the separate `pg-desk run` process --
      # unlike pg_desk_sync_errors_total above, which has no live call site.

      # pg2-qki4v: the sync_error rows are split by automatic-retry state
      # (pg2-xb6fs; internal/metrics/metrics.go's
      # MetricSyncErrorRetryingRows / MetricSyncErrorExhaustedRows) so only a
      # row needing a person pages critical:
      #   - exhausted (retry bound reached, or a non-transient failure that
      #     was never retried): stays non-zero until an operator reconcile
      #     -> critical.
      #   - retrying (transient, still inside the retry bound): a pg-router /
      #     pg-desk restart killing an in-flight dispatch records one of
      #     these and it self-heals within ~30m with no operator action
      #     -> warning, and only once it outlives that typical window.
      # pg_desk_sync_error_rows (the sum of the two) is deliberately no
      # longer alerted on directly.

      - uid: pg-desk-sync-error-rows
        title: pg-desk has rows with a recorded sync_error and no automatic retry left
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pg-desk has {{ $values.B }} sync_error row(s) with no automatic retry left"
          description: "pg_desk_sync_error_exhausted_rows has been above 0 for over 5 minutes -- one or more PR anchors failed bead sync and will not be retried automatically (the retry bound was reached, or the failure is non-transient), so they may have leaked open merge-request or child beads. These need an operator: run `pg-desk doctor` (or `pg-desk status`) for the affected entities, then `pg-desk reconcile`."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: pg_desk_sync_error_exhausted_rows
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: pg-desk-sync-error-retrying
        title: pg-desk has sync_error rows still being retried automatically
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-desk has {{ $values.B }} sync_error row(s) still being retried for over 30 minutes"
          description: "pg_desk_sync_error_retrying_rows has been above 0 for over 30 minutes -- one or more PR anchors have a transient sync_error and are within the automatic retry bound (1m backoff doubling to 30m, 10 retries), but have not healed within the usual window. No action is needed yet; if they exhaust, pg-desk-sync-error-rows pages critical."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: pg_desk_sync_error_retrying_rows
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # pg2-h7grf: same policy as the row-count rules above, applied to the
      # age rule. There is NO per-state age metric (the age is of the oldest
      # sync_error row whatever its retry state, measured from the row's
      # as_of -- internal/httpapi/metrics_handler.go's syncErrorStats), so a
      # row that is healthily retrying also ages, and the old 3600s threshold
      # paged critical on it: the 2026-10-01 burst (rows aged to ~4215s, then
      # healed, all rows retrying, none exhausted) is the evidence. The rule
      # stays critical but its threshold now sits ABOVE the retry horizon, so
      # it fires only for a row that outlived every automatic retry; a row
      # that exhausts is already paged by pg-desk-sync-error-rows.
      #
      # Threshold 21600s (6h), derived from the pg-desk defaults
      # (internal/config DefaultSyncRetry*; sync.RetryPolicy.Backoff):
      #   - backoff alone: the 10 automatic retries wait 1m, 2m, 4m, 8m, 16m,
      #     then 30m x5 = 181m = 10860s before the row is exhausted;
      #   - but retries run only when `pg-desk reconcile` does (ZR's
      #     desk-reconcile role, every 30m), so once the backoff is <= 30m each
      #     retry costs one whole 30m tick: <= 10 x 30m = 300m = 18000s;
      #   - plus a 1h margin for a slow/budget-limited reconcile pass and the
      #     5m `for` => 21600s.
      # The test (sync_error_rules_test.go) derives the backoff sum and the
      # tick-bound horizon from the Go constants and fails if the threshold
      # drops to or below either, so retuning sync.retry must retune this.
      - uid: pg-desk-unreconciled-anchor-age
        title: pg-desk oldest sync_error is older than 6 hours (past every automatic retry)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pg-desk has had an unreconciled sync_error anchor for over 6 hours"
          description: "pg_desk_oldest_sync_error_age_seconds has exceeded 21600 (6h) for over 5 minutes -- longer than every automatic retry can take (10 retries, 1m backoff doubling to 30m, run on the 30m reconcile cadence, about 5h at most), so an anchor with a recorded sync_error was not reconciled by any retry. It has exhausted its retries or needs a person: run `pg-desk doctor` (or `pg-desk status`), then `pg-desk reconcile --retry-all`. A row still retrying younger than this is expected and does not page here."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: pg_desk_oldest_sync_error_age_seconds
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [21600]

      # Sweep sizing bound (docket pg2-x3h8c, ADR 0077 S30/S31): a cap on the
      # per-poll sweep is allowed ONLY while its bound
      #   active_count / sweep.max_per_poll x poll_interval <= age
      # is checked AND alerting, so a violated bound pages, not just a
      # `pg-desk doctor` line. pg_desk_sweep_bound_violated{type,tier} reads 1
      # for a (type, tier) whose bound is violated and 0 when it holds, per
      # capped age tier (tier=remote: re-hydration against sweep.max_age;
      # tier=local: reconcile against sweep.reconcile_age). It is computed at
      # scrape time by changes.EvaluateSweepBound -- the SAME evaluation
      # `pg-desk doctor` prints -- so the alert and the doctor line agree.
      #
      # pg-desk does not own the poll interval; `pg-desk serve --router-config
      # <path>` (or env PG_DESK_ROUTER_CONFIG) supplies it from the router
      # config. While it is not supplied (or the type has no matching router
      # query) the metric has NO series for that type: no verdict, never a
      # false violation. noDataState: OK treats that absence as Normal.
      #
      # `max by (type, tier)` collapses the duplicate job=pg-desk / job=pg-pr
      # series so each (type, tier) is ONE alert instance. `for: 15m` rides
      # out a transient count spike (the bound is a steady-state sizing
      # property, not a point-in-time fault); warning, because a violated
      # bound degrades freshness gradually rather than breaking serving.
      - uid: pg-desk-sweep-bound-violated
        title: pg-desk sweep sizing bound is violated (by type and tier)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-desk sweep bound violated for type {{ $labels.type }}, tier {{ $labels.tier }}"
          description: "pg_desk_sweep_bound_violated has read 1 for type {{ $labels.type }}, tier {{ $labels.tier }} for over 15 minutes -- active_count / sweep.max_per_poll x poll_interval exceeds the tier's age (tier=remote: sweep.max_age; tier=local: sweep.reconcile_age), so the sweep falls behind and some active entities go longer than that age between refreshes. Run `pg-desk doctor --router-config <path>` for the inputs, then raise sweep.max_per_poll, lengthen the age, or shorten the poll interval."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max by (type, tier) (pg_desk_sweep_bound_violated)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gte
                    params: [1]
