# pg-desk unified-alerting rules (pg2-02n5o): counterpart to
# packages/pg-router/grafana/alerting/alerts.yaml -- see that file's header
# for the shared incident context (pg2-5sirm) and the folder-convergence
# mechanism (ADR 0039, phillipgreenii-nix-support-apps).
#
# Metric names and semantics verified against (not guessed):
#   - phillipgreenii-nix-support-apps/darwin/modules/observability/
#     dashboards/pg-desk-metrics.json (the existing dashboard panels)
#   - packages/pg-desk/internal/metrics/metrics.go (this repo)
#
# pg-desk has no queue/backlog metric of its own -- it serves a synced
# snapshot rather than processing a queue like pg-router does.
# pg_desk_dashboard_stale / pg_desk_dashboard_age_seconds are the closest
# analog: a persistently stale snapshot IS pg-desk's version of an
# unprocessed backlog that never drains. They are PIPELINE LIVENESS (the age
# of meta.last_heartbeat, i.e. whether the desk-heartbeat role is still
# running), NOT data age; the age of each source's last successful origin
# fetch is pg_desk_source_age_seconds{source}, on which no rule is shipped.
#
# Folder "pg-desk" converges by TITLE with the existing pg-desk dashboards'
# own dashboardProviders folder (phillipgreenii-nix-support-apps
# darwin/modules/observability/ui.nix's `pg-desk = { folder = "pg-desk"; ... }`).
#
# Registered via phillipgreenii.observability.alertRuleFiles from
# darwin/modules/pg-desk-serve/default.nix, gated on this module's own
# `cfg.enable` -- registering the file is harmless even before the service
# starts being scraped.
apiVersion: 1
groups:
  - orgId: 1
    name: pg-desk-alerts
    folder: pg-desk
    interval: 1m
    rules:
      # Liveness: pg_desk_liveness reports 1 whenever pg-desk serve answers
      # a scrape (internal/metrics/metrics.go's MetricLiveness -- the
      # OTel-native successor to the old hand-written `pg_desk_up 1`).
      # noDataState: Alerting for the same reason as pg-router's own
      # liveness rule -- once pg-desk-serve is enabled, an absent series
      # means the process itself is down or unreachable, which is the
      # failure this rule exists to catch, not a benign "nobody's watching"
      # absence.
      - uid: pg-desk-liveness-down
        title: pg-desk-serve liveness is down
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pg-desk-serve liveness has been down for over 5 minutes"
          description: "pg_desk_liveness has reported 0, or gone missing from Prometheus entirely, for over 5 minutes -- pg-desk-serve's /metrics endpoint is unreachable. Check the com.phillipg.pg-desk-serve LaunchAgent."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: pg_desk_liveness
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # Pipeline-liveness backlog-equivalent: pg_desk_dashboard_stale is
      # pg-desk's own explicit 0=fresh/1=stale flag over meta.last_heartbeat (it
      # is NOT data age, see pg_desk_source_age_seconds) (design doc section 8;
      # staleAfterSeconds = syncIntervalSeconds * boundIntervals -- see
      # pg-desk-metrics.json's "Stale" panel description for the exact
      # polarity, which is pinned and deliberately the OPPOSITE of a
      # presence-style panel). A sustained stale reading means the synced
      # snapshot has stopped being refreshed -- the pg-desk analog of a
      # growing, undrained backlog. noDataState: OK -- total absence of the
      # metric (the process itself being down) is already covered by the
      # dedicated liveness rule above.
      #
      # pg2-9awkw: SUPPRESSED while a pg-router SYSTEM_PAUSE gate is in force.
      # A pause blocks the producer from dispatching the desk-heartbeat role,
      # so meta.last_heartbeat stops advancing and the snapshot goes stale BY
      # DESIGN (2026-10-02: a deliberate ~2h38m pause fired this rule as a
      # false positive). The expression is
      #   pg_desk_dashboard_stale unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)
      # i.e. drop the stale series whenever ANY SYSTEM_PAUSE series reads 1.
      #   - `on()` matches on no labels, so the differing label sets (job=
      #     pg-desk/pg-desk-legacy vs job=pg-router, instance, ...) cannot make the
      #     match silently fail and disable the alert; both the job=pg-desk
      #     and the job=pg-desk-legacy duplicate series are suppressed together.
      #   - pg-router exports pg_router_gates_active ONLY for gate types
      #     currently in force (an ObservableGauge with one point per active
      #     gate), so the series is normally ABSENT. An absent or 0 gate
      #     series leaves the left side untouched: the rule behaves exactly as
      #     before (fail-open toward alerting). This includes pg-router being
      #     down/unscraped.
      #   - While suppressed the query returns no data; noDataState: OK turns
      #     that into Normal, so an Alerting/Pending instance resolves when the
      #     pause begins. After the pause clears, the `for: 10m` window
      #     restarts, giving the heartbeat time to resume before it can fire.
      - uid: pg-desk-sync-stale
        title: pg-desk-serve dashboard snapshot is stale
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-desk-serve's dashboard snapshot has been stale for over 10 minutes"
          description: 'pg_desk_dashboard_stale has reported 1 for over 10 minutes -- the served snapshot has not been refreshed within its configured staleAfterSeconds bound. See pg_desk_dashboard_age_seconds for the actual age in seconds. This rule is suppressed while a pg-router SYSTEM_PAUSE gate is active (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1), because a pause deliberately stops the desk-heartbeat dispatch; if it fires, no SYSTEM_PAUSE gate was in force.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: pg_desk_dashboard_stale unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gte
                    params: [1]

      # Failure rate: pg_desk_sync_errors_total, by repo. NOTE (as of this
      # writing, per pg-desk-metrics.json's own panel description): this
      # counter is registered and exposed, but serve has no live call site
      # wired for it yet -- serve never itself runs sync, so there is
      # nowhere in its own request path to observe a sync failure the
      # moment it happens (see packages/pg-desk/internal/metrics's
      # MetricSyncErrors doc comment). This rule is therefore
      # forward-looking/best-effort: it cannot fire today (the series stays
      # permanently absent, which noDataState: OK correctly treats as
      # healthy, not broken) until a future task wires the cross-process
      # call site. Included now so the alert exists the moment that call
      # site lands, rather than being a second, separately-remembered
      # follow-up.
      - uid: pg-desk-sync-errors
        title: pg-desk sync failure rate is non-zero (by repo)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-desk sync error rate for repo {{ $labels.repo }} has been non-zero"
          description: "sum by (repo) (rate(pg_desk_sync_errors_total[10m])) has stayed above 0 for over 10 minutes for repo {{ $labels.repo }}. NOTE: pg_desk_sync_errors_total has no live call site wired as of pg2-02n5o -- this rule cannot fire until a future task wires it (see pg-desk-metrics.json's 'Sync errors / sec' panel description)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum by (repo) (rate(pg_desk_sync_errors_total[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # pg2-kftf9.5: leaked-anchor signals. pg_desk_sync_error_rows and
      # pg_desk_oldest_sync_error_age_seconds are derived from the shared
      # store at scrape time (internal/httpapi/metrics_handler.go), so they
      # DO see failures recorded by the separate `pg-desk run` process --
      # unlike pg_desk_sync_errors_total above, which has no live call site.

      # pg2-qki4v: the sync_error rows are split by automatic-retry state
      # (pg2-xb6fs; internal/metrics/metrics.go's
      # MetricSyncErrorRetryingRows / MetricSyncErrorExhaustedRows) so only a
      # row needing a person pages critical:
      #   - exhausted (retry bound reached, or a non-transient failure that
      #     was never retried): stays non-zero until an operator reconcile
      #     -> critical.
      #   - retrying (transient, still inside the retry bound): a pg-router /
      #     pg-desk restart killing an in-flight dispatch records one of
      #     these and it self-heals within ~30m with no operator action
      #     -> warning, and only once it outlives that typical window.
      # pg_desk_sync_error_rows (the sum of the two) is deliberately no
      # longer alerted on directly.

      - uid: pg-desk-sync-error-rows
        title: pg-desk has rows with a recorded sync_error and no automatic retry left
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pg-desk has {{ $values.B }} sync_error row(s) with no automatic retry left"
          description: "pg_desk_sync_error_exhausted_rows has been above 0 for over 5 minutes -- one or more PR anchors failed bead sync and will not be retried automatically (the retry bound was reached, or the failure is non-transient), so they may have leaked open merge-request or child beads. These need an operator: run `pg-desk doctor` (or `pg-desk status`) for the affected entities, then `pg-desk reconcile`."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: pg_desk_sync_error_exhausted_rows
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: pg-desk-sync-error-retrying
        title: pg-desk has sync_error rows still being retried automatically
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-desk has {{ $values.B }} sync_error row(s) still being retried for over 30 minutes"
          description: "pg_desk_sync_error_retrying_rows has been above 0 for over 30 minutes -- one or more PR anchors have a transient sync_error and are within the automatic retry bound (1m backoff doubling to 30m, 10 retries), but have not healed within the usual window. No action is needed yet; if they exhaust, pg-desk-sync-error-rows pages critical."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: pg_desk_sync_error_retrying_rows
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # pg2-h7grf: same policy as the row-count rules above, applied to the
      # age rule. There is NO per-state age metric (the age is of the oldest
      # sync_error row whatever its retry state, measured from the row's
      # as_of -- internal/httpapi/metrics_handler.go's syncErrorStats), so a
      # row that is healthily retrying also ages, and the old 3600s threshold
      # paged critical on it: the 2026-10-01 burst (rows aged to ~4215s, then
      # healed, all rows retrying, none exhausted) is the evidence. The rule
      # stays critical but its threshold now sits ABOVE the retry horizon, so
      # it fires only for a row that outlived every automatic retry; a row
      # that exhausts is already paged by pg-desk-sync-error-rows.
      #
      # Threshold 21600s (6h), derived from the pg-desk defaults
      # (internal/config DefaultSyncRetry*; sync.RetryPolicy.Backoff):
      #   - backoff alone: the 10 automatic retries wait 1m, 2m, 4m, 8m, 16m,
      #     then 30m x5 = 181m = 10860s before the row is exhausted;
      #   - but retries run only when `pg-desk reconcile` does (ZR's
      #     desk-reconcile role, every 30m), so once the backoff is <= 30m each
      #     retry costs one whole 30m tick: <= 10 x 30m = 300m = 18000s;
      #   - plus a 1h margin for a slow/budget-limited reconcile pass and the
      #     5m `for` => 21600s.
      # The test (sync_error_rules_test.go) derives the backoff sum and the
      # tick-bound horizon from the Go constants and fails if the threshold
      # drops to or below either, so retuning sync.retry must retune this.
      - uid: pg-desk-unreconciled-anchor-age
        title: pg-desk oldest sync_error is older than 6 hours (past every automatic retry)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pg-desk has had an unreconciled sync_error anchor for over 6 hours"
          description: "pg_desk_oldest_sync_error_age_seconds has exceeded 21600 (6h) for over 5 minutes -- longer than every automatic retry can take (10 retries, 1m backoff doubling to 30m, run on the 30m reconcile cadence, about 5h at most), so an anchor with a recorded sync_error was not reconciled by any retry. It has exhausted its retries or needs a person: run `pg-desk doctor` (or `pg-desk status`), then `pg-desk reconcile --retry-all`. A row still retrying younger than this is expected and does not page here."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: pg_desk_oldest_sync_error_age_seconds
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [21600]

      # Sweep sizing bound (docket pg2-x3h8c, ADR 0077 S30/S31): a cap on the
      # per-poll sweep is allowed ONLY while its bound
      #   active_count / sweep.max_per_poll x poll_interval <= age
      # is checked AND alerting, so a violated bound pages, not just a
      # `pg-desk doctor` line. pg_desk_sweep_bound_violated{type,tier} reads 1
      # for a (type, tier) whose bound is violated and 0 when it holds, per
      # capped age tier (tier=remote: re-hydration against sweep.max_age;
      # tier=local: reconcile against sweep.reconcile_age). It is computed at
      # scrape time by changes.EvaluateSweepBound -- the SAME evaluation
      # `pg-desk doctor` prints -- so the alert and the doctor line agree.
      #
      # pg-desk does not own the poll interval; `pg-desk serve --router-config
      # <path>` (or env PG_DESK_ROUTER_CONFIG) supplies it from the router
      # config. While it is not supplied (or the type has no matching router
      # query) the metric has NO series for that type: no verdict, never a
      # false violation. noDataState: OK treats that absence as Normal.
      #
      # Scoped to issue and thread (PR lane refactor, P8a): the PR inputs of this
      # bound vanish after P3b2 (the pr-change role replaces the PR sweep), so a
      # pr series would read a bound that governs nothing. Scoping only: the alert
      # itself stays.
      #
      # `max by (type, tier)` collapses the duplicate job=pg-desk / job=pg-desk-legacy
      # series so each (type, tier) is ONE alert instance. `for: 15m` rides
      # out a transient count spike (the bound is a steady-state sizing
      # property, not a point-in-time fault); warning, because a violated
      # bound degrades freshness gradually rather than breaking serving.
      - uid: pg-desk-sweep-bound-violated
        title: pg-desk sweep sizing bound is violated (by type and tier)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-desk sweep bound violated for type {{ $labels.type }}, tier {{ $labels.tier }}"
          description: "pg_desk_sweep_bound_violated has read 1 for type {{ $labels.type }}, tier {{ $labels.tier }} for over 15 minutes -- active_count / sweep.max_per_poll x poll_interval exceeds the tier's age (tier=remote: sweep.max_age; tier=local: sweep.reconcile_age), so the sweep falls behind and some active entities go longer than that age between refreshes. Run `pg-desk doctor --router-config <path>` for the inputs, then raise sweep.max_per_poll, lengthen the age, or shorten the poll interval."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max by (type, tier) (pg_desk_sweep_bound_violated{type=~"issue|thread"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gte
                    params: [1]

      # ---- Daily-focus alert rules (Phase 15, pg2-2j5ac.44.25) ----
      # Each rule reads a family of internal/metrics/focus.go (or the
      # change-flow families) that is computed at scrape time from the
      # store by focus.ComputeHealth -- the one function the doctor/status
      # focus block reads too. Shape is pg-desk-sweep-bound-violated's: A is
      # an instant query, B reduces it with `last`, C is a `gt` threshold.
      # All eight are severity warning with noDataState: OK: a store with no
      # draft, no plan, no watch query or no focus tables exposes no series
      # (or zero-filled series), which is a legitimately quiet state and
      # MUST NOT page. The expressions, label selectors and `for:` values are
      # pinned by internal/alertrules/focus_rules_test.go and named in
      # docs/behavior/pg-desk/serve.md. Decider failures reach
      # pg_router_failures_total{role="<focus role>"}, which the existing
      # pg-router-failure-rate rule already covers: no rule here.
      #
      # The wired-and-evaluating-but-doing-nothing shape: pending-beads-age
      # is the alert that catches a decider role that is unbound or still in
      # plan mode -- plan rows exist, nothing mints their beads. While the PR
      # lane is not in apply mode that is the expected state, not a fault (the
      # lane runs in plan until the first apply), so the rule is suppressed
      # unless pg_desk_pr_lane_mode reads 1 on apply (`and on()` drops the whole
      # result otherwise, and an absent gauge, a store below schema 2, drops it
      # too).
      - uid: pg-desk-focus-pending-beads-age
        title: pg-desk focus rows have waited too long for their bead
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A selected focus row has had no bead for over 30 minutes"
          description: "The PR lane is in apply mode, and the oldest focus row that is selected, live and has no bead (reason=unminted) has waited over 1800 seconds for 10 minutes. The decider role that mints focus beads is unbound, still in plan mode, or failing. Run `pg-desk doctor` for the focus block, then check the router's focus role binding and mode."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max(pg_desk_focus_oldest_pending_bead_age_seconds{reason="unminted"}) and on() (pg_desk_pr_lane_mode{mode="apply"} == 1)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1800]

      - uid: pg-desk-focus-divergence-selected-held
        title: pg-desk focus - a selected item's bead is held
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A selected focus row's bead is held"
          description: "At least one item in the current plan has a held focus bead (deferred, marker struck or unassigned) although its source is not terminal, for over 30 minutes. The plan and the bead disagree: re-select the item or release the bead. Run `pg-desk focus show` and `pg-desk doctor`."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max(pg_desk_focus_divergence{kind="selected_bead_held"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: pg-desk-focus-divergence-rm-claimable
        title: pg-desk focus - a removed item's bead is still claimable
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A removed focus item still has an open, unclaimed bead"
          description: "At least one item removed from the plan (annotation none or absent) still has an open, unclaimed focus bead for over an hour, so a worker can claim work the operator dropped. The decider's hold did not run: check the focus role binding and mode. Run `pg-desk doctor`."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max(pg_desk_focus_divergence{kind="removed_bead_open_unclaimed"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: pg-desk-focus-annotation-divergence
        title: pg-desk focus - plan rows and focus_selected annotations disagree
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Focus plan rows and focus_selected annotations disagree"
          description: "A plan row has no matching focus_selected annotation (row_without_annotation) or an annotation names a period with no row (annotation_without_row) for over 15 minutes, so a select was interrupted between its row and its annotation write. Re-run `pg-desk focus select` for the period to repair it."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum(pg_desk_focus_divergence{kind=~"row_without_annotation|annotation_without_row"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: pg-desk-focus-terminal-source-bead-open
        title: pg-desk focus - a finished item's bead is still open
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A finished focus item's bead is still open"
          description: "At least one plan row whose source is terminal (merged or closed PR, done issue) still has an open, unclaimed focus bead for over an hour. The issue-closed listener is missing or its decider role is still in plan mode. Check the router's closed-listener binding and the role's mode."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max(pg_desk_focus_divergence{kind="terminal_source_bead_open"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Scoped to issue and thread (PR lane refactor, P8a): the PR half of this
      # alert reads inputs that vanish after P3b2, so a pr status would read a
      # listing that governs nothing. Scoping only: the alert itself stays.
      - uid: pg-desk-watch-listing-degraded
        title: pg-desk watch query listing is degraded or failed
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A watch query's last listing was not complete"
          description: "At least one configured watch query has a persisted listing status of degraded or failed for over 30 minutes, so the watch sets (and the focus candidate set built on them) may be incomplete. Run `pg-desk focus show` for the coverage header and check the connector that serves the query."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum(pg_desk_watch_listing_status{type=~"issue|thread",status!="ok"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: pg-desk-focus-rank-degraded
        title: pg-desk focus rank is running on degraded inputs
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "The focus rank is silently degraded"
          description: "At least one rank input has been degraded for over 30 minutes (unparseable due dates, unmapped priorities, age fallbacks, unavailable unblocks or an absent status category), so the ranking is less reliable than it looks. The input label of pg_desk_focus_rank_degraded_inputs names which; run `pg-desk focus explain` on an affected item."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum(pg_desk_focus_rank_degraded_inputs)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: pg-desk-focus-consumer-lag
        title: pg-desk focus issue consumer is lagging
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "The focus role's issue.changed consumer is over 500 changes behind"
          description: "The lag of an issue change-log consumer (highest issue change sequence minus the consumer cursor) has exceeded 500 for over 30 minutes, so the focus decider is not keeping up with issue changes. The 500 threshold is provisional: the operator checkpoint sets the final budget from the measured decider cost."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max(pg_desk_consumer_lag{type="issue"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [500]

      # PR never hydrated (PR lane refactor: the P0b tripwire, finalized by P8a-1 with
      # its promtool rule test, grafana/alerting/rule-tests/, whose four states are
      # the gauge live and absent, live and 0, pg-desk liveness down and SYSTEM_PAUSE
      # set, and whose replay of 2026-10-19 fires it). The final threshold is the
      # one the P0b rule shipped with: above 0 for 30 minutes, because a PR that is
      # listed and unhydrated for half an hour is one that nothing is hydrating.
      # pg_desk_pr_unhydrated is the
      # number of PRs the store lists as open that no hydration has ever written
      # (open, not hidden, not marked inactive, version 0), computed from the
      # store at scrape time; pg_desk_pr_unhydrated_oldest_age_seconds is the
      # age of the oldest. It is the signal that would have fired on 2026-10-19,
      # when every one of 495 rows was unhydrated and nothing said so.
      #
      # The rule fires in two cases, both in the one expression:
      #   1. the gauge is above 0 for the `for` duration (the PRs are listed
      #      and nothing hydrates them); or
      #   2. the gauge has no series at all while pg_desk_liveness is up: the
      #      store cannot answer (not migrated, or the read failed), which is
      #      never "healthy". The absence test lives in the expression, not in
      #      noDataState: `pg_desk_liveness == 1 unless on() pg_desk_pr_unhydrated`
      #      yields the liveness series only when no unhydrated series exists.
      # Both are dropped by the SYSTEM_PAUSE guard copied from
      # pg-desk-sync-stale (`unless on() (pg_router_gates_active{type=
      # "SYSTEM_PAUSE"} == 1)`, whose reasoning is documented there): a pause
      # deliberately stops the hydrating dispatches. With pg-desk itself down
      # both branches are empty and pg-desk-liveness-down is the alert that
      # speaks, so noDataState is OK: an empty result here means "nothing to
      # report", never "healthy".
      #
      # Not registered with the probe in this change: from the first apply of
      # P0b until the backfill the rule is red for a known reason (the 495
      # unhydrated PRs), and registration is deferred to the start of P6 so a
      # rule that is red for a known reason files no bead.
      - uid: pg-desk-pr-never-hydrated
        title: pg-desk has PRs that were never hydrated
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-desk lists PRs that no hydration has ever written, or cannot count them"
          description: 'pg_desk_pr_unhydrated (open, not hidden, not inactive, version 0) has been above 0 for over 30 minutes, or has no series while pg-desk is up (the store cannot answer: not migrated to schema 2, or the read failed). The PR lane is not running or not hydrating: see the pr lane line of pg-desk status and doctor, and pg_desk_pr_unhydrated_oldest_age_seconds for how long the oldest has waited. This rule is suppressed while a pg-router SYSTEM_PAUSE gate is active (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1).'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '((pg_desk_pr_unhydrated > 0) or (pg_desk_liveness == 1 unless on() pg_desk_pr_unhydrated)) unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # ---- PR lane outcome alerts (PR lane refactor, P8a-1) ----
      # The alerts below read OUTCOMES, never "the process ran" (the outage of
      # 2026-10-19 read sync_errors 0 for its whole duration). Each reads a gauge
      # or counter that `pg-desk serve` derives at scrape time from the store (the
      # open-anchor families, internal/metrics/prlane_anchors.go) or from the lane
      # state the composed command persists (internal/metrics/prlane_state.go), and
      # every one is exercised by promtool through grafana/check-alert-rules.sh with
      # a firing, a healthy and an empty-input case (grafana/alerting/rule-tests/).
      #
      # Every rule ends with the SYSTEM_PAUSE guard of pg-desk-sync-stale (its
      # reasoning is documented there): a pause deliberately stops the dispatches
      # these rules watch. The residual rule reads the mode="apply" series of its
      # gauge, and the two stale-anchor rules are gated on the configured lane mode
      # being apply (`and on() (pg_desk_pr_lane_mode{mode="apply"} == 1)`, as
      # pg-desk-focus-pending-beads-age is): in plan mode a residual is non-zero by
      # definition and no anchor is closed, so the same readings are expected
      # there. An absent mode gauge drops the result too (fail closed toward quiet),
      # and pg-desk-pr-never-hydrated speaks for a store that cannot answer.
      #
      # None of these uids is registered with the probe in this change: the
      # deferred-registration allowlist holds them until the start of P6.

      # Plan residual after apply. The composed command runs a read-only plan after
      # apply and persists the PR's residual; the gauge is the age of the oldest
      # non-empty residual, labelled with the lane mode. It covers a missing child
      # item (review, fix-ci, conflict) as well as a missing anchor. It reads
      # mode="apply" ONLY, because in plan mode the residual is non-zero by
      # definition (nothing is applied). 3600 s: a healthy apply leaves no residual
      # at all, so an hour with one means the lane keeps planning an action it
      # cannot apply.
      - uid: pg-desk-pr-residual-after-apply
        title: pg-desk PR lane leaves a plan residual after apply
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A PR has had actions left in its plan after apply for over an hour"
          description: 'pg_desk_pr_lane_residual_oldest_age_seconds{mode="apply"} has exceeded 3600 for 15 minutes: at least one PR still has an action in its plan after the lane applied it (a missing anchor or a missing review, fix-ci or conflict item). Run the composed command in plan mode for the PR (the run record names it), then `pg-desk pr show` and `pg-desk pr history`. This rule reads mode=apply only and is suppressed while a pg-router SYSTEM_PAUSE gate is active.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(pg_desk_pr_lane_residual_oldest_age_seconds{mode="apply"}) unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3600]

      # Stale anchor, part 1: an anchor is still open although the store shows its PR
      # merged or closed. The age runs from the PR row's last hydration (the moment
      # the store learned it was closed) and 3600 s is longer than the apply pass
      # (one dispatch plus the router's 10 minute retry window), so a healthy
      # closure never reaches it. Both parts read the store's links and PR rows,
      # not the tracker and not the daemon; hidden PRs are excluded from the gauge
      # (pg_desk_pr_open_anchors_hidden counts them apart). Gated on the lane mode
      # being apply, because plan mode closes nothing.
      - uid: pg-desk-pr-stale-anchor
        title: pg-desk has open anchors on merged or closed PRs
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "An anchor has stayed open for over an hour on a PR the store shows as merged or closed"
          description: "pg_desk_pr_stale_anchor_oldest_age_seconds has exceeded 3600 for 10 minutes while the lane is in apply mode: at least one open anchor belongs to a PR that the store shows merged or closed, so the lane did not close it. Run `pg-desk pr show <id>` for the PR and the composed command in plan mode to see what the decider would do; pg_desk_pr_stale_anchors is the count. Suppressed while a pg-router SYSTEM_PAUSE gate is active."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(pg_desk_pr_stale_anchor_oldest_age_seconds) and on() (pg_desk_pr_lane_mode{mode="apply"} == 1) unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3600]

      # Stale anchor, part 2: a lost or failed `merged` hydration leaves the store
      # saying "open", which part 1 cannot see. The signal is the oldest last
      # hydration among PRs that have an open anchor and that the store shows as
      # open. A quiet PR is hydrated only when it changes, so the threshold is long:
      # 604800 s (7 days) is PROVISIONAL and is set from the measured hydration
      # cadence at the operator checkpoint of the plan period (the same treatment as
      # pg-desk-focus-consumer-lag's threshold).
      - uid: pg-desk-pr-anchor-hydration-old
        title: pg-desk has open anchors on PRs not hydrated for a week
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A PR with an open anchor has not been hydrated for over 7 days"
          description: "pg_desk_pr_open_anchor_oldest_hydration_age_seconds has exceeded 604800 for 30 minutes while the lane is in apply mode: a PR that has an open anchor, and that the store still shows as open, was last hydrated over 7 days ago. A lost or failed hydration of its merged or closed state leaves the store saying open. Run `pg-desk pr refresh <id>` for the oldest PRs. The 7 day threshold is provisional and is set from the measured hydration cadence at the plan-period checkpoint. Suppressed while a pg-router SYSTEM_PAUSE gate is active."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(pg_desk_pr_open_anchor_oldest_hydration_age_seconds) and on() (pg_desk_pr_lane_mode{mode="apply"} == 1) unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [604800]

      # Decider and hydrate failures, hard classes. pg_desk_pr_lane_runs_total{stage,
      # class} is persisted by the composed command; every series is zero-filled, so
      # the first event is a step from 0 and increase() sees it. `unauthenticated`
      # (credentials of the connector are gone: nothing hydrates) and `decide_failed`
      # (the decider itself failed) fire on any increase with NO `for`. The second
      # branch covers a series that first appears already above 0 (a store that
      # started counting after the window began): it fires for the ten minutes
      # during which the series has no sample ten minutes earlier.
      - uid: pg-desk-pr-lane-hard-failure
        title: pg-desk PR lane run failed hard (unauthenticated or decide failed)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "The PR lane recorded an unauthenticated or decide_failed run in the last 10 minutes"
          description: 'pg_desk_pr_lane_runs_total{class="unauthenticated"} or {class="decide_failed"} (stage {{ $labels.stage }}, class {{ $labels.class }}) increased in the last 10 minutes. unauthenticated: the connector has no valid credentials, so nothing hydrates; decide_failed: the decider itself failed on a PR. Run the composed command by hand in plan mode for the PR named in the run record (pr-change-runs.jsonl). Suppressed while a pg-router SYSTEM_PAUSE gate is active.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '((sum by (stage, class) (increase(pg_desk_pr_lane_runs_total{class=~"unauthenticated|decide_failed"}[10m])) > 0) or (sum by (stage, class) (pg_desk_pr_lane_runs_total{class=~"unauthenticated|decide_failed"}) > 0 unless sum by (stage, class) (pg_desk_pr_lane_runs_total{class=~"unauthenticated|decide_failed"} offset 10m))) unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Decider and hydrate failures, the rest. Every other class (not_found,
      # transient, degraded, unhydrated, hydrate_error, decide_partial) alerts on a
      # sustained rate, not a single event: a transient run is written for EVERY
      # failed router attempt, so one is normal noise, while more than 5 in an hour
      # is the only signal that deliveries are failing every attempt (the router
      # exposes no "retries exhausted" series). pg-router-failure-rate already covers
      # the router side of the pr-change role, so no router failure series is read
      # here.
      - uid: pg-desk-pr-lane-failure-rate
        title: pg-desk PR lane runs keep failing (by stage and class)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "More than 5 PR lane runs failed in the last hour (stage {{ $labels.stage }}, class {{ $labels.class }})"
          description: 'sum by (stage, class) (increase(pg_desk_pr_lane_runs_total{class!~"unauthenticated|decide_failed"}[1h])) has exceeded 5 for 15 minutes for stage {{ $labels.stage }}, class {{ $labels.class }}. transient is the only signal that a delivery failed every router attempt; not_found, degraded, unhydrated, hydrate_error and decide_partial name what failed. Read pr-change-runs.jsonl for the PRs, then run the composed command by hand in plan mode. Suppressed while a pg-router SYSTEM_PAUSE gate is active.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum by (stage, class) (increase(pg_desk_pr_lane_runs_total{class!~"unauthenticated|decide_failed"}[1h])) unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      # Hydration failure and repeated degradation for type pr: the existing
      # persisted counters and gauge (internal/metrics/changeflow.go), read here for
      # the pr type so a lane whose refresh keeps failing or degrading is named even
      # when the composed command's own classes miss it.
      - uid: pg-desk-pr-hydration-failing
        title: pg-desk PR hydration keeps failing or degrading
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "PR hydrations are failing or repeatedly degraded"
          description: 'More than 5 PR hydrations failed or came back degraded in the last 30 minutes (pg_desk_hydration_failures_total{type="pr"}), or pg_desk_repeated_degraded_entities{type="pr"} is above 0, for 15 minutes. Run `pg-desk pr refresh <id>` for a PR in the run record and read its class line. Suppressed while a pg-router SYSTEM_PAUSE gate is active.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '((sum(increase(pg_desk_hydration_failures_total{type="pr"}[30m])) > 5) or (max(pg_desk_repeated_degraded_entities{type="pr"}) > 0)) unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Hydrate stage dead-man: the pr-change role was dispatched (a router series,
      # pg_router_throughput_total{role="pr-change"}) in the last hour while the
      # persisted PR hydration counter did not move at all. A role that is accepted
      # but never reaches the hydrate stage (the composed command failing before
      # `pg-desk pr refresh`, a wrong binary, a lock held forever) would otherwise
      # look healthy to every other rule. Silent when the role was not dispatched:
      # an idle window is not a failure.
      - uid: pg-desk-pr-hydrate-dead-man
        title: pg-desk PR hydrate stage is dead (dispatches, no hydrations)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "The pr-change role was dispatched in the last hour but no PR was hydrated"
          description: 'pg_router_throughput_total{role="pr-change"} increased in the last hour while pg_desk_hydrations_total{type="pr"} did not: the role is dispatched but its hydrate stage never ran. Run the composed command by hand in plan mode for one PR, and check the role definition and the lock directory. Suppressed while a pg-router SYSTEM_PAUSE gate is active.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '(sum(increase(pg_router_throughput_total{role="pr-change"}[1h])) > 0) unless on() (sum(increase(pg_desk_hydrations_total{type="pr"}[1h])) > 0) unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # ---- PR lane remaining alerts (PR lane refactor, P8b-1) ----
      # Two more rules of the same shape as the outcome rules above: each ends with the
      # SYSTEM_PAUSE guard of pg-desk-sync-stale, noDataState is OK, and each has a
      # firing, a healthy and an empty-input case under grafana/alerting/rule-tests/.
      # The tracked-set and no-watched-PRs rules read the daemon's metrics and live in
      # the connector's alert file (pg-connector-github-alerts.yaml). None of these
      # uids is registered with the probe in this change (packet P8b-3 does that).

      # Hidden PR with an open anchor. A hidden PR (the `hide` annotation) is skipped by
      # every decider rule, closure included, so a hidden PR that merges keeps its anchor
      # open for as long as it stays hidden. pg_desk_pr_open_anchors_hidden counts those
      # PRs from the store at scrape time (it is emitted with a value, 0, when healthy,
      # and has no series on a store that cannot answer). Low severity: it is a prompt to
      # un-hide or close, not a failure of the lane.
      - uid: pg-desk-pr-hidden-open-anchor
        title: pg-desk has hidden PRs with an open anchor
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
        annotations:
          summary: "A hidden PR has an open anchor"
          description: "pg_desk_pr_open_anchors_hidden has been above 0 for 30 minutes: at least one PR carrying the hidden annotation still has an open anchor. The decider skips a hidden PR for every rule including closure, so the anchor stays open even after the PR merges. Run `pg-desk pr unhide <id>` for a PR the lane should handle again so it can close the anchor, or close the anchor by hand if the PR is meant to stay hidden. Low severity; suppressed while a pg-router SYSTEM_PAUSE gate is active."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(pg_desk_pr_open_anchors_hidden) unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Lookup ceiling approaching. The decider's bounded all-status work-item lookup
      # lists every work item including closed ones, and closed items only accumulate; a
      # listing above the configured ceiling fails the pr plan and apply runs closed. The
      # two gauges are the lane record's lookup_items and lookup_ceiling, exported by
      # pg-desk serve at scrape time (0 until a run reports them). This rule fires when the
      # item count passes 0.8 of the ceiling: the warning before the lane fails closed.
      # The ceiling-greater-than-0 guard is load-bearing: while the ceiling gauge reads 0
      # (no run has reported, or the lookup is not configured) a ratio would divide by
      # zero, so `max(ceiling) > 0` drops the denominator and the whole result is empty.
      # The remedy is the runbook's: raise the configured ceiling and apply, or compact
      # closed work items.
      - uid: pg-desk-pr-lookup-ceiling
        title: pg-desk PR lane work-item lookup is approaching its ceiling
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "The PR lane's work-item lookup holds over 80 percent of its ceiling"
          description: "pg_desk_pr_lane_lookup_items divided by pg_desk_pr_lane_lookup_ceiling has been above 0.8 for 30 minutes (the rule is quiet while the ceiling gauge reads 0). Closed work items only accumulate, so the listing grows until the lane fails closed on a listing above the ceiling. Raise the configured work-items ceiling (the decider setting work_items_ceiling) and apply, or compact closed work items. Suppressed while a pg-router SYSTEM_PAUSE gate is active."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(pg_desk_pr_lane_lookup_items) / (max(pg_desk_pr_lane_lookup_ceiling) > 0) unless on() (pg_router_gates_active{type="SYSTEM_PAUSE"} == 1)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
