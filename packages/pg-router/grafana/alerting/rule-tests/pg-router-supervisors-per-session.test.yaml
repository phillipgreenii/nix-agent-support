# promtool unit tests for the pg-router-supervisors-per-session alert: the gauge
# pg_router_supervisors_per_session above 1 fires at once (no `for:`); 1 does not. Run by
# the flake check test-pg-router-alert-rules, which generates rules.yml next to this file.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a session reported with two supervisors fires, labelled with role and session
    interval: 1m
    input_series:
      - series: pg_router_supervisors_per_session{role="worker",session="s-1",job="pg-router"}
        values: "2x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: pg-router-supervisors-per-session
        exp_alerts:
          - exp_labels:
              role: worker
              session: s-1
              severity: warning

  - name: a session with exactly one supervisor does not fire
    interval: 1m
    input_series:
      - series: pg_router_supervisors_per_session{role="worker",session="s-1",job="pg-router"}
        values: "1x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: pg-router-supervisors-per-session
        exp_alerts: []

  - name: only the session above one fires and it clears once a later dispatch reports one
    interval: 1m
    input_series:
      - series: pg_router_supervisors_per_session{role="worker",session="s-1",job="pg-router"}
        values: "3x10 1x30"
      - series: pg_router_supervisors_per_session{role="worker",session="s-2",job="pg-router"}
        values: "1x40"
    alert_rule_test:
      - eval_time: 5m
        alertname: pg-router-supervisors-per-session
        exp_alerts:
          - exp_labels:
              role: worker
              session: s-1
              severity: warning
      - eval_time: 25m
        alertname: pg-router-supervisors-per-session
        exp_alerts: []
