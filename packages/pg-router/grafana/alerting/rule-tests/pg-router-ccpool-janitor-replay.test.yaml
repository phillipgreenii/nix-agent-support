# Replay of recorded ccpool janitor data through the progress alerts. Run by the flake check
# test-pg-router-alert-rules (check-alert-rules.sh), which wraps each rule's refId A as an
# `alert:` rule.
#
# The series below are the janitor_run rows of the handler's events.jsonl (counters per pass and
# role, the per-pass oldest unexamined age and the worktree_sweep list phase in seconds),
# one gauge sample per run, placed on a 5 minute grid by run time (`_` = no run in that slot;
# a run that did not reach a role leaves no sample for it, as in production). Only pass/role
# pairs that ever had candidates are kept. Regenerate with jq over the handler's events.jsonl
# (`select(.kind == "janitor_run")`, fields counters[].{pass,role,candidates,examined,cached,
# list_ms,oldest_unexamined_age_seconds}).
#
# Expectations, from the measurement of 2026-11-13: the stall of 2026-11-11T23:36Z to
# 2026-11-12T03:25Z must fire the no-progress alert (for drain-zr, whose six runs without
# reaching anything are complete by 01:13Z) and the stagnant alert (age over 2 hours); the 24
# hours ending 2026-11-13T14:32Z must fire none of the three janitor progress alerts.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: replay of the 2026-11-11T22:30Z to 2026-11-12T05:00Z stall fires no-progress and stagnant
