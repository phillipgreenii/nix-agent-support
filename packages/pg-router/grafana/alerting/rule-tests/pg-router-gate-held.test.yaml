# promtool unit tests for the pg-router-gate-held alert (a resource below best AND a
# registration blocked on it, for 30 minutes). Run by the flake check
# test-pg-router-alert-rules, which generates rules.yml next to this file: the Grafana
# rule's refId A wrapped as `alert: <uid>` with `expr: (<A>) > 0`, the rule's `for: 30m` and
# labels, plus a recording rule `wrapped:<uid with _>`.
#
# Time model: pg_router_resource_level{resource} is a gauge (0 is best) and
# pg_router_requirement_blocked_total{role,resource,kind} a counter that rises at every
# evaluation of a blocked role; every series here has a 1m interval. A steady hold is
# pending from its first sample and firing once held for 30m: not firing at 29m, firing at
# 32m. A resource that has no level sample (never answered) is modelled as missing samples (`_`).
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a resource below best with a blocked role fires after 30m, not before, labelled with its resource
    interval: 1m
    input_series:
      - series: pg_router_resource_level{resource="disk",job="pg-router"}
        values: "2x240"
      - series: pg_router_requirement_blocked_total{role="worker",resource="disk",kind="level",job="pg-router"}
        values: "0+1x240"
    alert_rule_test:
      - eval_time: 29m
        alertname: pg-router-gate-held
        exp_alerts: []
      - eval_time: 32m
        alertname: pg-router-gate-held
        exp_alerts:
          - exp_labels:
              resource: disk
              severity: warning

  - name: a resource below best that no registration is blocked on does not fire
    interval: 1m
    input_series:
      - series: pg_router_resource_level{resource="disk",job="pg-router"}
        values: "2x240"
    alert_rule_test:
      - eval_time: 90m
        alertname: pg-router-gate-held
        exp_alerts: []

  - name: a blocked role on a resource at its best level does not fire
    interval: 1m
    input_series:
      - series: pg_router_resource_level{resource="disk",job="pg-router"}
        values: "0x240"
      - series: pg_router_requirement_blocked_total{role="worker",resource="disk",kind="level",job="pg-router"}
        values: "0+1x240"
    alert_rule_test:
      - eval_time: 90m
        alertname: pg-router-gate-held
        exp_alerts: []

  - name: only the long-held resource fires, a brief neighbour does not
    interval: 1m
    input_series:
      - series: pg_router_resource_level{resource="disk",job="pg-router"}
        values: "2x240"
      - series: pg_router_requirement_blocked_total{role="worker",resource="disk",kind="level",job="pg-router"}
        values: "0+1x240"
      # cpu below best for 10m, then back to best.
      - series: pg_router_resource_level{resource="cpu",job="pg-router"}
        values: "1x10 0x230"
      - series: pg_router_requirement_blocked_total{role="review",resource="cpu",kind="level",job="pg-router"}
        values: "0+1x10 10x230"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-router-gate-held
        exp_alerts:
          - exp_labels:
              resource: disk
              severity: warning

  - name: a hold cleared before 30m never fires
    interval: 1m
    input_series:
      - series: pg_router_resource_level{resource="disk",job="pg-router"}
        values: "2x25 0x215"
      - series: pg_router_requirement_blocked_total{role="worker",resource="disk",kind="level",job="pg-router"}
        values: "0+1x25 25x215"
    alert_rule_test:
      - eval_time: 29m
        alertname: pg-router-gate-held
        exp_alerts: []
      - eval_time: 90m
        alertname: pg-router-gate-held
        exp_alerts: []

  - name: a fired alert resolves once the resource recovers
    interval: 1m
    input_series:
      # Held 60m, then at best.
      - series: pg_router_resource_level{resource="disk",job="pg-router"}
        values: "2x60 0x180"
      - series: pg_router_requirement_blocked_total{role="worker",resource="disk",kind="level",job="pg-router"}
        values: "0+1x60 60x180"
    alert_rule_test:
      - eval_time: 55m
        alertname: pg-router-gate-held
        exp_alerts:
          - exp_labels:
              resource: disk
              severity: warning
      - eval_time: 75m
        alertname: pg-router-gate-held
        exp_alerts: []

  - name: a 6-minute gap (daemon restart) does not reset the pending timer
    interval: 1m
    input_series:
      - series: pg_router_resource_level{resource="disk",job="pg-router"}
        values: "2x20 _x6 2x214"
      - series: pg_router_requirement_blocked_total{role="worker",resource="disk",kind="level",job="pg-router"}
        values: "0+1x20 _x6 20+1x214"
    alert_rule_test:
      - eval_time: 32m
        alertname: pg-router-gate-held
        exp_alerts:
          - exp_labels:
              resource: disk
              severity: warning
