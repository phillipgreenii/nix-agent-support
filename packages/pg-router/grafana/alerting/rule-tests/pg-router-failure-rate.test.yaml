# promtool unit tests for the pg-router-failure-rate alert's reason exclusion (docket
# pg2-12gr4.8, design section 5): launch-failed joins at-capacity, budget-exceeded and the
# other causes handled elsewhere. Run by the flake check test-pg-router-alert-rules, which
# generates rules.yml next to this file: the Grafana rule's refId A wrapped as
# `alert: <uid>` with `expr: (<A>) > 0`, the rule's `for: 10m` and labels (severity: warning),
# plus a recording rule `wrapped:<uid with _>`.
#
# Time model: 1m series, a counter that rises by one per scrape. rate(...[10m]) is above 0 from
# the second scrape, so a counted failure is Pending from about 1m and Firing from about 11m:
# not firing at 8m, firing at 20m.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a rising launch-failed decline does not fire, it is excluded
    interval: 1m
    input_series:
      - series: pg_router_failures_total{class="declined",reason="launch-failed",role="worker",job="pg-router"}
        values: "0+1x120"
    promql_expr_test:
      - expr: count(wrapped:pg_router_failure_rate)
        eval_time: 60m
        exp_samples: []
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-router-failure-rate
        exp_alerts: []
      - eval_time: 60m
        alertname: pg-router-failure-rate
        exp_alerts: []

  - name: a rising decline with another reason still fires, so the exclusion is only launch-failed
    interval: 1m
    input_series:
      - series: pg_router_failures_total{class="declined",reason="capacity-unknown",role="worker",job="pg-router"}
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 8m
        alertname: pg-router-failure-rate
        exp_alerts: []
      - eval_time: 20m
        alertname: pg-router-failure-rate
        exp_alerts:
          - exp_labels:
              class: declined
              role: worker
              severity: warning

  - name: launch-failed does not mask a real failure of the same role
    interval: 1m
    input_series:
      - series: pg_router_failures_total{class="declined",reason="launch-failed",role="worker",job="pg-router"}
        values: "0+1x120"
      # A handler error with no reason label.
      - series: pg_router_failures_total{class="handler-error",role="worker",job="pg-router"}
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-router-failure-rate
        exp_alerts:
          - exp_labels:
              class: handler-error
              role: worker
              severity: warning

  - name: a name that only starts with launch-failed is not excluded
    interval: 1m
    input_series:
      # The matcher is anchored: launch-failed-extra is a different reason and keeps paging.
      - series: pg_router_failures_total{class="declined",reason="launch-failed-extra",role="worker",job="pg-router"}
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-router-failure-rate
        exp_alerts:
          - exp_labels:
              class: declined
              role: worker
              severity: warning

  # pg2-8o8x9d (pg2-hk1sn option c): a handler error the router classifies as class
  # unavailable carries reason=upstream-unavailable. The router re-runs such a failure and
  # most recover, so a rising series does not fire; a sustained failure pages through the PR
  # lane rule instead.
  - name: a rising upstream-unavailable handler error does not fire, it is excluded
    interval: 1m
    input_series:
      - series: pg_router_failures_total{class="handler-error",reason="upstream-unavailable",role="pr-change",job="pg-router"}
        values: "0+1x120"
    promql_expr_test:
      - expr: count(wrapped:pg_router_failure_rate)
        eval_time: 60m
        exp_samples: []
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-router-failure-rate
        exp_alerts: []
      - eval_time: 60m
        alertname: pg-router-failure-rate
        exp_alerts: []

  - name: upstream-unavailable does not mask a plain handler error of the same role
    interval: 1m
    input_series:
      - series: pg_router_failures_total{class="handler-error",reason="upstream-unavailable",role="pr-change",job="pg-router"}
        values: "0+1x120"
      # A handler error that is not class unavailable keeps no reason label.
      - series: pg_router_failures_total{class="handler-error",role="pr-change",job="pg-router"}
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 8m
        alertname: pg-router-failure-rate
        exp_alerts: []
      - eval_time: 20m
        alertname: pg-router-failure-rate
        exp_alerts:
          - exp_labels:
              class: handler-error
              role: pr-change
              severity: warning

  - name: other unavailable reasons are not excluded, the matcher is anchored
    interval: 1m
    input_series:
      # connector-unavailable is a busy decline the handler emits; a sustained outage pages.
      - series: pg_router_failures_total{class="declined",reason="connector-unavailable",role="pr-change",job="pg-router"}
        values: "0+1x120"
      # A prefix-extended name is a different reason.
      - series: pg_router_failures_total{class="handler-error",reason="upstream-unavailable-extra",role="worker",job="pg-router"}
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-router-failure-rate
        exp_alerts:
          - exp_labels:
              class: declined
              role: pr-change
              severity: warning
          - exp_labels:
              class: handler-error
              role: worker
              severity: warning

  # pg2-f1d4mk (completes pg2-8o8x9d): when the router re-runs a failed attempt it hands the
  # event back as class=declined reason=dispatch-retry (DEC-RETRY-2). The failed attempt is
  # already excluded as upstream-unavailable, so the hand-back is excluded with it: a
  # retried-and-recovered failure (2026-10-28: 5 pr-change failures, 5 of each series) stays
  # quiet.
  - name: a rising dispatch-retry decline does not fire, it is excluded
    interval: 1m
    input_series:
      - series: pg_router_failures_total{class="declined",reason="dispatch-retry",role="pr-change",job="pg-router"}
        values: "0+1x120"
    promql_expr_test:
      - expr: count(wrapped:pg_router_failure_rate)
        eval_time: 60m
        exp_samples: []
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-router-failure-rate
        exp_alerts: []
      - eval_time: 60m
        alertname: pg-router-failure-rate
        exp_alerts: []

  - name: a retried-and-recovered failure pair does not fire
    interval: 1m
    input_series:
      # The failed attempt and its re-run hand-back, as observed on 2026-10-28.
      - series: pg_router_failures_total{class="handler-error",reason="upstream-unavailable",role="pr-change",job="pg-router"}
        values: "0+1x120"
      - series: pg_router_failures_total{class="declined",reason="dispatch-retry",role="pr-change",job="pg-router"}
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-router-failure-rate
        exp_alerts: []
      - eval_time: 60m
        alertname: pg-router-failure-rate
        exp_alerts: []

  - name: dispatch-retry does not mask another declined reason of the same role
    interval: 1m
    input_series:
      - series: pg_router_failures_total{class="declined",reason="dispatch-retry",role="pr-change",job="pg-router"}
        values: "0+1x120"
      # A busy decline is a different reason and keeps paging.
      - series: pg_router_failures_total{class="declined",reason="command-busy",role="pr-change",job="pg-router"}
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 8m
        alertname: pg-router-failure-rate
        exp_alerts: []
      - eval_time: 20m
        alertname: pg-router-failure-rate
        exp_alerts:
          - exp_labels:
              class: declined
              role: pr-change
              severity: warning

  - name: a name that only extends dispatch-retry is not excluded
    interval: 1m
    input_series:
      # The matcher is anchored: dispatch-retry-extra is a different reason and keeps paging.
      - series: pg_router_failures_total{class="declined",reason="dispatch-retry-extra",role="worker",job="pg-router"}
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-router-failure-rate
        exp_alerts:
          - exp_labels:
              class: declined
              role: worker
              severity: warning
