# promtool unit tests for the pg-router-sensor-stale alert. Run by the flake check test-pg-router-alert-rules,
# which generates rules.yml next to this file: the Grafana rule's refId A wrapped as
# `alert: <uid>` with `expr: (<A>) > 0`, the rule's `for` and labels, plus a recording rule
# `wrapped:<uid with _>` over the same expression, and `raw:<uid with _>` over the bare
# refId A expression (what Grafana reads before the threshold: a 0 sample is a value, an empty
# result is NoData). Every series has a 1m interval.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: a stale sensor with the host awake fires after for 5m, labelled with its sensor
    interval: 1m
    input_series:
      - series: pg_router_sensor_last_observed_age_seconds{sensor="host-sensor",job="pg-router"}
        values: "700x60"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x60"
      - series: host_power_last_sleep_timestamp_seconds
        values: "100x60"
    alert_rule_test:
      - eval_time: 4m
        alertname: pg-router-sensor-stale
        exp_alerts: []
      - eval_time: 10m
        alertname: pg-router-sensor-stale
        exp_alerts:
          - exp_labels:
              sensor: host-sensor
              severity: warning

  - name: a fresh sensor does not fire
    interval: 1m
    input_series:
      - series: pg_router_sensor_last_observed_age_seconds{sensor="host-sensor",job="pg-router"}
        values: "30x60"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x60"
      - series: host_power_last_sleep_timestamp_seconds
        values: "100x60"
    promql_expr_test:
      # Awake and fresh returns a 0 sample for the sensor (a value, so Normal), not an empty
      # result (NoData, which noDataState Alerting would fire).
      - expr: raw:pg_router_sensor_stale
        eval_time: 30m
        exp_samples:
          - labels: 'raw:pg_router_sensor_stale{sensor="host-sensor"}'
            value: 0
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-router-sensor-stale
        exp_alerts: []

  - name: a sleeping host does not page, and the expression still returns a sample (not no data)
    interval: 1m
    input_series:
      # The sensor series carries on aging while the host sleeps (the last sleep is newer than the last wake).
      - series: pg_router_sensor_last_observed_age_seconds{sensor="host-sensor",job="pg-router"}
        values: "7000x60"
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "100x60"
      - series: host_power_last_sleep_timestamp_seconds
        values: "200x60"
    promql_expr_test:
      # The asleep branch is a single 0 sample: a value (OK), where an empty result would be NoData -> Alerting.
      - expr: raw:pg_router_sensor_stale
        eval_time: 30m
        exp_samples:
          - labels: "raw:pg_router_sensor_stale"
            value: 0
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-router-sensor-stale
        exp_alerts: []

  - name: a host awake with no sensor series at all returns an empty result (NoData, which alerts)
    interval: 1m
    input_series:
      - series: host_power_last_wake_timestamp_seconds{kind="full"}
        values: "200x60"
      - series: host_power_last_sleep_timestamp_seconds
        values: "100x60"
    promql_expr_test:
      - expr: raw:pg_router_sensor_stale
        eval_time: 30m
        exp_samples: []
