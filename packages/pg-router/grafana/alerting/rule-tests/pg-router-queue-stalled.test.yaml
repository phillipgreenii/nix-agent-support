# promtool unit tests for the pg-router-queue-stalled alert (operator ruling 2026-10-12: "fire if
# queue > 0 and nothing is being processed"). Run by the flake check test-pg-router-alert-rules,
# which generates rules.yml next to this file: the Grafana rule's refId A wrapped as
# `alert: <uid>` with `expr: (<A>) > 0`, the rule's `for: 5m` and labels, plus a recording rule
# `wrapped:<uid with _>` over the same expression.
#
# What this proves that the Go replay (internal/alertrules/queue_stalled_test.go) cannot: the
# PromQL itself, i.e. the type-to-role label_replace join, the in-flight comparison, the
# presence guard, the gate exclusion and the label set of the alert, evaluated by the real
# engine. The Go tests model the same expression and replay a recorded lane through it.
#
# Time model: the router is scraped every 30s, so every series has a 30s interval; rules
# evaluate every minute. The window is 10m and needs 18 scrapes, so a backlog that has been
# idle since the start of the series first satisfies the condition at 9m (18 scrapes), the
# alert is Pending from there and fires after `for: 5m`, at 14m: not firing at 12m, firing at
# 20m. pg_router_listener_in_flight{role} is present on every scrape (0 or 1);
# pg_router_queue_depth{type} exists only while the type is non-empty and
# pg_router_gates_active{type} only while a gate is in force.
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - name: an idle lane with a backlog fires after the window plus for, labelled with its type
    interval: 30s
    input_series:
      - series: pg_router_queue_depth{type="drain.pg2",job="pg-router"}
        values: "3x240"
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "0x240"
    promql_expr_test:
      # The helper role label is dropped again, so the alert keeps the labels of the rule it
      # replaced (and its open bead keeps matching).
      - expr: wrapped:pg_router_queue_stalled
        eval_time: 12m
        exp_samples:
          - labels: 'wrapped:pg_router_queue_stalled{job="pg-router", type="drain.pg2"}'
            value: 3
    alert_rule_test:
      - eval_time: 8m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 12m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 20m
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: drain.pg2
              job: pg-router
              severity: warning

  - name: a dispatch in flight is not a stall, however long it runs and however deep the backlog
    interval: 30s
    input_series:
      # The 2026-10-12 shape: depth 12, the role in flight for the whole hour.
      - series: pg_router_queue_depth{type="drain.pg2",job="pg-router"}
        values: "12x240"
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "1x240"
    promql_expr_test:
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 60m
        exp_samples: []
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 60m
        alertname: pg-router-queue-stalled
        exp_alerts: []

  - name: a dispatch in flight for part of the window is enough, a 150s hand-off is not a stall
    interval: 30s
    input_series:
      - series: pg_router_queue_depth{type="drain.pg2",job="pg-router"}
        values: "12x240"
      # In flight 20m, idle 150s (5 scrapes), repeated.
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "1x40 0x5 1x40 0x5 1x40 0x5 1x40 0x5 1x40 0x5 1x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 100m
        alertname: pg-router-queue-stalled
        exp_alerts: []

  # pg2-9nfla: the usage-limit decline storm of 2026-10-13. Every drain-pg2 offer was declined, one
  # every 13s, and an offer is in flight until it settles (about 2s for a decline), so about one
  # scrape in eight read the role as in flight, now and then two in a row, though nothing was
  # processed for over an hour. A declined attempt is not processing: the role counts as running
  # only when it is in flight on 6 consecutive scrapes (a 3 minute lookback), and the idle test
  # that read ANY in-flight scrape restarted its 10 minute window on every blip and paged for 7 of
  # the 69 minutes. Each unit below is 40 scrapes (20 minutes); the longest quiet stretch is 5
  # minutes, so the old test never reads the lane as idle.
  - name: declined offers caught in flight on one or two scrapes are not activity, a decline storm pages
    interval: 30s
    input_series:
      - series: pg_router_queue_depth{type="drain.pg2",job="pg-router"}
        values: "20x240"
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "0x5 1 0x3 1 1 0x5 1 0x2 1 0x6 1 1 0x1 1 0x3 0x5 1 0x3 1 1 0x5 1 0x2 1 0x6 1 1 0x1 1 0x3 0x5 1 0x3 1 1 0x5 1 0x2 1 0x6 1 1 0x1 1 0x3 0x5 1 0x3 1 1 0x5 1 0x2 1 0x6 1 1 0x1 1 0x3 0x5 1 0x3 1 1 0x5 1 0x2 1 0x6 1 1 0x1 1 0x3 0x5 1 0x3 1 1 0x5 1 0x2 1 0x6 1 1 0x1 1 0x3"
    promql_expr_test:
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 30m
        exp_samples:
          - labels: "{}"
            value: 1
    alert_rule_test:
      # The condition holds from 9m (18 scrapes) and pages after `for`, through every blip.
      - eval_time: 12m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 20m
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: drain.pg2
              job: pg-router
              severity: warning
      - eval_time: 100m
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: drain.pg2
              job: pg-router
              severity: warning

  - name: a dispatch in flight for three minutes or more is processing, a stretch of a few scrapes is not
    interval: 30s
    input_series:
      # drain.pg2: one dispatch in flight on 10 consecutive scrapes (5m to 9m30s), idle before and after.
      - series: pg_router_queue_depth{type="drain.pg2",job="pg-router"}
        values: "3x240"
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "0x9 1x9 0x220"
      # drain.zr: declined offers caught on 5 consecutive scrapes (5m to 7m), one short of a run,
      # idle otherwise. The recorded storm never reads more than 4 in a row (queue_stalled_test.go).
      - series: pg_router_queue_depth{type="drain.zr",job="pg-router"}
        values: "3x240"
      - series: pg_router_listener_in_flight{role="drain-zr",job="pg-router"}
        values: "0x9 1x4 0x226"
    alert_rule_test:
      # drain.zr is idle from 9m and pages at 14m whatever happened at 5m.
      - eval_time: 12m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      # drain.pg2's dispatch ran until 9m30s, so its window is clear only from 19m30s and it pages
      # after `for`: at 20m only drain.zr is firing, at 30m both are.
      - eval_time: 20m
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: drain.zr
              job: pg-router
              severity: warning
      - eval_time: 30m
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: drain.pg2
              job: pg-router
              severity: warning
          - exp_labels:
              type: drain.zr
              job: pg-router
              severity: warning

  # The same storm as the local Prometheus recorded it (pg2-9nfla): the REAL series of the drain.pg2
  # lane for 2026-10-13 19:30:14Z to 22:29:44Z (sample 0 is 19:30:14Z, 30s apart, scrapes on :14
  # and :44), read back with a [3h] range selector. In flight, the 87-scrape dispatch of 20:10:44Z
  # to 20:53:44Z, then the usage-limit storm (20:54:26Z to 21:59:59Z): 17 runs of 1, none longer
  # than 2 consecutive scrapes (only 21:15:44Z and 21:16:14Z), where the queue-stalled rule as
  # shipped restarted its window on every one and held its condition from 21:44Z to about 21:51Z;
  # then the dispatches that went in flight from 22:00:14Z (runs of 5, 10, 4, 5, 5 and 26 scrapes).
  # The throughput counter steps at 20:54:14Z (the last accept) and at 22:02:44Z (the first after
  # the storm). The lane held 18 to 35 events throughout. The condition is true from 21:05Z (the
  # throughput step leaves the window at 21:04:14Z) and the alert fires after `for`, at 21:10Z.
  - name: the real decline storm of 2026-10-13 pages through its blips and stops once the dispatches run (recorded Prometheus series)
    interval: 30s
    input_series:
      - series: pg_router_queue_depth{type="drain.pg2",job="pg-router"}
        values: "32x22 33x7 32x6 33x42 32x7 35x79 32x1 29x1 32 28 25 27 26 23 21 25x1 24 21 24x2 21 18 24 23 22 19 24x1 25 23 20 25 22 25 22 21 24 21 25 24 21 23 19 25 22 25 23 20 25 24x1 21 20 24 21 25 24 25 21 19 23x1 24 21 25 24 22 24 21 25x1 22 20 25x1 22 23 20 25 23 24 22 25x1 23x1 20 25 22 24 22 20 24 21 25 23x1 22 19 24x1 25 22 19 25 22 24 21 25x1 22 24 21x1 22 20 25x2 22 19 24 23x1 20 25 23 25 22 19 25 23x1 20 25x4 24 25x3 24 25x4 24x1 25x2 24x1 25x9 24 25x3 24 25x3 24x1 25x2 24x1 25x2 24x1 25x2 24"
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "1x25 0x4 1x1 0x4 1x41 0 1x86 0x2 1 0x5 1 0x4 1 0x4 1 0x3 1 0x2 1 0x8 1 0 1x1 0x2 1 0x4 1 0x1 1 0x11 1 0x7 1 0x32 1 0 1 0x4 1 0x2 1 0x5 1x4 0 1x9 0 1x3 0 1x4 0 1x4 0 1x25"
      - series: pg_router_throughput_total{role="drain-pg2",type="drain.pg2",job="pg-router"}
        values: "2x25 _x53 1x87 2x136 3x5 4x4 5x4 6x5 7x5 8x5 9x4 10x4 11x4 12x4 13"
    alert_rule_test:
      # 20:40:14Z: the 87-scrape dispatch is in flight.
      - eval_time: 1h10m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      # 21:30:14Z and 21:55:14Z: the lane has been idle with a backlog since 20:54Z, through the
      # blips of 21:29:14Z, 21:33:44Z and 21:50:44Z to 21:54:44Z.
      - eval_time: 2h
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: drain.pg2
              job: pg-router
              severity: warning
      - eval_time: 2h25m
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: drain.pg2
              job: pg-router
              severity: warning
      # 22:05:14Z and 22:20:14Z: the dispatches run and settle (promtool has no keepFiringFor).
      - eval_time: 2h35m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 2h50m
        alertname: pg-router-queue-stalled
        exp_alerts: []

  # The daemon restart of 2026-10-12 (pg2-g8gnv, found by pg2-b1srv): the drain.pg2 dispatch that went in
  # flight at 23:03:43Z ran 74 minutes, through a restart at 23:28:05Z that left its session working (ADR 0085 of
  # this repo). The new process holds no offer until its first dispatch pass re-offers the event (23:33:06Z), so
  # the in-flight gauge read 0 for four and a half minutes while the lane worked, and the accept record of the
  # dispatch, which carries the re-offer's start, made a lane rebuilt from accept records look idle for 30
  # minutes (internal/alertrules/testdata/drain_pg2_2026-10-12.txt). The rule needs the role quiet for the 10
  # minute window and then 5 more, so it stays silent.
  #
  # The REAL series of the lane for 22:50:14Z to 00:19:53Z, the raw samples read back with a [100m] range
  # selector at 00:20:00Z (a stepped range query reads each step off the last sample within five minutes and
  # moves the edges). Sample 0 is 22:50:14Z and every sample sits at its real second, so the spacing is the
  # recorded one: mostly 30 seconds, 6 to 88 once the host load average passed 100 and Prometheus scraped late
  # (the hand-off of 23:03:14Z read 0; no sample from 23:27:44Z to 23:28:53Z; 0 on the 8 scrapes of 23:28:53Z to
  # 23:32:57Z; 1 again at 23:33:25Z), hence `interval: 1s`. The depth (17 to 28 events) and the gauge are sampled
  # on the same scrapes, so the presence guard sees the recorded holes too. The throughput counter is left
  # out on purpose: its last step is 23:03:14Z, 25
  # minutes before the restart, and the new process's series starts only at 00:18:23Z, so nothing in it
  # protects the rule during the hole and the case holds on the in-flight window alone. No gate series
  # existed in the window. The hole is deepest at 23:33Z (the window then still holds the old process's
  # last run of in-flight scrapes, 23:27:44Z); the new process's run of 6 completes by 23:36Z, before that run
  # leaves the window at 23:38:30Z.
  - name: the real daemon restart of 2026-10-12 reads 0 in flight for 4.5 minutes while the session works, and nothing pages (recorded Prometheus series)
    interval: 1s
    input_series:
      - series: pg_router_queue_depth{type="drain.pg2",job="pg-router"}
        values: "17 _x29 17 _x29 17 _x29 17 _x29 17 _x29 17 _x29 17 _x29 19 _x29 19 _x29 19 _x29 19 _x30 19 _x28 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 20 _x29 20 _x29 21 _x29 21 _x29 21 _x29 21 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x31 19 _x87 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x61 19 _x27 19 _x29 19 _x29 19 _x29 19 _x31 19 _x27 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x29 19 _x68 19 _x29 19 _x29 19 _x29 19 _x37 19 _x75 19 _x5 19 _x33 19 _x27 19 _x27 19 _x29 19 _x29 19 _x29 19 _x29 20 _x29 20 _x38 20 _x21 20 _x28 20 _x29 20 _x29 20 _x29 20 _x29 20 _x29 20 _x40 20 _x18 20 _x29 20 _x29 20 _x29 20 _x29 20 _x30 20 _x28 20 _x29 20 _x29 20 _x59 20 _x29 20 _x30 20 _x29 20 _x28 20 _x30 20 _x46 20 _x12 20 _x28 20 _x30 20 _x28 20 _x29 20 _x29 20 _x32 21 _x26 21 _x59 21 _x37 21 _x45 21 _x7 21 _x28 21 _x28 21 _x29 21 _x29 21 _x29 21 _x29 21 _x29 21 _x29 21 _x29 21 _x29 21 _x30 21 _x29 21 _x28 21 _x29 21 _x29 21 _x29 21 _x29 21 _x29 21 _x29 21 _x29 21 _x29 21 _x31 21 _x27 21 _x29 21 _x29 21 _x30 21 _x28 21 _x29 25 _x29 25 _x29 25 _x29 27 _x29 27 _x29 27 _x29 28 _x29 28 _x30 28 _x36 28 _x28 28 _x22 28 _x29 28 _x29 28 _x29 28 _x29 28 _x29 28 _x29 26 _x29 24 _x29 21 _x29 19"
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x30 1 _x28 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 0 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x31 1 _x87 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x61 1 _x27 1 _x29 1 _x29 1 _x29 1 _x31 1 _x27 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x68 0 _x29 0 _x29 0 _x29 0 _x37 0 _x75 0 _x5 0 _x33 0 _x27 1 _x27 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x38 1 _x21 1 _x28 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x40 1 _x18 1 _x29 1 _x29 1 _x29 1 _x29 1 _x30 1 _x28 1 _x29 1 _x29 1 _x59 1 _x29 1 _x30 1 _x29 1 _x28 1 _x30 1 _x46 1 _x12 1 _x28 1 _x30 1 _x28 1 _x29 1 _x29 1 _x32 1 _x26 1 _x59 1 _x37 1 _x45 1 _x7 1 _x28 1 _x28 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x30 1 _x29 1 _x28 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x31 1 _x27 1 _x29 1 _x29 1 _x30 1 _x28 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x30 1 _x36 1 _x28 1 _x22 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 1 _x29 0 _x29 0 _x29 1 _x29 0"
    promql_expr_test:
      # Non-vacuity: the hole is in the series. The last scrape before it read 1 (23:27:44Z, 37m30s), the
      # scrapes of the restart read 0 (the one at 23:31:01Z, 40m47s, is the latest at 41m), and the dispatch
      # reads 1 again from 23:33:25Z (the latest sample at 44m, 23:34:14Z, is the 23:33:53Z one).
      - expr: pg_router_listener_in_flight{role="drain-pg2"}
        eval_time: 38m
        exp_samples:
          - labels: 'pg_router_listener_in_flight{job="pg-router", role="drain-pg2"}'
            value: 1
      - expr: pg_router_listener_in_flight{role="drain-pg2"}
        eval_time: 41m
        exp_samples:
          - labels: 'pg_router_listener_in_flight{job="pg-router", role="drain-pg2"}'
            value: 0
      - expr: pg_router_listener_in_flight{role="drain-pg2"}
        eval_time: 44m
        exp_samples:
          - labels: 'pg_router_listener_in_flight{job="pg-router", role="drain-pg2"}'
            value: 1
      # The condition never holds: before the restart, in the hole, at its end and through the 10 minutes
      # after it (the window is the only thing between this lane and a page), then to the end of the recording.
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 30m
        exp_samples: []
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 38m
        exp_samples: []
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 41m
        exp_samples: []
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 43m
        exp_samples: []
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 45m
        exp_samples: []
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 48m
        exp_samples: []
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 51m
        exp_samples: []
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 60m
        exp_samples: []
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 80m
        exp_samples: []
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 89m
        exp_samples: []
    alert_rule_test:
      - eval_time: 38m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 41m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 43m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 48m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 55m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 89m
        alertname: pg-router-queue-stalled
        exp_alerts: []

  - name: a pace-limited fast role that is never caught in flight is not idle while its dispatches keep settling
    interval: 30s
    input_series:
      - series: pg_router_queue_depth{type="issue.changed",job="pg-router"}
        values: "15x240"
      - series: pg_router_listener_in_flight{role="desk-issue",job="pg-router"}
        values: "0x240"
      # One 1s dispatch settles a minute for the first hour (the counter advances 1 a minute),
      # then the counter stops: the consumer has gone silent with a backlog.
      - series: pg_router_throughput_total{type="issue.changed",role="desk-issue",job="pg-router"}
        values: "0+0.5x120 60x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 65m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      # The last increase is at 60m; the window is clear of it from 70m and fires 5m later.
      - eval_time: 72m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 80m
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: issue.changed
              job: pg-router
              severity: warning

  - name: the join is by the bound role, so a busy neighbour does not excuse an idle lane
    interval: 30s
    input_series:
      # drain.pg2 is idle with a backlog while the drain-zr lane next to it is busy with its own.
      - series: pg_router_queue_depth{type="drain.pg2",job="pg-router"}
        values: "3x240"
      - series: pg_router_queue_depth{type="drain.zr",job="pg-router"}
        values: "5x240"
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "0x240"
      - series: pg_router_listener_in_flight{role="drain-zr",job="pg-router"}
        values: "1x240"
    alert_rule_test:
      - eval_time: 20m
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: drain.pg2
              job: pg-router
              severity: warning

  - name: desk-pr binds two types, so it covers both of them whether busy or idle
    interval: 30s
    input_series:
      - series: pg_router_queue_depth{type="pr.changed",job="pg-router"}
        values: "5x240"
      - series: pg_router_queue_depth{type="pr.reconcile",job="pg-router"}
        values: "30x240"
      # Busy for the first 30m, idle afterwards.
      - series: pg_router_listener_in_flight{role="desk-pr",job="pg-router"}
        values: "1x60 0x180"
    alert_rule_test:
      # Busy with one type (or the other): neither waiting type is stalled.
      - eval_time: 28m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      # Idle since 30m: both types page, each under its own type label.
      - eval_time: 50m
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: pr.changed
              job: pg-router
              severity: warning
          - exp_labels:
              type: pr.reconcile
              job: pg-router
              severity: warning

  - name: every role of the daemon config maps to the type it binds (idle with a backlog)
    interval: 30s
    input_series:
      - series: pg_router_queue_depth{type="review.ready"}
        values: "2x240"
      - series: pg_router_listener_in_flight{role="review"}
        values: "0x240"
      - series: pg_router_queue_depth{type="issue.changed"}
        values: "2x240"
      - series: pg_router_listener_in_flight{role="desk-issue"}
        values: "0x240"
      - series: pg_router_queue_depth{type="desk.heartbeat"}
        values: "2x240"
      - series: pg_router_listener_in_flight{role="desk-heartbeat"}
        values: "0x240"
      - series: pg_router_queue_depth{type="escalated.pg2"}
        values: "2x240"
      - series: pg_router_listener_in_flight{role="pg2-escalation-triager"}
        values: "0x240"
      - series: pg_router_queue_depth{type="split-review.pg2"}
        values: "2x240"
      - series: pg_router_listener_in_flight{role="pg2-split-triager"}
        values: "0x240"
      - series: pg_router_queue_depth{type="disk.check"}
        values: "2x240"
      - series: pg_router_listener_in_flight{role="disk-watchdog"}
        values: "0x240"
    promql_expr_test:
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 20m
        exp_samples:
          - labels: "{}"
            value: 6

  - name: a type the table does not know is not covered, and neither is a role that is not bound
    interval: 30s
    input_series:
      - series: pg_router_queue_depth{type="custom.thing",job="pg-router"}
        values: "5x240"
      - series: pg_router_listener_in_flight{role="custom",job="pg-router"}
        values: "0x240"
      # Anchoring: a type that merely extends a bound one maps to nothing.
      - series: pg_router_queue_depth{type="drain.pg2.extra",job="pg-router"}
        values: "5x240"
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "0x240"
    promql_expr_test:
      - expr: count(wrapped:pg_router_queue_stalled)
        eval_time: 20m
        exp_samples: []

  - name: any gate in force suppresses every type, and the rule fires normally once the gate is gone
    interval: 30s
    input_series:
      - series: pg_router_queue_depth{type="drain.pg2",job="pg-router"}
        values: "3x240"
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "0x240"
      # SYSTEM_PAUSE for the first 30m (60 scrapes), then cleared (no series).
      - series: pg_router_gates_active{type="SYSTEM_PAUSE",job="pg-router"}
        values: "1x60 _x180"
    alert_rule_test:
      # Idle with a backlog the whole time, but the gate is in the window until 40m.
      - eval_time: 25m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 38m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      # The condition holds again from 40m and fires after `for` (45m).
      - eval_time: 43m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 50m
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: drain.pg2
              job: pg-router
              severity: warning

  - name: a sleep leaves a gap, and the presence guard needs 10 minutes of fresh scrapes after the wake
    interval: 30s
    input_series:
      # 10m of idle backlog, a 3h gap (the host asleep: no scrapes), then the same idle backlog.
      - series: pg_router_queue_depth{type="drain.pg2",job="pg-router"}
        values: "3x20 _x360 3x120"
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "0x20 _x360 0x120"
    alert_rule_test:
      # Before the sleep the alert never got through `for` (the series ends after 10m).
      - eval_time: 14m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      # Just after the wake (190m): too few fresh scrapes for the condition to hold.
      - eval_time: 195m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      # Condition from 199m, Pending until `for` has elapsed at 204m.
      - eval_time: 202m
        alertname: pg-router-queue-stalled
        exp_alerts: []
      - eval_time: 210m
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: drain.pg2
              job: pg-router
              severity: warning

  - name: a type that blips into the queue for a scrape and drains again is not a backlog
    interval: 30s
    input_series:
      # One scrape of depth 12 every 10 minutes: the gauge has no series in between.
      - series: pg_router_queue_depth{type="drain.pg2",job="pg-router"}
        values: "12 _x19 12 _x19 12 _x19 12 _x19 12 _x19 12 _x19 12 _x19 12 _x19"
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "0x160"
    alert_rule_test:
      - eval_time: 60m
        alertname: pg-router-queue-stalled
        exp_alerts: []

  - name: a lane that was idle and then resumes stops being a stall, and the alert resolves after keepFiringFor
    interval: 30s
    input_series:
      - series: pg_router_queue_depth{type="drain.pg2",job="pg-router"}
        values: "3x240"
      # Idle for the first 30m, then a dispatch in flight.
      - series: pg_router_listener_in_flight{role="drain-pg2",job="pg-router"}
        values: "0x60 1x180"
    alert_rule_test:
      - eval_time: 25m
        alertname: pg-router-queue-stalled
        exp_alerts:
          - exp_labels:
              type: drain.pg2
              job: pg-router
              severity: warning
      # The in-flight scrape at 30m is in the window until 40m, so the condition is false from
      # 30m on; the alert stays resolved (promtool has no keepFiringFor).
      - eval_time: 45m
        alertname: pg-router-queue-stalled
        exp_alerts: []
