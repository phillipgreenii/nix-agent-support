# pg-router unified-alerting rules (pg2-02n5o): closes the "panels but no
# alert rules" gap identified in a live incident (pg2-5sirm) -- none of
# pg_router_liveness dropping to 0, pg_router_backlog/pg_router_queue_depth
# growing unbounded for a specific type, or a sustained non-zero
# pg_router_failures_total rate would have paged or otherwise surfaced to an
# unattended operator before this file existed.
#
# Metric names and semantics verified against (not guessed):
#   - phillipgreenii-nix-support-apps/darwin/modules/observability/
#     dashboards/pg-router.json (the existing dashboard panels)
#   - packages/pg-router/internal/metrics/metrics.go (this repo)
#
# Folder "pg-router" (deliberately NOT the shared "Daemon Health" folder
# launchd-health/mysql-probe/logsource-health use in
# phillipgreenii-nix-support-apps) converges BY TITLE with the existing
# pg-router dashboard's own dashboardProviders folder, registered from
# phillipgreenii-nix-support-apps/darwin/modules/observability/ui.nix (ADR
# 0039's title-convergence mechanism -- no folderUid is ever pinned, since
# Grafana's alerting file-provisioning has no folderUid field and
# provisions before dashboards; see that repo's alerting.nix header comment
# for the incident a pinned uid caused).
#
# Registered via phillipgreenii.observability.alertRuleFiles from
# darwin/modules/pg-router/default.nix, gated on `obs.enable` only (mirrors
# darwin/modules/pa-monitor/default.nix's own precedent: "wired
# unconditionally ... no-op on machines without the observability stack"),
# NOT on daemonEnabledByAnyUser -- registering this file is harmless even
# when the daemon LaunchAgent isn't running; the rules below simply see no
# data in that case.
apiVersion: 1
# Explicit deletion of rules removed from this file (pg2-87bbd). Grafana's file
# provisioner only adds/updates rules present in the YAML; dropping a rule's
# entry leaves the already-provisioned rule live (provenance=file) and still
# evaluating. A rule is removed only by a `deleteRules:` entry for its uid,
# applied on a provisioning reload/restart. Same mechanism as
# phillipgreenii-nix-support-apps's reconcile-alert-rules.nix. Keep an entry
# here for as long as any Grafana database may still hold the rule; it is
# harmless once the rule is gone.
deleteRules:
  # pg2-p93c0 removed the rule below; pg2-87bbd found it still live after apply.
  - orgId: 1
    uid: pg-router-backlog-growing
groups:
  - orgId: 1
    name: pg-router-alerts
    folder: pg-router
    interval: 1m
    rules:
      # Conventions (pg2-x7ie2): the optional rule label `escalation` routes the
      # bead pg-router-probe files for a firing instance of a rule it watches.
      # Recognised value: `human` -- the bead gets the labels escalated AND human
      # (it skips the triager and lands in the operator's queue, with this rule's
      # summary/description rendered as a Remediation: section). Absent (the
      # default) means escalated only, for the triager. `escalation` is routing
      # metadata, not identity: the probe excludes it from the alert fingerprint,
      # so adding it to a registered rule keeps matching that rule's open beads.
      # Annotations stay STATIC (no {{ }}): they are copied verbatim into beads.
      #
      # Liveness: pg_router_liveness reports 1 while the daemon's last tick
      # is within its liveness window, else 0 (daemon-mode only --
      # internal/metrics/metrics.go's WithLiveness/MetricLiveness).
      # noDataState is Alerting, not OK: unlike a per-label registry rule
      # where a label simply leaving the watch list is benign (see
      # launchd-health's own per-label rules), this is pg-router's OWN
      # single fixed liveness series. Once the daemon LaunchAgent is
      # configured to run, an absent series means the metrics endpoint
      # itself is unreachable (the daemon crashed or never started), which
      # is exactly the failure this rule exists to catch -- the same
      # reasoning mysql-probe/alerting-template.nix's per-target rule uses,
      # not pa-monitor's daemon-connection.yaml (whose OK polarity fits a
      # client-side "maybe nobody has a pane open right now" absence, which
      # does not apply here).
      - uid: pg-router-liveness-down
        title: pg-router liveness is down
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "pg-router daemon liveness has been down for over 5 minutes"
          description: "pg_router_liveness has reported 0, or gone missing from Prometheus entirely, for over 5 minutes -- the daemon's last tick has fallen outside its liveness window, or its /metrics endpoint is unreachable. This is exactly the condition observed live in pg2-5sirm that no alert previously covered. Check `pg-router status` and the com.phillipg.pg-router-daemon LaunchAgent."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: pg_router_liveness
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # Aggregate backlog rule REMOVED (pg2-p93c0, decision recorded below the
      # stall rule; its live copy is deleted by the deleteRules entry at the top
      # of this file, pg2-87bbd): the old pg-router-backlog-growing paged on any 45m+ ramp of
      # the TOTAL (delta(pg_router_backlog[30m]) > 0 for 15m) even though the
      # queue fully drained afterward, and a stalled consumer is covered per
      # type by pg-router-queue-stalled. pg_router_backlog stays a dashboard
      # panel; it is no longer an alert input.
      #
      # Queue depth (per type): pg_router_queue_depth carries a `type`
      # label (pg-router.json's "Queue depth (by type)" panel) -- this is
      # the metric pg2-5sirm's own evidence names directly ("growing
      # unbounded for a specific type"). Sustained-growth shape, evaluated
      # per series: Grafana's unified
      # alerting treats each unique label combination the query returns as
      # an independent alert instance, so one type growing fires without
      # needing every type enumerated in Nix -- unlike launchd-health's
      # bounded label registry, pg-router's event types are not a static,
      # known-in-advance list.
      #
      # pg2-xepg6 (false-positive fix): metrics.go's gauge callback observes
      # ONLY the types present in the queue right now, so a drained type has
      # NO series at all (no explicit 0). A type that blips 0 -> 1-2 -> 0
      # (routine: an event is enqueued, accepted and evicted between two
      # scrapes) therefore leaves a few isolated non-zero samples, and
      # delta() over [30m] compares just those (1 -> 2 reads as +1.6, +1.8
      # after range extrapolation) -- positive for 15m, so it paged
      # (issue.changed 2026-09-29, then pr.changed / review.ready) and then
      # self-cleared as MissingSeries once the old samples left the window.
      # The fix is rule-side (no change to the gauge's contract): growth
      # only counts when the series was PRESENT on (nearly) every scrape of
      # the window, i.e. the type never drained to zero for 30m --
      # count_over_time(...) >= 54 of the 60 samples a 30s scrape interval
      # yields (10% slack for a missed scrape), combined with delta > 0 so a
      # steady-nonzero-but-flat or falling depth still does not page. The
      # 15m `for:` then requires that to hold sustained. Fingerprint labels
      # (rule uid, alertname, severity, type) are unchanged. Replay of the
      # pg2-xepg6 samples and a synthetic sustained-growth series live in
      # internal/alertrules/queue_depth_growing_test.go. If the scrape
      # interval changes, update the 54 there and here together.
      #
      # pg2-7xvn8 (magnitude guard): the presence guard does not filter a
      # DENSE series. pr.changed / pr.reconcile plateau at ~52-58 with
      # delta ~ +3 (noise), so `delta > 0` still flapped Pending/Alerting.
      # Growth now also needs an absolute rise of >= 10 over the window AND
      # a rise of > 25% of the window's average depth (plateau noise is ~5%
      # of the average). Constants are mirrored in
      # internal/alertrules/queue_depth_growing_test.go; change together.
      #
      # pg2-mpgfa (trend guard): the pg2-7xvn8 floor (delta(30m) >= 10) still
      # let the periodic pr.reconcile sawtooth (A=11.19, 13.22) and a
      # pr.changed 1 -> 12 step (A=11.28) go Pending. Those rises are small
      # and one-sided; a genuine backlog keeps climbing. Growth now ALSO needs
      # delta(1h) >= 25 (a rise no ~12-per-tooth sawtooth or small burst can
      # accumulate) and a rise >= 5 in EACH 15m half of the 30m window (a
      # sustained slope, not a single jump or a sawtooth that has already
      # turned). Slowest growth caught: ~25/h. Replay of 3 days of recorded
      # history: see the commit message.
      #
      # pg2-nw41e (periodic batch sawtooth, NO expression change): the
      # type=pr.reconcile sweep refills the queue to ~70 every 30m and the
      # single consumer drains it in 28-30m, so under the c2e2fb21 text
      # (delta > 0 and count >= 54) the sign of delta(30m) was set by cycle
      # phase and paged 5 times in 9h (replay of the 2026-09-29 17:55Z-02:55Z
      # queue.jsonl reconstruction, windows 18:10, 19:12, 22:13, 23:14, 02:09).
      # The current text evaluates false for that whole window and never
      # reaches Alerting for pr.reconcile anywhere in the 2026-09-17 to
      # 2026-10-01 reconstruction (only five true stretches of <= 7m, one of
      # them the 10-01 22:14Z Pending at depth peak ~78; `for: 15m` never
      # held): a sawtooth that drains inside one window has a falling half in
      # every 30m window, so the "rise >= 5 in EACH 15m half" guard cannot hold.
      # Regression coverage: TestReconcileSawtoothDoesNotAlertOrPend (17
      # measured pre-sweep depths) and TestReconcileRecordedEpisodeDoesNotAlertOrPend
      # (the pg2-0594o 4-minute samples, which alert under c2e2fb21) in
      # internal/alertrules/queue_depth_growing_test.go. Known gap (pg2-nw41e R2
      # SHOULD), now addressed by the SEPARATE rule pg-router-queue-stalled
      # below (pg2-o6z19) rather than by loosening this one: a standing flat
      # backlog (pr.changed 43 -> 56 over 25m) rises < 25/h, and a stalled
      # bounded type needs a different signal (dispatch progress), not a looser
      # slope guard. This rule's expression is UNCHANGED by pg2-o6z19.
      - uid: pg-router-queue-depth-growing
        title: pg-router queue depth is growing (by type)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-router queue depth for type {{ $labels.type }} has been growing"
          description: "delta(pg_router_queue_depth[30m]) has stayed positive for over 15 minutes for type {{ $labels.type }} while the type stayed non-empty on every scrape of the window (it never drained to zero) -- this event type is being retained faster than it is dispatched. This is the exact per-type buildup observed live in pg2-5sirm."
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: delta(pg_router_queue_depth[1h]) >= 25 and delta(pg_router_queue_depth[30m]) >= 10 and delta(pg_router_queue_depth[15m]) >= 5 and delta(pg_router_queue_depth[15m] offset 15m) >= 5 and delta(pg_router_queue_depth[30m]) > 0.25 * avg_over_time(pg_router_queue_depth[30m]) and count_over_time(pg_router_queue_depth[30m]) >= 54
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Stalled consumer (per type), pg2-o6z19 / pg2-n1pm4 / pg2-p93c0: a type
      # that sat at depth >= 10 for 30 minutes while pg_router_throughput_total
      # (counter, `type` label; Emitter.OnAccept increments it once per accepted
      # delivery, internal/metrics/metrics.go) did not advance for that type.
      # This measures dispatch PROGRESS, not depth trend, so it separates the
      # absorbed bursts (12:49Z and 13:49Z on 2026-09-30: cleared in 30-40m,
      # dispatching throughout) from the 14:19Z-17:29Z pr.changed stall (depth
      # ~55, no counted dispatches) and from the 20:43Z ~16-deep nearly-flat
      # episode (a dispatch lands within every 30m). The healthy pr.reconcile
      # sawtooth, the 2026-10-01 issue.changed surge and review.ready under the
      # max_sessions=1 backpressure (pg2-mr0sl; depth 1-4, below the floor) never
      # satisfy it. Replay of the recorded series: testdata/*.csv and
      # internal/alertrules/queue_depth_growing_test.go.
      #
      # Decision (pg2-o6z19), NEW rule instead of retuning
      # pg-router-queue-depth-growing: the growth rule still has a job (a
      # consumer that IS dispatching but slower than arrivals: TestSustainedGrowth*),
      # its fingerprint labels (rule uid, alertname, severity, type) stay
      # untouched, and a retune would have forced a different expression under the
      # same uid and discarded the growth coverage and its replay tests. The two
      # rules' fingerprints differ by rule uid, so each pages and escalates
      # separately. A stalled consumer with a growing queue MAY fire both.
      #
      # Differences from the expression pg2-n1pm4 suggested:
      #   - count_over_time(...[30m]) >= 54 is KEPT (that bead proposed dropping
      #     it). The gauge observes only types present in the queue (pg2-xepg6), so
      #     a type that drained has NO series and min_over_time sees only the few
      #     remaining samples: one stray sample of 12 would satisfy >= 10. The
      #     presence guard is what makes "held >= 10 for 30m" true.
      #   - `unless on(type) (... > 0)` matches on `type` only (the left side
      #     keeps instance/job/otel_scope_name, so the alert's fingerprint labels
      #     are the same shape as the growth rule's). A type with NO throughput
      #     series at all (OTel counters are created lazily on first increment) has
      #     nothing to match, so it is treated as stalled, which is right.
      #
      # Former limitation, FIXED (pg2-0efop): before that fix,
      # pg_router_throughput_total only counted events whose OnEnqueue this daemon
      # process saw. eventqueue.Queue.replay() restored the durable queue on start
      # without telling the Observer, so Emitter.OnAccept found no pending entry for
      # restored events and silently skipped them. A type with a backlog >= 10
      # therefore read "zero throughput" after every daemon restart until the
      # restored events drained, even though the consumer was working. The recorded
      # 2026-09-30 14:19Z-17:29Z "stall" was partly this artifact (restarts at
      # 14:49:52Z and 16:17:51Z; the queue log shows pr.changed accepts continuing
      # at a reduced rate from 15:00Z).
      # The fix: replay() now calls the optional eventqueue.RestoreObserver once
      # per retained event, and Emitter.OnRestore seeds the pending correlation
      # (type and the ORIGINAL enqueue instant) without counting an enqueue, so
      # restored accepts DO count in pg_router_throughput_total and dispatch
      # latency. Verified live 2026-10-01 (pg2-t0l6b): two daemon restarts on the
      # fixed build with non-empty durable queues (75 and 61 events) -- throughput
      # matched the queue.jsonl accepts for the restored events (e.g. 56 of 56
      # pr.reconcile), and this rule's expression did NOT match after either
      # restart, with backlogs of 52+16 and 57 (both >= the 10 floor). The only
      # matches seen were on the pre-fix build and shorter than `for: 30m`. The
      # alertrules model test keeps the pre-fix 2026-09-30 series as a recorded
      # replay. Residual: the emitter's correlation map is capped (4096 entries,
      # oldest evicted first), so a restored backlog larger than that cap is not
      # fully counted; this was not exercised live.
      #
      # Known gap (pg2-o6z19 R1, partially met): a periodic type whose troughs
      # rise cycle over cycle while the consumer keeps dispatching never goes a
      # whole 30m without a dispatch, so this rule cannot see it; it alerts only
      # when the rise coincides with 30m of dispatch silence. Closing that needs a
      # separate "backlog not draining" signal (not built: a never-below-N-for-2h
      # form fires on healthy slow pr.reconcile cycles).
      #
      # for/keepFiringFor 30m: the condition already needs 30m of silence, so `for`
      # adds another 30m before paging (an episode alerts >= 60m after the last
      # dispatch), and keepFiringFor holds the alert through a
      # dribble of one dispatch every ~30m that would otherwise flap it.
      # keepFiringFor is camelCase on purpose: file provisioning ignores the
      # snake_case spelling (AlertRuleExport; see hostmetrics.nix in
      # phillipgreenii-nix-support-apps).
      #
      # pg2-p93c0 decision: pg-router-backlog-growing is DELETED, not retuned to
      # a total-queue stall form. A whole-system stall (nothing dispatching at
      # all) surfaces here per type as soon as any type holds >= 10: desk.heartbeat
      # alone is enqueued about once a minute and passes the floor in ~10m
      # (TestWholeSystemStallSurfacesViaHeartbeat), and a dead daemon is the
      # liveness rule's job. What an aggregate stall rule would add is only
      # many types each below 10 whose sum passes 10, which is queue noise by the
      # floor's own definition. The delta(backlog) form paged on every absorbed
      # ramp (12h of data: swings from single digits to ~135, never unbounded).
      - uid: pg-router-queue-stalled
        title: pg-router queue is stalled (by type)
        condition: C
        for: 30m
        keepFiringFor: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-router queue for type {{ $labels.type }} is stalled: depth held at 10 or more with no dispatches"
          description: "pg_router_queue_depth for type {{ $labels.type }} stayed at 10 or more (and the type never drained) across a 30 minute window in which pg_router_throughput_total for that type did not advance, and the condition held for another 30 minutes -- the consumer for this event type is not making counted progress. Check `pg-router status` and the role that binds this type. Events restored from the durable queue after a daemon restart are counted in the throughput metric (pg2-0efop), so a restart alone is not expected to trigger this alert; if it fires shortly after a restart, compare the queue log before acting."
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: min_over_time(pg_router_queue_depth[30m]) >= 10 and count_over_time(pg_router_queue_depth[30m]) >= 54 unless on(type) (sum by (type) (increase(pg_router_throughput_total[30m])) > 0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Failure rate: pg_router_failures_total, aggregated by `class`
      # (declined | dispatch-failure | handler-error) and `role` (the
      # config-bounded role name; as of pg2-nimab EVERY class carries it,
      # so a single starved or failing role is isolated per series, the way
      # pg2-5sirm's incident needed -- DEC-OBS-5). Residual declined reasons
      # (busy, unavailable, capacity-unknown) therefore page per role, and
      # this rule's alert fingerprint is per class+role. Trustworthy as of pg2-97539 (closed): before that
      # fix, a handler-internal dispatch error fell through both existing
      # failure classes uncounted, so a real 100% failure burst could have
      # read as a flat-zero rate here; FailureClassHandlerError closed that
      # gap. noDataState: OK -- per pg-router.json's own panel description,
      # an absent series means zero failures of any class have ever been
      # recorded (OTel counters are lazily created per label set on first
      # increment), which is the healthy state.
      #
      # class=declined,reason=at-capacity is EXCLUDED from the condition
      # (pg2-v3qn6, operator decision 2026-09-25): reason=at-capacity is
      # internal/metrics/metrics.go's OnDeclined recording pg-router-ccpool-
      # handler's busyReasonAtCapacity (cmd/pg-router-ccpool-handler/
      # dispatch.go, fed from executor.ErrPoolAtCapacity at
      # packages/pg-router-ccpool-handler/internal/executor/ccpool.go:97-101)
      # -- routine backpressure from the review role's max_sessions=1 cap
      # (pg2-mr0sl, an INTENTIONAL throughput-for-reliability tradeoff after
      # the pg2-5sirm zombie-session incident), not a real failure. Both
      # pg-router-queue-depth-growing (pg2-3ir8j) and this alert
      # (pg2-q4hzc) fired for that same accepted tradeoff within the same
      # ~24h window and were both closed no-fix-needed, which is the signal
      # this exclusion exists to act on. `reason` is ONLY ever set by
      # OnDeclined (class=declined) and OnHandlerFailure (budget-exceeded /
      # triager-failure) -- OnDispatchFailure never attaches it -- so a bare `reason!="at-capacity"` matcher cannot
      # clip dispatch-failure/handler-error, nor any other declined reason
      # (e.g. capacity-unknown): those keep paging unchanged.
      - uid: pg-router-failure-rate
        title: pg-router failure rate is non-zero (by class)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-router failure rate for class {{ $labels.class }} role {{ $labels.role }} has been non-zero"
          description: 'sum by (class, role) (rate(pg_router_failures_total{reason!~"at-capacity|budget-exceeded|origin-unavailable|triager-failure"}[10m])) has stayed above 0 for over 10 minutes for class {{ $labels.class }} role {{ $labels.role }} (role is set for every class as of pg2-nimab, DEC-OBS-5) -- deliveries are failing. This is the RESIDUAL rule (pg2-irowq): it keeps every failure EXCEPT the four causes handled elsewhere (pg2-o03wl: origin-unavailable has its own rule, pg-router-origin-unavailable, so an origin outage pages once) -- class=declined,reason=at-capacity (routine review-pool backpressure, pg2-mr0sl''s intentional max_sessions=1 cap, excluded per pg2-v3qn6), reason=budget-exceeded (its own rule, pg-router-budget-stops), reason=origin-unavailable (its own rule, pg-router-origin-unavailable) and reason=triager-failure (escalation-triage roles, bulkheaded by pg2-u2yub so they cannot fire this alert; their own rule, pg-router-triager-failures). See pg2-97539 for the failure-class catalog''s provenance.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum by (class, role) (rate(pg_router_failures_total{reason!~"at-capacity|budget-exceeded|origin-unavailable|triager-failure"}[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Budget stops (pg2-irowq, operator ruling 2026-09-30): a handler error
      # carrying the documented "session budget exceeded" sentinel is counted by
      # internal/metrics OnHandlerFailure as class=handler-error,
      # reason=budget-exceeded with a config-bounded `role` label (DEC-OBS-3).
      # Split out of pg-router-failure-rate so budget stops (pg2-uwnjp, pg2-k5rri)
      # stop mixing with unrelated causes in one recurring alert bead. Pool /
      # limit / used / cap detail is NOT a label: it is in the handler's error
      # text and eventlog hard_stop record. Only `role` can be referenced in
      # the annotation -- Grafana sees only labels present on the series.
      - uid: pg-router-budget-stops
        title: pg-router session budget stops (by role)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-router role {{ $labels.role }} is hitting its session budget"
          description: 'sum by (role) (rate(pg_router_failures_total{class="handler-error",reason="budget-exceeded"}[10m])) has stayed above 0 for over 10 minutes for role {{ $labels.role }} -- sessions are being hard-stopped at their budget. Which limit (tokens/cost/time), pool, used-vs-cap and bead are in the handler error text and the handler''s eventlog hard_stop record, not in labels (DEC-OBS-3, pg2-irowq).'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum by (role) (rate(pg_router_failures_total{class="handler-error",reason="budget-exceeded"}[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Triager failures (pg2-u2yub, operator-extracted from pg2-68005's triager
      # follow-ups): an escalation-triage role's handler failures are counted
      # by internal/metrics OnHandlerFailure as class=handler-error,
      # reason=triager-failure (role name contains "triage", the handler's own
      # convention) and are excluded from pg-router-failure-rate, so a failing
      # triager can no longer fire the worker/review failure-rate alert for a
      # cause unrelated to worker/review health. They stay visible here under
      # their own series and role label. `for: 30m` and no bead-filing
      # consumer: a triager failing is a signal to look, not a page, and the
      # triager is itself the consumer of escalations.
      - uid: pg-router-triager-failures
        title: pg-router escalation-triager failures (by role)
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-router escalation-triage role {{ $labels.role }} is failing"
          description: 'sum by (role) (rate(pg_router_failures_total{class="handler-error",reason="triager-failure"}[10m])) has stayed above 0 for over 30 minutes for role {{ $labels.role }} -- the triager role''s dispatches are failing. Bulkheaded out of pg-router-failure-rate (pg2-u2yub); the handler error text and eventlog carry the cause.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum by (role) (rate(pg_router_failures_total{class="handler-error",reason="triager-failure"}[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Origin unavailable (bead pg2-x7euu, per-origin probe gate from pg2-4gi2c; see packages/pg-router-ccpool-handler/docs/behavior):
      # the ccpool handler declines dispatches into a repo whose git origin
      # probe is failing, surfacing as
      # pg_router_failures_total{class="declined",reason="origin-unavailable"}.
      # The alert carries NO per-origin or per-error detail: annotations are a
      # STATIC per-class remediation map only (no stderr / user-supplied
      # strings, which can leak URLs). Which origin and which class is looked
      # up from handler logs / `pg-router-ccpool-handler origin status`
      # (docs/runbooks/dispatched-session-git-origin-auth.md).
      - uid: pg-router-origin-unavailable
        title: pg-router dispatch origin is unavailable (dispatches declined)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          # Only a person can clear this (the auth-unavailable class needs an
          # interactive step cert renewal), so pg-router-probe files its bead
          # straight to the operator (pg2-x7ie2).
          escalation: human
        annotations:
          summary: "pg-router is declining dispatches because a watched git origin is unavailable"
          description: 'rate(pg_router_failures_total{reason="origin-unavailable"}[10m]) has stayed above 0 for over 15 minutes. Find the origin and its class with `pg-router-ccpool-handler origin status` or the handler logs, then apply the matching remediation. mount-missing: check that the checkout volume is mounted. auth-unavailable: renew the step cert in an interactive shell. network: check network/VPN connectivity to the git host. timeout: if the handler log shows the step-CA prompt "browser has been opened to visit ... auth", renew the step cert in an interactive shell (same as auth-unavailable); otherwise check network and git host health, then retry. unknown: inspect the handler log for the origin. To stop gating an origin deliberately, use `pg-router-ccpool-handler origin ignore`. Runbook: docs/runbooks/dispatched-session-git-origin-auth.md.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum(rate(pg_router_failures_total{reason="origin-unavailable"}[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Source failure rate: pg_router_source_failures_total, emitted by
      # internal/discover/discover.go's SourceFailureObserver for every
      # query source (not scoped to any specific probe package), aggregated
      # by its `source` label. This is a DIFFERENT metric from
      # pg_router_failures_total above -- a [[query]]'s own backing command
      # failing to run routes through this metric, not the dispatch-side
      # failure-rate rule, so without this rule that failure mode is
      # invisible. Added alongside the pg-router-probe/ccpool-probe
      # self-monitoring system (2026-09-22) specifically so a probe's own
      # failure to run is not itself a silent gap (pg2-93e5s).
      #
      # noDataState: OK is a DECIDED setting (pg2-vicjc, 2026-10-02) -- do not
      # re-open it as "silent green hid the original bug". The counter is
      # created lazily: the OTel Int64Counter exports NO series for a source
      # until that source's first OnSourceFailure (internal/metrics pins this in
      # TestSourceFailureSeriesAbsentUntilFirstFailure), so an absent series is
      # the NORMAL healthy state, not a fault. noDataState NoData/Alerting would
      # therefore fire permanently on every healthy install. It also could not
      # have caught the pg2-jgbnp bug: that bug produced exactly an absent
      # series, indistinguishable from health by data alone; it is guarded by
      # the unit tests on the give-up path instead. A genuinely dead daemon or
      # unreachable /metrics endpoint is already covered by
      # pg-router-liveness-down (noDataState: Alerting), so no separate
      # liveness signal is added here. A source that failed once and then
      # recovers keeps its series at a flat rate of 0, which the threshold
      # (> 0) correctly reads as healthy.
      #
      # Counting contract (pg2-jgbnp, pg2-hsla6): every failed attempt counts
      # once, including a fail-fast source's give-up, and the series carries a
      # `reason` label (rate-limited / unavailable / unauthenticated /
      # timeout / interrupted / error; a router-shutdown cancellation is not
      # counted at all, pg2-zdowv, DEC-OBS-8). This rule's `sum by (source)` deliberately sums
      # the reason away, so a GraphQL rate-limit-reserve breach (reason=
      # rate-limited) fires it exactly like any other failure; do not add a
      # reason matcher here. The 2026-10-01/02 episode (~740 pr-mine/pr-team
      # failures, zero alert) predates the pg2-jgbnp binary; see pg2-hsla6.
      - uid: pg-router-source-failure-rate
        title: pg-router event source failure rate is non-zero (by source)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-router source {{ $labels.source }} has been failing to produce events"
          description: "sum by (source) (rate(pg_router_source_failures_total[10m])) has stayed above 0 for over 10 minutes for source {{ $labels.source }} -- a query's own command is failing, which is invisible to pg_router_failures_total (dispatch-side only). Added alongside the pg-router-probe/ccpool-probe self-monitoring system (2026-09-22) specifically so a probe's own failure to run is not itself a silent gap."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum by (source) (rate(pg_router_source_failures_total[10m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      # Persistent source failure (bead pg2-tv11a, DEC-OBS-4; operator approval
      # Phillip, 2026-10-05). pg-router-source-failure-rate above fires on ANY
      # failure for 10m and had 19 Alerting transitions on 2026-10-05 alone, all
      # transient upstream 502/504 storms where a success always intervened
      # (worst 30m window: ~11 failures in ~30 ticks), so it stays a
      # desktop-only early signal and is deliberately NOT registered with
      # pg-router-probe. THIS rule is the escalation-grade one: it fires only
      # when a source has gone silent for max(3 x its period, 30m), which no
      # transient storm reaches but the real outages do (2026-09-28 bd outage;
      # the 2026-10-01/02 GraphQL rate-limit-reserve episode; thread-me's
      # 2026-10-01 ~4h run of six consecutive failed 30m ticks).
      #
      # Series: pg_router_source_last_success_timestamp_seconds{source} and
      # pg_router_source_expected_interval_seconds{source} (internal/metrics,
      # exported for enabled, non-excluded PULL sources that have a period).
      # last-success advances on a successful pass AND on a pass skipped by a
      # deliberate pause (an active gate or log-limit-halted emitters), so a
      # pg-router pause does not fire this for every source; a failed pass never
      # advances it. It starts at PROCESS START, so a restart resets the clock:
      # a source that keeps failing across restarts re-alerts only after
      # threshold + `for` following each restart.
      #
      # noDataState: OK is deliberate: both series exist from daemon start, so
      # absence means the daemon (or /metrics) is down, which is
      # pg-router-liveness-down's job (noDataState: Alerting). The annotation
      # interpolates only the source label and the age value -- static-safe, no
      # error text or URLs. Replay evidence:
      # internal/alertrules/source_persistent_failure_test.go.
      - uid: pg-router-source-persistent-failure
        title: pg-router event source has not succeeded recently (by source)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-router source {{ $labels.source }} has not succeeded for {{ humanizeDuration $values.B.Value }}"
          description: 'pg-router source {{ $labels.source }} last succeeded {{ humanizeDuration $values.B.Value }} ago, longer than max(3 x its expected interval, 30m) -- it is persistently failing, not a transient blip. Inspect it with: pg-router status --json | jq ''.sources[]|select(.name=="{{ $labels.source }}")|.failure'' and, in Prometheus, sum by (reason)(increase(pg_router_source_failures_total{source="{{ $labels.source }}"}[1h])). A pg-router pause or log-limit halt does NOT trigger this rule (paused passes count as not-a-failure); a restart resets the clock, so a still-failing source re-alerts only after the threshold plus 5m following each restart.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: time() - pg_router_source_last_success_timestamp_seconds > on(source) clamp_min(3 * pg_router_source_expected_interval_seconds, 1800)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      # Event-log size limit (pg2-5d3ui). pg-router caps queue.jsonl (max_log_bytes,
      # default 64MiB): past 90% of it the daemon halts its POLLED command-source
      # emitters (an in-memory flag, NOT a gate -- pg_router_gates_active does not
      # move; listeners, drain, timer emitters and pushed events keep running);
      # at the limit, or when the log cannot be written, it also rejects every
      # new event with a log_full / log_unwritable reason. Either is the daemon
      # running with reduced capability, so this fires on EITHER:
      #   - pg_router_emitters_halted == 1 (soft step, hard limit, or unwritable), or
      #   - any pg_router_enqueue_rejected_total increase in the last 5m (an event
      #     was actually refused, by a push source or a pull/timer source).
      # `for: 10m` keeps a compaction blip (the controller compacts first and
      # clears the halt on the next tick) and a lone refusal from paging; a limit
      # that is genuinely stuck stays true for the whole window. noDataState: OK
      # because the rejected counter is created lazily (an absent series is the
      # healthy state, as for pg-router-source-failure-rate); a dead daemon or
      # unreachable /metrics endpoint is pg-router-liveness-down's job.
      - uid: pg-router-log-limit
        title: pg-router event log is at its size limit (emitters halted or events rejected)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "pg-router event log is near or at its size limit: polled emitters halted and/or events being rejected"
          description: "pg_router_emitters_halted has been 1, or pg_router_enqueue_rejected_total has been increasing, for over 10 minutes: queue.jsonl is past 90% of max_log_bytes (polled emitters halted; listeners, timers and pushed events still run), at the limit (new events rejected with log_full), or unwritable (rejected with log_unwritable). `pg-router status` shows the state (queue log line) and the TUI shows it in the header and a notice. Remedy: wait for queued events to expire (the log compacts automatically); run `pg-router log compact` (or restart pg-router) to compact now - `pg-router log compact --dry-run` previews it; raise PG_ROUTER_MAX_LOG_BYTES (or [pool].max_log_bytes) and restart; or stop the daemon and move queue.jsonl aside (this LOSES the queued events). log_unwritable: free disk space / fix permissions on the log directory (the daemon resumes by itself)."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max(pg_router_emitters_halted) > 0 or sum(increase(pg_router_enqueue_rejected_total[5m])) > 0
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      # Pool full while no session is active (pg2-owccx; operator approval, Phillip,
      # 2026-10-05, session c7a2ef42-bfb6-4c46-ad4e-540354f66bb8: "Alert or file a
      # bead when a lane stays at capacity while its sessions sit idle"). A ccpool
      # pool can be full (free == 0) while none of its counted sessions is doing
      # anything: every slot is held by a session whose turn ended (idle) or that
      # errored, so dispatches for that role are declined at-capacity indefinitely.
      # Nothing else alerts on it: pg-router-failure-rate excludes
      # reason=~at-capacity by design (pg2-v3qn6), and pg-router-queue-stalled needs
      # a queue depth of 10+ for 30m while review.ready events are born-expired
      # (depth stayed 1-3 in the 2026-10-05 stall: review pool held by an idle
      # session, 74 at-capacity declines 16:17-16:52Z, no alert).
      #
      # Four clauses, all joined on the ccpool `pool` label:
      #   - demand (LEFT-hand side, so the alert value is the decline count > 0 and
      #     the instance carries `role`): at-capacity declines in the last 15m,
      #     carrying `role` as of pg2-nimab;
      #   - the pool has no free slot (ccpool_pool_capacity dim=free, emitted about
      #     every 60s by the pg-router-ccpool-handler pool-metrics agent);
      #   - the pool is genuinely FULL: dim=counted >= dim=max_sessions. ccpool
      #     reports free = 0 for the hours an account usage window (five_hour) is at
      #     its limit, whatever the occupancy (session.Capacity.WithUsageLimit), and
      #     the handler tags those declines at-capacity too. Without this clause the
      #     rule fired on every usage-limit window with an EMPTY pool (pg2-nzp3z:
      #     2026-10-06 20:40-22:10Z, counted=0, review declined "usage limit hit"
      #     until the window reset at 22:10Z). That is healthy backpressure, not a
      #     stall; a usage-limited pool that is ALSO held by idle sessions still fires;
      #   - no counted session is active (ccpool_session_states, emitted on each
      #     ccpool-reap run, every 300s -- near Prometheus' 5m staleness, hence
      #     last_over_time over 10m): none starting, ready or working.
      #
      # ROLE -> POOL MAPPING depends on the nix `pg-router-ccpool-<role>` poolDir
      # convention (home/programs/pg-router-ccpool-handler/default.nix): the review,
      # worker and feedback roles have dedicated pools named pg-router-ccpool-<role>
      # (pool = pool dir basename); the triagers (*triager) have no poolDir and share
      # the handler pool `pg-router-ccpool`; command roles (desk-*) have no pool at
      # all. So the mapping is EXPLICIT per role group -- mapping every role with
      # "(.*)" would invent pools like pg-router-ccpool-desk-pr. A new role with its
      # own pool, or a renamed pool dir, MUST be added here (and to the promtool
      # cases in grafana/alerting/rule-tests/).
      #
      # LIMIT: for pools with more than one slot (worker max 3, handler pool max 6)
      # the sum over counted active states is 0 only when NO slot is active, so this
      # fires only when NO slot is active; "some slots idle while others work" is out
      # of scope. noDataState: OK because the expression normally returns nothing
      # (no demand, or a slot free, or a session working is the healthy state).
      #
      # Depends on pg2-58edz (the handler closes its settled session on every
      # terminal outcome, freeing the max=1 review slot) -- before it, every review
      # demanded during a 30-minute idle_ttl hold would have fired this rule.
      - uid: pg-router-pool-full-idle
        title: ccpool pool is full but no session is active
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "ccpool pool {{ $labels.pool }} is full but no session is active; {{ $labels.role }} dispatches are declined at-capacity"
          description: "Every slot of ccpool pool {{ $labels.pool }} is held (ccpool_pool_capacity counted >= max_sessions, so free is 0) while no counted session is starting, ready or working, and {{ $labels.role }} dispatches were declined at-capacity in the last 15 minutes: the slots are held by idle or errored counted sessions, so the lane is stalled at capacity. Inspect with `ccpool --pool ~/.local/state/{{ $labels.pool }} list --json`. For a pool with more than one slot this fires only when NO slot is active."
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: (label_replace(sum by (role)(increase(pg_router_failures_total{class="declined",reason="at-capacity",role=~"review|worker|feedback"}[15m])), "pool", "pg-router-ccpool-$1", "role", "(.*)") or label_replace(sum by (role)(increase(pg_router_failures_total{class="declined",reason="at-capacity",role=~".*triager"}[15m])), "pool", "pg-router-ccpool", "", "")) > 0 and on(pool) (max by (pool)(last_over_time(ccpool_pool_capacity{dim="free"}[10m])) == 0) and on(pool) (max by (pool)(last_over_time(ccpool_pool_capacity{dim="counted"}[10m])) >= on(pool) max by (pool)(last_over_time(ccpool_pool_capacity{dim="max_sessions"}[10m]))) and on(pool) (sum by (pool)(last_over_time(ccpool_session_states{live="true",state=~"starting|ready|working"}[10m])) == 0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
