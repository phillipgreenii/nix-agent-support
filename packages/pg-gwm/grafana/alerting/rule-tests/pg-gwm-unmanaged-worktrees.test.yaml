# promtool unit tests for the pg-gwm-unmanaged-worktrees alert. Run by the flake check
# test-pg-gwm-alert-rules through check-alert-rules.sh, which generates rules.yml next to
# this file (see pg-gwm-exporter-down.test.yaml). promtool's clock starts at 0.
rule_files:
  - rules.yml

evaluation_interval: 1m

# The gauge is rewritten by the weekly audit and served by pg-gwm serve, so it holds its value
# between audits. noDataState is OK (pinned by check-alert-rules.sh): before the first audit
# there is no series.
tests:
  - name: a count above zero fires
    interval: 1m
    input_series:
      - series: pg_gwm_unmanaged_worktrees
        values: "0 0 2x30"
    alert_rule_test:
      - eval_time: 1m
        alertname: pg-gwm-unmanaged-worktrees
        exp_alerts: []
      - eval_time: 10m
        alertname: pg-gwm-unmanaged-worktrees
        exp_alerts:
          - exp_labels:
              severity: warning

  - name: a count of zero stays quiet
    interval: 1m
    input_series:
      - series: pg_gwm_unmanaged_worktrees
        values: "0x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: pg-gwm-unmanaged-worktrees
        exp_alerts: []

  - name: clearing the strays resolves the alert
    interval: 1m
    input_series:
      - series: pg_gwm_unmanaged_worktrees
        values: "3x10 0x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: pg-gwm-unmanaged-worktrees
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 25m
        alertname: pg-gwm-unmanaged-worktrees
        exp_alerts: []
