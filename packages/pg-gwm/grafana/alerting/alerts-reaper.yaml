# pg-gwm-reaper-stale, the only rule of this file. It has noDataState Alerting: a reaper that has
# never run leaves no series, and that is the failure the rule reports. So the deployment registers
# this file only in the change that enables the reaper; it is never loaded before then and needs no
# delete twin. The rule is in the router probe's registeredRuleUIDs.
#
# The expression takes the larger of the last successful run's age (no repository label) and each
# repository's last-reap age, so either going over 1800 seconds (three 600-second reaper
# intervals) fires. A repository whose reap keeps being skipped keeps its entry and ages until this
# fires.
#
# The expression reads each age through last_over_time over 5 minutes (five 1-minute scrape
# intervals), so one or a few timed-out scrapes, which leave stale markers and an empty instant
# query, do not fire the rule while the last recorded age is under 1800 seconds. The rule still
# fires when an age is over 1800 seconds, and through noDataState Alerting when no sample exists in
# the whole window (the reaper never ran, or the exporter has been unreadable for over 5 minutes;
# the exporter-down rule names the second case). The exporter also bounds its git work to 60 percent
# of the scrape timeout, so a scrape under host load still carries these ages.
#
# Host sleep gate (the awake gate of pg-router-liveness-down and pg-router-sensor-stale in the
# pg-router alerts). The reaper is a launchd agent and does not run while the host sleeps, so its
# wall-clock ages keep growing through a sleep, and the first evaluation after a wake finds no
# sample at all (Prometheus did not scrape while asleep); both used to page though the reaper was
# healthy. The expression is
#   (<ages> and on() <settled>) or (vector(0) unless on() <settled>)
# where <settled> is host-activity's full-wake timestamp newer than its last-sleep timestamp (or
# no sleep ever recorded, or neither gauge exported while host_power_transitions_total is present
# AND Prometheus has scraped pg-gwm continuously: count_over_time(up{job="pg-gwm"}[5m]) >= 4)
# AND that wake more than 600 seconds ago (one reaper interval, so the reaper has had one run since
# the wake before a wall-clock age counts). While the host sleeps, or has just woken, <settled> is
# empty and the second branch returns a single 0 sample: Normal, not NoData.
#
# Dark wake (chosen fix: gate on Prometheus's own scrape continuity, the alert-side direction).
# The "neither gauge exported" arm used to be true whenever both host_power gauges had aged out of
# the 5 minute lookback while the counters were present, which is exactly a dark wake more than
# 5 minutes after the last push: the gate then read "awake and settled", the age branch was empty
# (no pg-gwm scrape during the sleep) and noDataState fired. That arm now also requires at least 4
# samples of up{job="pg-gwm"} in the last 5 minutes (up is written on every scrape, failed ones
# included). A sleep, a dark wake or a Prometheus restart leaves too few samples and closes the
# gate (Normal, via the vector(0) branch), while an exporter that is down or a reaper that never
# ran, with the host awake and Prometheus scraping, still fires.
#
# While the host is awake and settled, the first branch applies unchanged: an age over 1800 fires, and no age series
# at all (the reaper never ran) is empty, so noDataState Alerting fires. Cases:
# rule-tests/pg-gwm-reaper-stale.test.yaml.
apiVersion: 1
groups:
  - orgId: 1
    name: pg-gwm-reaper
    folder: Claude Agents
    interval: 1m
    rules:
      - uid: pg-gwm-reaper-stale
        title: pg-gwm reaper is stale
        condition: C
        for: 0m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "The pg-gwm reaper has not completed a reap for over 30 minutes"
          description: "pg_gwm_reaper_last_success_age_seconds or pg_gwm_last_reap_age_seconds is above 1800 seconds (three reaper intervals), or the reaper has never run. Check the reaper launchd agent and its log, then run pg-gwm reap --all-repos by hand and read its warnings."
          __dashboardUid__: pg-gwm
          __panelId__: "10"
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '(max by (repo) (last_over_time({__name__=~"pg_gwm_reaper_last_success_age_seconds|pg_gwm_last_reap_age_seconds"}[5m])) and on() (((host_power_last_wake_timestamp_seconds{kind="full"} > on() host_power_last_sleep_timestamp_seconds) and on() (time() - host_power_last_wake_timestamp_seconds{kind="full"} > 600)) or ((host_power_last_wake_timestamp_seconds{kind="full"} unless on() host_power_last_sleep_timestamp_seconds) and on() (time() - host_power_last_wake_timestamp_seconds{kind="full"} > 600)) or (absent(host_power_last_wake_timestamp_seconds{kind="full"}) and on() absent(host_power_last_sleep_timestamp_seconds) and on() count(host_power_transitions_total) and on() (count_over_time(up{job="pg-gwm"}[5m]) >= 4)))) or (vector(0) unless on() (((host_power_last_wake_timestamp_seconds{kind="full"} > on() host_power_last_sleep_timestamp_seconds) and on() (time() - host_power_last_wake_timestamp_seconds{kind="full"} > 600)) or ((host_power_last_wake_timestamp_seconds{kind="full"} unless on() host_power_last_sleep_timestamp_seconds) and on() (time() - host_power_last_wake_timestamp_seconds{kind="full"} > 600)) or (absent(host_power_last_wake_timestamp_seconds{kind="full"}) and on() absent(host_power_last_sleep_timestamp_seconds) and on() count(host_power_transitions_total) and on() (count_over_time(up{job="pg-gwm"}[5m]) >= 4))))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1800]
