# operator — user-pairing companion agent.
#
# Created 2026-05-19 to keep the mayor's coordination role unblocked
# while the user has long working sessions. mayor fields escalation
# mail and routes work; operator is the human's pairing partner for
# refactors, debugging, planning, and any sustained terminal work.
#
# operator does NOT:
#   - Take action on escalation mail (mayor's job).
#   - Patrol or watch (deacon's job).
#   - Pour wisps from formulas (polecat / dogs).
# operator DOES whatever the user asks in-conversation.

scope = "city"
wake_mode = "fresh"
work_dir = ".gc/agents/operator"
nudge = "Standing by for user instructions."
idle_timeout = "2h"
max_active_sessions = 1
