# TODO: Re-evaluate this copy once the city reaches a fully working state
# with all expected features. This agent was scaffolded on 2026-05-14 by
# copying `.gc/system/packs/gastown/agents/deacon/{agent.toml,prompt.template.md}`
# into the city-level `agents/` directory rather than enabling pack-managed
# agents (which would have wired deacon in automatically via gastown's
# `[[named_session]]` declarations).
#
# We chose the copy because:
#   1. The city already manages agents at city-level — `agents/mayor/`
#      uses a 53-line custom prompt instead of gastown's 237-line one,
#      and `agents/{pr-self-fixer,pr-reviewer,pr-triage}/` aren't in the
#      gastown system pack at all.
#   2. Switching to pack management (`workspace.pack = "gastown"` etc.)
#      would auto-include deacon BUT would also try to manage mayor and
#      pull in other defaults, risking the existing customizations.
#
# Reconsider when:
#   - The city is stable and the agents/ directory is the only
#     remaining city-level override, OR
#   - You want deacon to track upstream gastown changes automatically.
# At that point: import the gastown pack and remove this copied
# scaffold (so the pack's version wins).

scope = "city"
wake_mode = "fresh"
work_dir = ".gc/agents/deacon"
nudge = "Run 'gc prime' to check patrol status and begin heartbeat cycle."
idle_timeout = "1h"
max_active_sessions = 1
